name: Update Marine Areas

# The seas and oceans of the water dirs (geocoder/builder/tools/marine_import.py): Marine Regions' EEZ-IHO
# intersect cut to the water off osmdata.openstreetmap.de's land polygons, published as a version of its own
# under geocoder/marine/<version>/. Run by hand, rarely: the nightly builds from the version
# geocoder/builder/data/marine.json pins, so the marine areas don't change from one day to the next. Once a
# run publishes, commit the pin its summary gives.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (YYYYMMDD). Leave empty for today.'
        required: false
        type: string

env:
  S3_BUCKET: geoshenanigans-reverse-geocoding
  S3_ENDPOINT: https://t3.storage.dev
  # Marine Regions' WFS serves the whole layer with no form to fill in. The intersect of the Exclusive
  # Economic Zones and IHO sea areas, version 5 (2024), CC BY 4.0.
  EEZ_IHO_URL: https://geo.vliz.be/geoserver/MarineRegions/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=MarineRegions:eez_iho&outputFormat=application/json
  # OpenStreetMap's land polygons from its coastline, split, WGS84 (ODbL), as osmdata regenerates them.
  LAND_URL: https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip

permissions:
  contents: read

# One run at a time, the next waiting for the last to finish: a run checks that its version is new before it
# uploads, which only holds while no other run can upload in between.
concurrency:
  group: geocoder-marine
  cancel-in-progress: false

jobs:
  marine:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The geometry's versions are pinned, so a run of the same sources gives the same file.
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zstd unzip
          curl -sSfL "https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Linux-64bit.tar.gz" \
            -o "$RUNNER_TEMP/s5cmd.tar.gz"
          # The tarball's sha256, from the release's s5cmd_checksums.txt.
          echo "de0fdbfa3aceae55e069ba81a0fc17b2026567637603734a387b2fca06c299b4  $RUNNER_TEMP/s5cmd.tar.gz" | sha256sum -c --quiet -
          sudo tar xzf "$RUNNER_TEMP/s5cmd.tar.gz" -C /usr/local/bin s5cmd
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q shapely==2.2.0 pyogrio==0.13.0 numpy==2.5.5
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import shapely, pyogrio; print("shapely", shapely.__version__, "GEOS", shapely.geos_version_string, "pyogrio", pyogrio.__version__)'

      # Only the two steps that list and upload to the bucket hold its write key, in their own env: the fetch
      # and the build, which parse the sources from outside, run without it.
      - name: Version
        env:
          REQUESTED: ${{ inputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_WRITE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_WRITE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          VERSION=${REQUESTED:-$(date -u +%Y%m%d)}
          if ! [[ "$VERSION" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Version '$VERSION' is not YYYYMMDD"
            exit 1
          fi
          # A version a pin names must stay as it was published. A listing that fails for any other reason than
          # an empty prefix says nothing either way, so the run stops.
          if LISTED=$(s5cmd --endpoint-url "$S3_ENDPOINT" ls "s3://$S3_BUCKET/geocoder/marine/$VERSION/*" 2>&1); then
            # A version's manifest.json goes up last: a prefix of the file alone is a run that stopped between
            # the two, which this run finishes if it builds the same file (Upload checks).
            if grep -Eq '(^|[ /])manifest\.json$' <<< "$LISTED" ||
              ! grep -Eq '(^|[ /])marine_areas\.bin\.zst$' <<< "$LISTED"; then
              echo "::error::Marine areas $VERSION are already published; pick another version"
              exit 1
            fi
            echo "::notice::Marine areas $VERSION have no manifest.json: this run finishes them if it builds the same file"
            echo "UNFINISHED=true" >> "$GITHUB_ENV"
          elif ! grep -q 'no object found' <<< "$LISTED"; then
            echo "::error::Could not tell whether marine areas $VERSION are published: $LISTED"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test the tool
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -I -m unittest discover -s geocoder/builder/tools -p test_marine_import.py -v \
            2>&1 | tee "$RUNNER_TEMP/tests.log"
          # With shapely, numpy and pyogrio installed, the geometry tests run: none may be skipped.
          if grep -q 'skipped' "$RUNNER_TEMP/tests.log"; then
            echo "::error::marine_import.py's geometry tests were skipped"
            exit 1
          fi

      - name: Fetch the sources
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/marine-src"
          mkdir -p "$SRC"
          curl -sSfL --retry 3 --retry-delay 30 --connect-timeout 30 -o "$SRC/eez_iho.geojson" "$EEZ_IHO_URL"
          # The WFS returns at most its server's cap of features, as a whole document all the same: only its
          # counts tell a part of the layer from all of it, and a download without them stops the run too.
          COMPLETE='.numberMatched == .numberReturned and .numberReturned == (.features | length)'
          if ! jq -e "$COMPLETE" "$SRC/eez_iho.geojson" > /dev/null; then
            echo "::error::The WFS gave a part of the sea areas, not the whole layer: $(jq -c '{numberMatched, numberReturned, features: (.features | length)}' "$SRC/eez_iho.geojson")"
            exit 1
          fi
          curl -sSfL --retry 3 --retry-delay 30 --connect-timeout 30 -o "$SRC/land-polygons-split-4326.zip" "$LAND_URL"
          LAND_DATE=$(unzip -p "$SRC/land-polygons-split-4326.zip" '*/README.txt' | sed -n 's/^Date of the data used is //p' | head -1)
          echo "LAND_DATE=$LAND_DATE" >> "$GITHUB_ENV"
          for f in eez_iho.geojson land-polygons-split-4326.zip; do
            echo "$f: $(stat -c%s "$SRC/$f") bytes, sha256 $(sha256sum "$SRC/$f" | cut -c1-64)"
          done
          echo "Land polygons of $LAND_DATE"

      - name: Build the marine areas
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/marine-src"
          OUT="$RUNNER_TEMP/marine-out"
          mkdir -p "$OUT"
          "$RUNNER_TEMP/venv/bin/python" -I geocoder/builder/tools/marine_import.py build \
            --eez-iho "$SRC/eez_iho.geojson" --land "$SRC/land-polygons-split-4326.zip" \
            -o "$OUT/marine_areas.bin" --stats "$OUT/stats.json" --workers "$(nproc)"
          "$RUNNER_TEMP/venv/bin/python" -I geocoder/builder/tools/marine_import.py stats "$OUT/marine_areas.bin" | tail -1
          # A source that parses but holds no sea areas gives a file of none, which no version may publish. The
          # oceans are some of the objects: a sea is an object more than the oceans.
          if ! jq -e '.objects > .oceans and .oceans > 0 and .polygons > 0' "$OUT/stats.json" > /dev/null; then
            echo "::error::The marine areas came out without a sea, an ocean or a polygon: $(jq -c . "$OUT/stats.json")"
            exit 1
          fi
          zstd -19 -T0 -q "$OUT/marine_areas.bin" -o "$OUT/marine_areas.bin.zst"

      - name: Upload to Tigris
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_WRITE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_WRITE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/marine-src"
          OUT="$RUNNER_TEMP/marine-out"
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5"
          SHA=$(sha256sum "$OUT/marine_areas.bin.zst" | cut -c1-64)
          jq -n \
            --arg version "$VERSION" \
            --arg path "marine/$VERSION/marine_areas.bin.zst" \
            --arg sha256 "$SHA" \
            --argjson size "$(stat -c%s "$OUT/marine_areas.bin.zst")" \
            --arg raw_sha256 "$(sha256sum "$OUT/marine_areas.bin" | cut -c1-64)" \
            --argjson raw_size "$(stat -c%s "$OUT/marine_areas.bin")" \
            --arg eez_iho_url "$EEZ_IHO_URL" \
            --arg eez_iho_sha256 "$(sha256sum "$SRC/eez_iho.geojson" | cut -c1-64)" \
            --arg land_url "$LAND_URL" \
            --arg land_sha256 "$(sha256sum "$SRC/land-polygons-split-4326.zip" | cut -c1-64)" \
            --arg land_date "$LAND_DATE" \
            --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile stats "$OUT/stats.json" \
            '{version: $version, path: $path, sha256: $sha256, size: $size, raw_sha256: $raw_sha256, raw_size: $raw_size,
              sources: {eez_iho: {url: $eez_iho_url, sha256: $eez_iho_sha256},
                        land: {url: $land_url, sha256: $land_sha256, data_date: $land_date}},
              stats: $stats[0], commit: $commit, built_at: $built_at}' > "$OUT/manifest.json"
          cat "$OUT/manifest.json"
          if [ "${UNFINISHED:-}" = true ]; then
            # The file a run before this one uploaded without its manifest.json: this run finishes the version
            # only if it built the same file.
            HELD=$($S5 cat "s3://$S3_BUCKET/geocoder/marine/$VERSION/marine_areas.bin.zst" | sha256sum | cut -c1-64)
            if [ "$HELD" != "$SHA" ]; then
              echo "::error::Marine areas $VERSION hold another marine_areas.bin.zst (sha256 $HELD) than this run built ($SHA); pick another version"
              exit 1
            fi
            echo "Marine areas $VERSION hold this run's marine_areas.bin.zst already"
          else
            $S5 cp "$OUT/marine_areas.bin.zst" "s3://$S3_BUCKET/geocoder/marine/$VERSION/marine_areas.bin.zst"
          fi
          $S5 cp "$OUT/manifest.json" "s3://$S3_BUCKET/geocoder/marine/$VERSION/manifest.json"
          {
            echo "## Marine areas $VERSION"
            echo ""
            echo "Land polygons of $LAND_DATE. To build with them, commit as geocoder/builder/data/marine.json:"
            echo ""
            echo '```json'
            jq --arg version "$VERSION" --arg path "marine/$VERSION/marine_areas.bin.zst" --arg sha256 "$SHA" \
              '.version = $version | .path = $path | .sha256 = $sha256' geocoder/builder/data/marine.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
