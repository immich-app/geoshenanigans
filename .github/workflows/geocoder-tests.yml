name: Geocoder Tests

on:
  pull_request:
    paths:
      - "geocoder/builder/**"
      - "geocoder/node/**"
      - "geocoder/search/**"
      - "geocoder/server/**"
      - ".github/workflows/geocoder-tests.yml"
      # The tool tests read the nightly's package list.
      - ".github/workflows/geocoder-build.yml"

permissions:
  contents: read

jobs:
  builder-tests:
    name: Builder unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev libzstd-dev zstd
      # The patcher's too-small-TMPDIR cases mount a tmpfs in a private user
      # namespace (unshare), which the image's AppArmor policy forbids; here
      # they must run (GEOCODER_TESTS_NEED_PRIVATE_TMPFS fails them if not).
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build + run tests
        env:
          GEOCODER_TESTS_NEED_PRIVATE_TMPFS: "1"
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) geocoder-tests
          ./geocoder-tests
      # The patcher on the zstd CLI (-DGEOCODER_PATCH_LIBZSTD=OFF), for a host
      # without libzstd: the build above reconfigured, so the patcher and the
      # tests recompile but not the other tools, and the tests run again.
      - name: Build + run tests (zstd CLI)
        env:
          GEOCODER_TESTS_NEED_PRIVATE_TMPFS: "1"
        run: |
          cd geocoder/builder/build
          cmake .. -DGEOCODER_PATCH_LIBZSTD=OFF
          make -j"$(nproc)" geocoder-tests
          ./geocoder-tests
      - name: Tool tests
        run: python3 -m unittest discover -s geocoder/builder/tools -v

  # The tests and the tools they run, sanitized, with the patcher's in-process
  # zstd (the default build); the job above runs the zstd CLI build too.
  builder-tests-sanitized:
    name: Builder unit tests (ASan + UBSan, libzstd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev libzstd-dev zstd
      # As in the job above: the private tmpfs cases run, or fail.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build + run tests
        env:
          GEOCODER_TESTS_NEED_PRIVATE_TMPFS: "1"
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEOCODER_SANITIZE=ON -DGEOCODER_PATCH_LIBZSTD=ON
          make -j$(nproc) geocoder-tests
          ./geocoder-tests

  # The nightly links the static S2 and abseil tools/build_s2.sh builds. Its
  # cache, saved on main, has this key and path, so a PR rebuilds them only
  # when the script changes.
  build-index-release-s2:
    name: Build index (release S2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev libssl-dev libzstd-dev patch xz-utils
      - name: Restore S2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .s2-prefix
          key: s2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('geocoder/builder/tools/build_s2.sh') }}
      - name: Build S2
        timeout-minutes: 30
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if (cd .s2-prefix 2> /dev/null && sha256sum -c --quiet SHA256SUMS); then exit 0; fi
          rm -rf .s2-prefix
          TMPDIR="$RUNNER_TEMP" geocoder/builder/tools/build_s2.sh .s2-prefix
      - name: Build index + run S2 tests
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGEOCODER_S2_PREFIX="$GITHUB_WORKSPACE/.s2-prefix"
          make -j$(nproc) build-index geocoder-s2-tests
          ./geocoder-s2-tests

  server-tests:
    name: Server unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The tag, not the stable branch: that branch is regenerated, and a
      # pinned commit of it drops out of the repository's history.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test
        run: |
          cd geocoder/server
          cargo test --release

  search-tests:
    name: Place search unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test
        run: |
          cd geocoder/search
          cargo test --release --locked

  node-tests:
    name: Node binding tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: geocoder/node/.nvmrc
      - name: Build + test
        run: |
          cd geocoder/node
          cargo build --release --locked
          node --test test/*.test.mjs
