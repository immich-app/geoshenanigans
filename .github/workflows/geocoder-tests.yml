name: Geocoder Tests

on:
  pull_request:
    paths:
      - "geocoder/builder/**"
      - "geocoder/server/**"
      - ".github/workflows/geocoder-tests.yml"

permissions:
  contents: read

jobs:
  builder-tests:
    name: Builder unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev zstd
      - name: Build + run tests
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) geocoder-tests
          ./geocoder-tests
      - name: Tool tests
        run: python3 -m unittest discover -s geocoder/builder/tools -v

  builder-tests-sanitized:
    name: Builder unit tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev
      - name: Build + run tests
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DGEOCODER_SANITIZE=ON
          make -j$(nproc) geocoder-tests
          ./geocoder-tests

  # The nightly links the static S2 and abseil tools/build_s2.sh builds. Its
  # cache, saved on main, has this key and path, so a PR rebuilds them only
  # when the script changes.
  build-index-release-s2:
    name: Build index (release S2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake zlib1g-dev libprotozero-dev \
            libbz2-dev libdeflate-dev libexpat1-dev libssl-dev patch xz-utils
      - name: Restore S2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .s2-prefix
          key: s2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('geocoder/builder/tools/build_s2.sh') }}
      - name: Build S2
        timeout-minutes: 30
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          if (cd .s2-prefix 2> /dev/null && sha256sum -c --quiet SHA256SUMS); then exit 0; fi
          rm -rf .s2-prefix
          TMPDIR="$RUNNER_TEMP" geocoder/builder/tools/build_s2.sh .s2-prefix
      - name: Build index + run S2 tests
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DGEOCODER_S2_PREFIX="$GITHUB_WORKSPACE/.s2-prefix"
          make -j$(nproc) build-index geocoder-s2-tests
          ./geocoder-s2-tests

  server-tests:
    name: Server unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The tag, not the stable branch: that branch is regenerated, and a
      # pinned commit of it drops out of the repository's history.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Test
        run: |
          cd geocoder/server
          cargo test --release
