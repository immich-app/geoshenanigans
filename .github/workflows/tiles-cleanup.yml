name: Tiles Cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 3 * * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup ${{ matrix.environment }}
    # Main's tfvars say what's live; on another branch they could be stale.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    # The environment's deploy lock (tiles-deploy.yml): only that environment publishes into its area, so nothing
    # is deleted while a deploy is in flight.
    concurrency:
      group: tiles-deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ matrix.environment == 'prod' && secrets.OP_TF_PROD_ENV || secrets.OP_TF_DEV_ENV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Main as it is once the lock is held, with history so the script can find the previous deployment.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: token
        uses: immich-app/devtools/actions/create-workflow-token@2760f037fd3707bb91b16e4c41dc62b8c512393e # create-workflow-token-action-v3.1.0
        with:
          client-id: ${{ secrets.PUSH_O_MATIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUSH_O_MATIC_APP_KEY }}
          permission-contents: read

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@caac7f7e4298458a14238959504f411fc6cc7f06 # use-mise-action-v3.2.3
        with:
          github_token: ${{ steps.token.outputs.token }}

      - name: Delete old deployments
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: op run --env-file=deployment/tiles-deploy.env -- deployment/scripts/tiles-cleanup.sh "$ENVIRONMENT" ${DRY_RUN:+"$DRY_RUN"}
