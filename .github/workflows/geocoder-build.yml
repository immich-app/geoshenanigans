name: Build Geocoder Index

concurrency:
  group: geocoder-build
  cancel-in-progress: false

on:
  schedule:
    # Daily at 06:17 UTC. OSM publishes its daily replication diff
    # shortly after 00:00 UTC; 06:17 leaves headroom if their pipeline
    # slips. Off the hour because GitHub delays or drops top-of-hour
    # schedule events under load, and the watchdog never starts a
    # day's first attempt. Manual dispatch below still works for
    # ad-hoc runs.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      build_date:
        description: 'Build a specific date (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'pokedex-giant'
      force_fresh:
        description: 'Ignore previous build and build fresh (no patch)'
        required: false
        type: boolean
        default: false

env:
  S3_BUCKET: geoshenanigans-reverse-geocoding
  S3_PREFIX: geocoder
  S3_ENDPOINT: https://t3.storage.dev
  S3_PUBLIC_URL: https://geoshenanigans-reverse-geocoding.t3.tigrisfiles.io
  # Tigris retention, in days counting the build's own date: full indexes,
  # then patches plus configurations.json. Finalize publishes the matching
  # oldest_indexes / oldest_patches in latest.json; cleanup enforces them.
  KEEP_FULL_DAYS: 3
  KEEP_PATCH_DAYS: 14
  # memwatch/<run id>.log, the build's memory samples (debugging only).
  KEEP_MEMWATCH_DAYS: 14

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'pokedex-giant' }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # ── Setup ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libz-dev libzstd-dev \
            libbz2-dev libexpat1-dev libs2-dev libosmium2-dev aria2 jq osmium-tool
          curl -sL "https://github.com/peak/s5cmd/releases/download/v2.3.0/s5cmd_2.3.0_Linux-64bit.tar.gz" \
            -o /tmp/s5cmd.tar.gz
          sudo tar xzf /tmp/s5cmd.tar.gz -C /usr/local/bin s5cmd

      - name: Configure credentials
        run: |
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "CACHE_AWS_KEY=$AWS_ACCESS_KEY_ID" >> "$GITHUB_ENV"
          echo "CACHE_AWS_SECRET=$AWS_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_ACCESS_KEY_ID=$KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$SECRET" >> "$GITHUB_ENV"
        env:
          KEY: ${{ secrets.TIGRIS_WRITE_KEY_ID }}
          SECRET: ${{ secrets.TIGRIS_WRITE_ACCESS_KEY }}

      - name: Build tools
        run: |
          cd geocoder/builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) build-index geocoder-diff geocoder-patch pbf-apply geocoder-tests
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run builder tests
        run: |
          # Unit tests gate the build: the suite locks in parity-critical
          # pure functions (postcode validation, patch format, id
          # allocator) that a broken toolchain or bad merge would corrupt
          # long before the multi-hour planet build surfaces it.
          cd geocoder/builder/build && ./geocoder-tests

      - name: Setup
        id: setup
        env:
          BUILD_DATE: ${{ inputs.build_date }}
          FORCE_FRESH: ${{ inputs.force_fresh }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          # Workdir + cache config
          WORKDIR="$RUNNER_TEMP/geocoder"
          mkdir -p "$WORKDIR"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          # Scratch on disk for every later step: /tmp on the runner is a RAM
          # disk that counts against the job's memory limit.
          mkdir -p "$WORKDIR/tmp"
          echo "TMPDIR=$WORKDIR/tmp" >> "$GITHUB_ENV"
          echo "cache_endpoint=http://${BUCKET_HOST}:${BUCKET_PORT}" >> "$GITHUB_OUTPUT"
          echo "cache_bucket=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

          # Determine target date + sequence
          SERVER="https://planet.openstreetmap.org/replication/day"
          # An unread state would publish under an empty date (builds//,
          # latest.json {"latest": ""}), so fail the run instead.
          STATE=$(curl -sSL --fail --retry 5 --retry-delay 30 --retry-all-errors "$SERVER/state.txt") \
            || { echo "::error::Could not fetch $SERVER/state.txt"; exit 1; }
          CURRENT_SEQ=$(echo "$STATE" | grep sequenceNumber | cut -d= -f2 | tr -d '[:space:]')
          CURRENT_DATE=$(echo "$STATE" | grep timestamp | cut -d= -f2 | tr '\\' ' ' | cut -dT -f1 | tr -d ' ')
          if ! [[ "$CURRENT_SEQ" =~ ^[0-9]+$ && "$CURRENT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Unexpected replication state (seq='$CURRENT_SEQ' date='$CURRENT_DATE')"
            exit 1
          fi

          TARGET_DATE="${BUILD_DATE:-$CURRENT_DATE}"
          PREV_DATE=$(date -u -d "$TARGET_DATE - 1 day" +%Y-%m-%d)
          DAYS_OFFSET=$(( ($(date -u -d "$CURRENT_DATE" +%s) - $(date -u -d "$TARGET_DATE" +%s)) / 86400 ))
          TARGET_SEQ=$((CURRENT_SEQ - DAYS_OFFSET))
          if [ "$DAYS_OFFSET" -lt 0 ]; then
            echo "::error::Build date $TARGET_DATE is newer than the replication state ($CURRENT_DATE, seq $CURRENT_SEQ): its diff is not published yet"
            exit 1
          fi

          echo "today=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "yesterday=$PREV_DATE" >> "$GITHUB_OUTPUT"
          echo "today_seq=$TARGET_SEQ" >> "$GITHUB_OUTPUT"

          echo "Build date: $TARGET_DATE (seq $TARGET_SEQ)"
          echo "Previous:   $PREV_DATE"
          echo "Server:     $CURRENT_DATE (seq $CURRENT_SEQ, offset: -${DAYS_OFFSET}d)"

          # Check if previous build exists on Tigris with compatible build_version.
          # Look for an index file, not just the directory: dates past the
          # full-index window keep configurations.json beside their patches.
          EXPECTED_BUILD_VERSION=$(jq -r .build.version "$GITHUB_WORKSPACE/geocoder/builder/configurations.template.json")
          PREV_BUILD="s3://$S3_BUCKET/$S3_PREFIX/builds/$PREV_DATE"
          if [ "$FORCE_FRESH" = "true" ]; then
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            echo "force_fresh=true requested — building fresh (ignoring $PREV_DATE)"
          elif [ -n "$(s5cmd --endpoint-url $S3_ENDPOINT ls "$PREV_BUILD/planet/full/*.bin.zst" 2>/dev/null)" ]; then
            # Check build_version in previous configurations.json. Falls back
            # to the legacy manifest.json for very old builds. Final
            # fallback: a configurations.json with schema_version=1 but no
            # build.version field is from the migration build (2026-04-27)
            # — treat that schema_version as the compatibility marker so
            # the first patching build doesn't have to wait a day to
            # bootstrap.
            PREV_CFG=$(s5cmd --endpoint-url $S3_ENDPOINT cat "$PREV_BUILD/configurations.json" 2>/dev/null || echo "")
            PREV_VERSION=$(echo "$PREV_CFG" | jq -r '.build.version // 0' 2>/dev/null || echo 0)
            if [ "$PREV_VERSION" = "0" ]; then
              PREV_SCHEMA=$(echo "$PREV_CFG" | jq -r '.schema_version // 0' 2>/dev/null || echo 0)
              if [ "$PREV_SCHEMA" = "1" ]; then
                PREV_VERSION="$EXPECTED_BUILD_VERSION"
                echo "Previous build's configurations.json has schema_version=1 but no build.version (migration build) — treating as compatible"
              fi
            fi
            if [ "$PREV_VERSION" = "0" ]; then
              PREV_VERSION=$(s5cmd --endpoint-url $S3_ENDPOINT cat "$PREV_BUILD/manifest.json" 2>/dev/null \
                | jq -r '.build_version // 0' 2>/dev/null || echo 0)
            fi
            if [ "$PREV_VERSION" = "$EXPECTED_BUILD_VERSION" ]; then
              echo "has_previous=true" >> "$GITHUB_OUTPUT"
              echo "Previous build ($PREV_DATE) found, build_version=$PREV_VERSION — compatible"
            else
              echo "has_previous=false" >> "$GITHUB_OUTPUT"
              echo "Previous build ($PREV_DATE) found but build_version=$PREV_VERSION (expected $EXPECTED_BUILD_VERSION) — incompatible, building fresh"
            fi
          else
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            echo "No previous full index ($PREV_DATE) — building fresh"
          fi

      # ── Download PBF + previous indexes (parallel) ─────────────────
      - name: Download PBF and previous indexes
        id: download
        # Hard cap on the whole download phase. Reference: runs take 9 to
        # 26.5 min (PBF + ~89 GiB of compressed indexes in parallel, the
        # slow end on a Tigris fallback). 60 min absorbs a slow mirror
        # without letting a wedged urllib/curl call park the runner overnight.
        timeout-minutes: 60
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
          CACHE_ENDPOINT: ${{ steps.setup.outputs.cache_endpoint }}
          CACHE_BUCKET: ${{ steps.setup.outputs.cache_bucket }}
          YESTERDAY: ${{ steps.setup.outputs.yesterday }}
          TODAY: ${{ steps.setup.outputs.today }}
          HAS_PREVIOUS: ${{ steps.setup.outputs.has_previous }}
        run: |
          CACHE="env AWS_ACCESS_KEY_ID=$CACHE_AWS_KEY AWS_SECRET_ACCESS_KEY=$CACHE_AWS_SECRET s5cmd --endpoint-url $CACHE_ENDPOINT --retry-count 5 --numworkers 15"
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5 --numworkers 32"
          STEP_START=$(date +%s)

          # Retry wrapper: retries a command up to N times with backoff
          retry() {
            local max_attempts=${1:-3}; shift
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if "$@"; then return 0; fi
              echo "  Attempt $attempt/$max_attempts failed, retrying in ${attempt}0s..."
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
            echo "  All $max_attempts attempts failed"
            return 1
          }

          # Cache check: returns 0 if path exists, with retries for transient failures
          cache_exists() {
            local pattern="$1"
            local check="$2"
            for i in 1 2 3; do
              if $CACHE ls "$pattern" 2>/dev/null | grep -q "$check"; then return 0; fi
              [ $i -lt 3 ] && sleep $((i * 5))
            done
            return 1
          }

          # ── Background: download previous indexes ──
          if [ "$HAS_PREVIOUS" = "true" ]; then
            (
              START=$(date +%s)
              CACHE_BUILD="s3://$CACHE_BUCKET/geocoder-cache/builds/$YESTERDAY"

              # Download only the compressed .bin.zst files — the patch step
              # decompresses them locally. Excluding uncompressed .bin files
              # is critical because older cache entries (backfilled before
              # zstd compression was added) may still contain orphan .bin
              # siblings that double the download size and can blow past
              # the runner's disk quota during build-index.
              if cache_exists "$CACHE_BUILD/.cache-complete" ".cache-complete"; then
                echo "[indexes] Downloading $YESTERDAY from local cache..."
                if ! retry 3 $CACHE cp --concurrency 16 --exclude "*.bin" "$CACHE_BUILD/*" "$WORKDIR/old-output/"; then
                  echo "[indexes] Cache download failed — falling back to Tigris..."
                  rm -rf "$WORKDIR/old-output"
                  $S5 cp --concurrency 8 --exclude "*.bin" "s3://$S3_BUCKET/$S3_PREFIX/builds/$YESTERDAY/*" "$WORKDIR/old-output/"
                fi
              else
                echo "[indexes] Cache miss — downloading $YESTERDAY via Tigris S3..."
                $S5 cp --concurrency 8 --exclude "*.bin" "s3://$S3_BUCKET/$S3_PREFIX/builds/$YESTERDAY/*" "$WORKDIR/old-output/"

                echo "[indexes] Backfilling local cache..."
                $CACHE cp --concurrency 16 "$WORKDIR/old-output/*" "$CACHE_BUILD/" 2>/dev/null || true
              fi

              COUNT=$(find "$WORKDIR/old-output" -type f | wc -l)
              SIZE=$(du -sb "$WORKDIR/old-output" | cut -f1)
              ELAPSED=$(($(date +%s) - START))
              echo "[indexes] Done: $COUNT files ($((SIZE/1024/1024)) MiB) in ${ELAPSED}s ($((SIZE/1024/1024/(ELAPSED+1))) MB/s)"
              if [ "$COUNT" -eq 0 ]; then echo "::error::Download produced 0 files"; exit 1; fi

              # NOTE: old-output files are left COMPRESSED here. Decompression
              # happens later, just before the patch step, because during the
              # apply-replication-diffs step osmium writes a second copy of
              # the 92 GB planet.osm.pbf which pushes peak disk usage to
              # ~380+ GB when combined with decompressed old-output (~200 GB).
              # By keeping old-output compressed (~89 GB) until after the PBF
              # work is done, peak disk stays under ~280 GB.
            ) &
            IDX_PID=$!
          fi

          # ── Foreground: download PBF ──
          download_pbf_from_cache() {
            local SRC="$1" DEST="$2" LABEL="$3"
            echo "[pbf] Downloading $LABEL from cache..."
            START=$(date +%s)
            if retry 3 $CACHE cp --concurrency 16 "$SRC" "$DEST"; then
              SIZE=$(stat -c%s "$DEST")
              ELAPSED=$(($(date +%s) - START))
              echo "[pbf] Done: $((SIZE/1024/1024)) MiB in ${ELAPSED}s ($((SIZE/1024/1024/(ELAPSED+1))) MB/s)"
              return 0
            fi
            echo "[pbf] Cache download failed after retries"
            rm -f "$DEST"
            return 1
          }

          if cache_exists "s3://$CACHE_BUCKET/geocoder-cache/planet-${TODAY}.osm.pbf" "planet-"; then
            if download_pbf_from_cache \
                "s3://$CACHE_BUCKET/geocoder-cache/planet-${TODAY}.osm.pbf" \
                "$WORKDIR/planet.osm.pbf" "today's PBF ($TODAY)"; then
              echo "pbf_source=today" >> "$GITHUB_OUTPUT"
            else
              echo "[pbf] Falling back to yesterday's PBF..."
              # Fall through to next check
              :
            fi
          fi

          if [ ! -f "$WORKDIR/planet.osm.pbf" ] && \
             cache_exists "s3://$CACHE_BUCKET/geocoder-cache/planet-${YESTERDAY}.osm.pbf" "planet-"; then
            if download_pbf_from_cache \
                "s3://$CACHE_BUCKET/geocoder-cache/planet-${YESTERDAY}.osm.pbf" \
                "$WORKDIR/planet.osm.pbf" "yesterday's PBF ($YESTERDAY)"; then
              echo "pbf_source=yesterday" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ ! -f "$WORKDIR/planet.osm.pbf" ]; then
            echo "[pbf] No cached PBF available — downloading from mirrors..."
            aria2c -x 16 -s 16 -j 16 --max-tries=3 \
              -d "$WORKDIR" -o planet.osm.pbf \
              "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf" \
              || true
            SIZE=$(stat -c%s "$WORKDIR/planet.osm.pbf")
            echo "[pbf] Done: $((SIZE/1024/1024)) MiB"
            echo "pbf_source=mirror" >> "$GITHUB_OUTPUT"
          fi

          # Download wikidata sitelinks (if available). curl gets explicit
          # timeouts so a stalled connection can't hang the workflow.
          # --connect-timeout caps DNS+TCP handshake, --max-time caps the
          # whole transfer. Both fall through to "skip" via `|| true`.
          echo "[wikidata] Checking for sitelinks data..."
          WIKIDATA_LATEST=$(curl -sL --fail --connect-timeout 30 --max-time 60 "$S3_PUBLIC_URL/geocoder/wikidata/latest.json" 2>/dev/null || echo '{}')
          WD_DATE=$(echo "$WIKIDATA_LATEST" | jq -r '.dump_date // ""' 2>/dev/null || echo "")
          if [ -n "$WD_DATE" ]; then
            echo "[wikidata] Found sitelinks from $WD_DATE, downloading..."
            curl -sL --connect-timeout 30 --max-time 600 -o "$WORKDIR/qid_sitelinks.bin" \
              "$S3_PUBLIC_URL/geocoder/wikidata/$WD_DATE/qid_sitelinks.bin" || true
            if [ -f "$WORKDIR/qid_sitelinks.bin" ] && [ "$(stat -c%s "$WORKDIR/qid_sitelinks.bin")" -gt 1000 ]; then
              echo "[wikidata] Downloaded: $(( $(stat -c%s "$WORKDIR/qid_sitelinks.bin") / 6 )) entries"
              echo "wikidata_sitelinks=$WORKDIR/qid_sitelinks.bin" >> "$GITHUB_OUTPUT"
              echo "wikidata_date=$WD_DATE" >> "$GITHUB_OUTPUT"
            else
              echo "[wikidata] Download failed or empty, skipping"
              rm -f "$WORKDIR/qid_sitelinks.bin"
            fi
          else
            echo "[wikidata] No sitelinks data available"
          fi

          # Download external postcode centroids. Nominatim supplements OSM
          # postcodes with external data for GB (Code-Point Open, which
          # GeoNames GB_full is derived from) and US (from TIGER, which the
          # builder already loads), so only GB is fetched here: GeoNames for
          # other countries adds PO-box codes at post offices that beat real
          # centroids and diverge from Nominatim.
          # An earlier run hung for 4h on urllib.request.urlretrieve when
          # download.geonames.org stopped serving bytes mid-transfer — urllib's
          # default socket timeout is None. Set a global socket timeout AND
          # wrap the whole step in `timeout` so a stuck mirror can't park the
          # entire build. GeoNames is non-blocking (postcode coverage tops
          # what's already in OSM); skip on failure rather than fail the job.
          echo "[geonames] Downloading GeoNames postcode data..."
          GEONAMES_FILE="$WORKDIR/postcode_centroids_external.csv.gz"
          timeout 600 python3 -c "
          import socket, zipfile, io, gzip, urllib.request, os, tempfile
          socket.setdefaulttimeout(120)
          entries = {}
          tmpdir = tempfile.mkdtemp()
          for url, cc_filter in [
              ('https://download.geonames.org/export/zip/GB_full.csv.zip', 'GB'),
          ]:
              zpath = os.path.join(tmpdir, os.path.basename(url))
              try:
                  urllib.request.urlretrieve(url, zpath)
                  with zipfile.ZipFile(zpath) as z:
                      with z.open(z.namelist()[0]) as f:
                          for line in io.TextIOWrapper(f, encoding='utf-8', errors='replace'):
                              parts = line.strip().split('\t')
                              if len(parts) < 11: continue
                              cc, pc, lat, lng = parts[0], parts[1], parts[9], parts[10]
                              if cc_filter and cc != cc_filter: continue
                              try:
                                  lat_f, lng_f = float(lat), float(lng)
                                  if lat_f == 0 and lng_f == 0: continue
                                  entries[(cc, pc)] = (lat_f, lng_f)
                              except: pass
              except Exception as e:
                  print(f'  Warning: {url}: {e}')
          with gzip.open('$GEONAMES_FILE', 'wt') as f:
              f.write('postcode,lat,lon,country_code\n')
              for (cc, pc), (lat, lng) in sorted(entries.items()):
                  f.write(f'{pc},{lat},{lng},{cc}\n')
          print(f'[geonames] {len(entries)} postcodes, {os.path.getsize(\"$GEONAMES_FILE\")//1024//1024} MiB')
          " 2>&1 || echo "[geonames] timed out or failed"
          if [ -f "$GEONAMES_FILE" ] && [ "$(stat -c%s "$GEONAMES_FILE")" -gt 1000 ]; then
            echo "postcode_centroids_external=$GEONAMES_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "[geonames] Download failed, skipping"
          fi

          # Download TIGER data (if available)
          echo "[tiger] Checking for TIGER address data..."
          TIGER_LATEST=$(curl -sL --fail "$S3_PUBLIC_URL/geocoder/tiger/latest.json" 2>/dev/null || echo '{}')
          TIGER_YEAR=$(echo "$TIGER_LATEST" | jq -r '.year // ""' 2>/dev/null || echo "")
          if [ -n "$TIGER_YEAR" ]; then
            echo "[tiger] Found TIGER $TIGER_YEAR data, downloading..."
            curl -sL -o "$WORKDIR/tiger-data.tar.gz" \
              "$S3_PUBLIC_URL/geocoder/tiger/$TIGER_YEAR/tiger-nominatim-preprocessed.csv.tar.gz" || true
            if [ -f "$WORKDIR/tiger-data.tar.gz" ] && [ "$(stat -c%s "$WORKDIR/tiger-data.tar.gz")" -gt 1000 ]; then
              echo "[tiger] Downloaded: $(( $(stat -c%s "$WORKDIR/tiger-data.tar.gz") / 1024 / 1024 )) MiB"
              echo "tiger_data=$WORKDIR/tiger-data.tar.gz" >> "$GITHUB_OUTPUT"
            else
              echo "::error::[tiger] Download failed or empty — a TIGER-less planet build silently drops US address ranges and ZIPs"
              exit 1
            fi
          else
            echo "::error::[tiger] No TIGER data available at $S3_PUBLIC_URL/geocoder/tiger/latest.json — refusing to build a US-less planet index"
            exit 1
          fi

          # Wait for index download
          if [ "$HAS_PREVIOUS" = "true" ]; then
            echo "Waiting for index download..."
            wait $IDX_PID
          fi
          echo "All downloads complete in $(($(date +%s) - STEP_START))s"

      # ── Apply replication diffs ───────────────────────────────────
      # Skipped when PBF source is already today's data.
      - name: Apply replication diffs
        if: ${{ steps.download.outputs.pbf_source != 'today' }}
        # A mirror PBF plus its catch-up diffs took 52 min in June with
        # osmium (now the fallback); a hung download or apply must not eat
        # the job's whole 6h budget.
        timeout-minutes: 120
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
          TODAY: ${{ steps.setup.outputs.today }}
          TODAY_SEQ: ${{ steps.setup.outputs.today_seq }}
          PBF_SOURCE: ${{ steps.download.outputs.pbf_source }}
        run: |
          echo "Disk at start of apply-diffs:"
          df -h "$WORKDIR"

          SERVER="https://planet.openstreetmap.org/replication/day"

          # apply_changes <diff>...: planet.osm.pbf + diffs -> planet-tmp.osm.pbf.
          # pbf-apply (builder tools) copies the blobs no change touches and
          # re-encodes the rest on every core: ~3 min on planet against ~52
          # for osmium apply-changes, with the same objects. osmium stays as
          # the fallback.
          apply_changes() {
            rm -f "$WORKDIR/planet-tmp.osm.pbf"
            if pbf-apply "$WORKDIR/planet.osm.pbf" "$@" -o "$WORKDIR/planet-tmp.osm.pbf" \
                --replication-timestamp "${TODAY}T00:00:00Z" --replication-sequence "$TODAY_SEQ"; then
              return 0
            fi
            echo "::warning::pbf-apply failed; falling back to osmium apply-changes"
            osmium apply-changes "$WORKDIR/planet.osm.pbf" "$@" -o "$WORKDIR/planet-tmp.osm.pbf" --overwrite
          }

          if [ "$PBF_SOURCE" = "yesterday" ]; then
            DIR1=$(printf "%03d" $((TODAY_SEQ / 1000000)))
            DIR2=$(printf "%03d" $(((TODAY_SEQ / 1000) % 1000)))
            FILE=$(printf "%03d" $((TODAY_SEQ % 1000)))
            echo "Downloading replication diff (seq $TODAY_SEQ)..."
            curl -sL --fail --retry 5 --retry-delay 30 --retry-all-errors \
              -o "$WORKDIR/diff-today.osc.gz" "$SERVER/$DIR1/$DIR2/${FILE}.osc.gz"
            gzip -t "$WORKDIR/diff-today.osc.gz"
            DIFF_SIZE=$(stat -c%s "$WORKDIR/diff-today.osc.gz")
            echo "Diff: $((DIFF_SIZE/1024/1024)) MiB"

            echo "Applying diff..."
            START=$(date +%s)
            apply_changes "$WORKDIR/diff-today.osc.gz"
            echo "Applied in $(($(date +%s) - START))s"
            mv "$WORKDIR/planet-tmp.osm.pbf" "$WORKDIR/planet.osm.pbf"
            rm -f "$WORKDIR/diff-today.osc.gz"
            echo "Disk after apply-diffs:"
            df -h "$WORKDIR"
          else
            # Mirror path — PBF may be a few days behind
            PBF_DATE=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$WORKDIR/planet.osm.pbf" 2>/dev/null | cut -dT -f1)
            DAYS_NEEDED=$(( ($(date -u -d "$TODAY" +%s) - $(date -u -d "$PBF_DATE" +%s)) / 86400 ))
            PBF_SEQ=$((TODAY_SEQ - DAYS_NEEDED))
            echo "PBF date=$PBF_DATE seq=$PBF_SEQ, need $DAYS_NEEDED diffs"

            if [ $DAYS_NEEDED -gt 0 ]; then
              DIFFS=""
              for S in $(seq $((PBF_SEQ + 1)) $TODAY_SEQ); do
                DIR1=$(printf "%03d" $((S / 1000000)))
                DIR2=$(printf "%03d" $(((S / 1000) % 1000)))
                FILE=$(printf "%03d" $((S % 1000)))
                curl -sL --fail --retry 5 --retry-delay 30 --retry-all-errors \
                  -o "$WORKDIR/diff-${S}.osc.gz" "$SERVER/$DIR1/$DIR2/${FILE}.osc.gz"
                gzip -t "$WORKDIR/diff-${S}.osc.gz"
                DIFFS="$DIFFS $WORKDIR/diff-${S}.osc.gz"
              done
              echo "Applying $DAYS_NEEDED diffs..."
              START=$(date +%s)
              # Word splitting is intended: one argument per diff, in order.
              # shellcheck disable=SC2086
              apply_changes $DIFFS
              echo "Applied in $(($(date +%s) - START))s"
              mv "$WORKDIR/planet-tmp.osm.pbf" "$WORKDIR/planet.osm.pbf"
              rm -f $DIFFS
            fi
          fi

      # ── Build index ────────────────────────────────────────────────
      - name: Build geocoder index
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
          CACHE_ENDPOINT: ${{ steps.setup.outputs.cache_endpoint }}
          CACHE_BUCKET: ${{ steps.setup.outputs.cache_bucket }}
          TODAY: ${{ steps.setup.outputs.today }}
          PBF_SOURCE: ${{ steps.download.outputs.pbf_source }}
          WIKIDATA_FILE: ${{ steps.download.outputs.wikidata_sitelinks }}
          WIKIDATA_DATE: ${{ steps.download.outputs.wikidata_date }}
          TIGER_FILE: ${{ steps.download.outputs.tiger_data }}
          GEONAMES_FILE: ${{ steps.download.outputs.postcode_centroids_external }}
        run: |
          CACHE="env AWS_ACCESS_KEY_ID=$CACHE_AWS_KEY AWS_SECRET_ACCESS_KEY=$CACHE_AWS_SECRET s5cmd --endpoint-url $CACHE_ENDPOINT --retry-count 5 --numworkers 15"
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5 --numworkers 4"

          # Cache the up-to-date PBF in background (skip if today's was already cached)
          if [ "$PBF_SOURCE" != "today" ]; then
            echo "Caching today's PBF in background..."
            $CACHE cp --concurrency 16 "$WORKDIR/planet.osm.pbf" \
              "s3://$CACHE_BUCKET/geocoder-cache/planet-${TODAY}.osm.pbf" &
          fi

          # Build args
          BUILD_ARGS="--continents --multi-output --multi-quality"
          if [ -n "$WIKIDATA_FILE" ] && [ -f "$WIKIDATA_FILE" ]; then
            BUILD_ARGS="$BUILD_ARGS --wikidata-sitelinks $WIKIDATA_FILE"
            echo "Using wikidata sitelinks from $WIKIDATA_DATE"
          fi
          if [ -n "$TIGER_FILE" ] && [ -f "$TIGER_FILE" ]; then
            BUILD_ARGS="$BUILD_ARGS --tiger-data $TIGER_FILE"
            echo "Using TIGER address data"
          fi
          if [ -n "$GEONAMES_FILE" ] && [ -f "$GEONAMES_FILE" ]; then
            BUILD_ARGS="$BUILD_ARGS --external-postcodes $GEONAMES_FILE"
            echo "Using GeoNames postcode data"
          fi
          # Strategy-2: pass the previous build's output root so the
          # IdAllocator can stabilize dense IDs against yesterday's
          # *.osm_ids sidecars. Empty / missing dir → first-build
          # fresh allocation (allocator no-ops cleanly).
          if [ -d "$WORKDIR/old-output" ]; then
            BUILD_ARGS="$BUILD_ARGS --prev-output $WORKDIR/old-output"
            echo "Using previous build for stable-ID allocation"
          fi

          echo "Building geocoder index for $TODAY..."
          START=$(date +%s)
          # Background memory sampler: writes each 30 s sample to a
          # local rolling file AND pushes that file to the PUBLIC
          # Tigris bucket after every write. Streaming to stdout
          # doesn't survive a runner-agent crash mid-step (GitHub
          # never finalises the partial step log) and the internal
          # cache bucket isn't public-readable, so we land the data
          # at $S3_PUBLIC_URL/geocoder/memwatch/$RUN_ID.log where
          # `curl` works without auth. After a failure, fetch with:
          #   curl $S3_PUBLIC_URL/geocoder/memwatch/$RUN_ID.log
          # to see RSS right up to the disconnect.
          MEMWATCH_KEY="s3://$S3_BUCKET/$S3_PREFIX/memwatch/${GITHUB_RUN_ID}.log"
          : > "$WORKDIR/memwatch.log"
          (
            while true; do
              ts=$(date '+%H:%M:%S')
              mem=$(awk '/^MemTotal:|^MemAvailable:/{printf "%s=%dMi ", $1, $2/1024}' /proc/meminfo)
              rss=$(ps -C build-index -o rss= 2>/dev/null | awk '{s+=$1} END{printf "%dMi", s/1024}')
              echo "[memwatch $ts] $mem build_index_rss=$rss" \
                | tee -a "$WORKDIR/memwatch.log"
              $S5 cp "$WORKDIR/memwatch.log" "$MEMWATCH_KEY" >/dev/null 2>&1 || true
              sleep 30
            done
          ) &
          MEMWATCH_PID=$!
          # pipefail so build-index crashes propagate (without it, the
          # downstream tee/tail mask exit code and the workflow proceeds
          # to compress with no configurations.json — see 24968665275).
          set -o pipefail
          # Don't `tail -30` here: we want full build-index output in the
          # streamed step log so the last lines before a crash are visible.
          build-index "$WORKDIR/output/" "$WORKDIR/planet.osm.pbf" \
            $BUILD_ARGS 2>&1 | tee "$WORKDIR/build.log"
          BUILD_RC=$?
          kill $MEMWATCH_PID 2>/dev/null || true
          if [ "$BUILD_RC" != "0" ]; then exit "$BUILD_RC"; fi
          echo "Build completed in $(($(date +%s) - START))s"
          echo "Build log kept at $WORKDIR/build.log ($(wc -l < "$WORKDIR/build.log") lines)"
          echo "$(find "$WORKDIR/output" -name "*.bin" | wc -l) bin files produced"

          # Seed configurations.json from the static template. CI augments
          # it with the per-file size/sha256 table during the compress
          # step, then with date / previous / built_at / wikidata_date
          # during finalize. The C++ builder no longer writes any JSON
          # itself — the template is the single source of truth for the
          # axes/components/constraints/presets schema.
          cp "$GITHUB_WORKSPACE/geocoder/builder/configurations.template.json" \
             "$WORKDIR/output/configurations.json"

          # Wait for background PBF cache upload, then free disk
          wait
          rm -f "$WORKDIR/planet.osm.pbf"
          df -h "$WORKDIR" | tee -a "$GITHUB_STEP_SUMMARY"

      # ── Generate patches + verify ─────────────────────────────────
      - name: Generate patches and verify
        if: steps.setup.outputs.has_previous == 'true'
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
          CACHE_ENDPOINT: ${{ steps.setup.outputs.cache_endpoint }}
          CACHE_BUCKET: ${{ steps.setup.outputs.cache_bucket }}
          OLD_DATE: ${{ steps.setup.outputs.yesterday }}
          NEW_DATE: ${{ steps.setup.outputs.today }}
        run: |
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5 --numworkers 32"
          CACHE="env AWS_ACCESS_KEY_ID=$CACHE_AWS_KEY AWS_SECRET_ACCESS_KEY=$CACHE_AWS_SECRET s5cmd --endpoint-url $CACHE_ENDPOINT --retry-count 5 --numworkers 15"

          echo "Disk at start of patch step:"
          df -h "$WORKDIR"

          # Decompress old-output .bin.zst files now — deferred from the
          # download step to avoid peak disk usage during apply-changes.
          # At this point, PBF has been freed (end of build step) so we
          # have plenty of headroom. `-f` overwrites any pre-existing .bin
          # from a stale cache, `--rm` removes the .zst source after
          # successful decompression.
          DECOMP_START=$(date +%s)
          ZST_COUNT=$(find "$WORKDIR/old-output" -name "*.bin.zst" | wc -l)
          if [ "$ZST_COUNT" -gt 0 ]; then
            echo "[old-output] Decompressing $ZST_COUNT .bin.zst files..."
            find "$WORKDIR/old-output" -name "*.bin.zst" -print0 \
              | xargs -0 -n1 -P8 zstd -d -T0 -f --rm --quiet
            echo "[old-output] Decompressed in $(($(date +%s) - DECOMP_START))s"
            df -h "$WORKDIR"
          fi

          # Compress the new index alongside the diffs, whose long tail
          # (planet/full) leaves most cores idle. It keeps the .bin files the
          # diffs and verifies read; the compress step removes them.
          nice -n 10 python3 "$GITHUB_WORKSPACE/geocoder/builder/tools/compress_index.py" "$WORKDIR/output" \
            > "$WORKDIR/compress.log" 2>&1 < /dev/null &
          COMPRESS_PID=$!

          # Patch generation runs against uncompressed .bin files (old was
          # decompressed just above, new was just built).
          echo "Generating patches ($OLD_DATE → $NEW_DATE)..."
          START=$(date +%s)

          echo "## Patch Results ($OLD_DATE → $NEW_DATE)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Variant | Files | Patch Size | Verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|-----------|----------|" >> "$GITHUB_STEP_SUMMARY"

          RESULTS_DIR="$WORKDIR/results"
          VARIANTS=$(cd "$WORKDIR/output" && find . -name "*.bin" -exec dirname {} \; | sort -u | sed 's|^\./||')

          # Per variant: diff, apply to a scratch copy, verify the whole client
          # file set (JSON included, no extra files). Jobs are admitted by
          # estimated diff memory, largest first; see the script header.
          # A script abort leaves variants without results; the collector
          # counts those as CRASH, so patches are dropped but data still uploads.
          "$GITHUB_WORKSPACE/geocoder/builder/tools/generate_patches.sh" \
            "$WORKDIR/old-output" "$WORKDIR/output" "$RESULTS_DIR" "$WORKDIR/diff-logs" \
            || echo "::error::generate_patches.sh exited $?"
          echo "Patch generation + verification completed in $(($(date +%s) - START))s"
          if wait $COMPRESS_PID; then
            touch "$WORKDIR/compress.done"
            echo "Compression finished $(($(date +%s) - START))s after patch generation started"
          else
            echo "::warning::Background compression failed; the compress step retries"
          fi
          tail -1 "$WORKDIR/compress.log"

          # Collect results
          PASS=0; FAIL=0; SKIP=0
          for variant in $VARIANTS; do
            SAFE=$(echo "$variant" | tr '/' '_')
            if [ ! -f "$RESULTS_DIR/$SAFE" ]; then
              # Every eligible variant writes PASS/FAIL/SKIP; a missing file
              # means the verify subshell died mid-flight (tool crash).
              echo "::error::$variant: no verify result — diff/patch tool crashed"
              echo "| $variant | - | - | **CRASH** |" >> "$GITHUB_STEP_SUMMARY"
              FAIL=$((FAIL + 1))
              continue
            fi
            RESULT=$(cat "$RESULTS_DIR/$SAFE")

            if [ "$RESULT" = "SKIP" ]; then
              SKIP=$((SKIP + 1))
            elif echo "$RESULT" | grep -q "^PASS"; then
              N=$(echo "$RESULT" | awk '{print $2}')
              KB=$(echo "$RESULT" | awk '{print $3}')
              echo "  $variant: PASS ($N/$N, ${KB} KiB)"
              echo "| $variant | $N | ${KB} KiB | PASS |" >> "$GITHUB_STEP_SUMMARY"
              PASS=$((PASS + 1))
            else
              M=$(echo "$RESULT" | awk '{print $2}')
              N=$(echo "$RESULT" | awk '{print $3}')
              KB=$(echo "$RESULT" | awk '{print $4}')
              echo "::error::$variant: FAIL ($M problems over $N files)"
              echo "| $variant | $N | ${KB} KiB | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
              FAIL=$((FAIL + 1))
              if [ -f "$RESULTS_DIR/$SAFE.mismatches" ]; then
                echo "  $variant mismatches: $(cat $RESULTS_DIR/$SAFE.mismatches)"
              fi
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total: $PASS pass, $FAIL fail, $SKIP skip**" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: $PASS pass, $FAIL fail, $SKIP skip"

          # Patches stay in $WORKDIR/output/*.gcpatch — uploaded alongside
          # compressed .bin.zst files in the Finalize step below. Exit 1
          # is DEFERRED to the Finalize step so that compress + upload
          # still run (the build data itself is valid and becomes the
          # next day's patch base).
          #
          # A patch CI could not reproduce must never reach clients, and
          # the chain must not route through this date: drop every patch
          # here and Finalize records build.previous = null, so a client
          # walking the chain falls back to a full download. The diff
          # logs remain in the diff-logs artifact for debugging.
          if [ $FAIL -gt 0 ]; then
            echo "PATCH_VERIFY_FAILED=1" >> "$GITHUB_ENV"
            find "$WORKDIR/output" -name "patch.gcpatch" -delete
            echo "::warning::$FAIL variants failed patch verify — dropped this build's patches; uploading data only"
          fi

      # ── Compress .bin files + splice per-file sizes into configurations.json ─
      - name: Compress index files
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
        run: |
          # Patch generation compresses alongside its diffs; a fresh build
          # (or a failed background run) compresses here.
          if [ -f "$WORKDIR/compress.done" ]; then
            echo "Compressed during patch generation"
          else
            COMPRESS_START=$(date +%s)
            python3 "$GITHUB_WORKSPACE/geocoder/builder/tools/compress_index.py" "$WORKDIR/output"
            echo "Compression done in $(($(date +%s) - COMPRESS_START))s"
          fi
          find "$WORKDIR/output" -name "*.bin" -delete
          ZST_COUNT=$(find "$WORKDIR/output" -name "*.bin.zst" | wc -l)
          echo "$ZST_COUNT .bin.zst files produced"

      # ── Finalize upload + configurations.json ──────────────────────
      - name: Finalize upload and configurations.json
        env:
          WORKDIR: ${{ steps.setup.outputs.workdir }}
          CACHE_ENDPOINT: ${{ steps.setup.outputs.cache_endpoint }}
          CACHE_BUCKET: ${{ steps.setup.outputs.cache_bucket }}
          NEW_DATE: ${{ steps.setup.outputs.today }}
          OLD_DATE: ${{ steps.setup.outputs.yesterday }}
          HAS_PREVIOUS: ${{ steps.setup.outputs.has_previous }}
          WIKIDATA_DATE: ${{ steps.download.outputs.wikidata_date || 'null' }}
        run: |
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5 --numworkers 32"
          CACHE="env AWS_ACCESS_KEY_ID=$CACHE_AWS_KEY AWS_SECRET_ACCESS_KEY=$CACHE_AWS_SECRET s5cmd --endpoint-url $CACHE_ENDPOINT --retry-count 5 --numworkers 15"

          # Clear stale files from prior builds at this date, then upload
          # compressed .bin.zst + patches + json in one shot. Tigris
          # occasionally fails multipart uploads under concurrency — the
          # verify loop below re-uploads anything missing.
          echo "Clearing stale files at s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/..."
          $S5 rm "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/*" 2>/dev/null || true

          echo "Uploading .bin.zst + patches + osm_ids sidecars to Tigris..."
          UPLOAD_START=$(date +%s)
          # Strategy-2 sidecars (*.osm_ids) carry the osm_id ↔ dense-idx
          # mapping that the next build's IdAllocator reads as
          # --prev-output. Clients never read them. We upload them to
          # Tigris (the durable bucket) anyway because the cache bucket
          # may be cleared between runs — losing yesterday's sidecars
          # there breaks strategy-2 chaining and balloons the next
          # patch back to multi-GiB. The cleanup step further down
          # ages them out at the same rate as full builds (3 days).
          # The in-cluster cache copy runs alongside the Tigris upload.
          $CACHE cp --concurrency 16 \
            "$WORKDIR/output/*" "s3://$CACHE_BUCKET/geocoder-cache/builds/$NEW_DATE/" > /dev/null 2>&1 &
          CACHE_PID=$!
          s5cmd --endpoint-url $S3_ENDPOINT --retry-count 10 --numworkers 4 cp --concurrency 8 \
            "$WORKDIR/output/*" "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/" || \
            echo "::warning::Some files failed on first pass — verify loop will retry"
          echo "Tigris upload first pass complete in $(($(date +%s) - UPLOAD_START))s"
          wait $CACHE_PID || true

          # ── Augment configurations.json with build metadata ─────────
          # Splices date / previous / built_at / wikidata_date into the
          # `build` block (which the static template stamps with
          # build_version + patch_version). A build whose patches failed
          # verify published none, so it must not claim a previous build.
          PREV_VAL="$( [ "$HAS_PREVIOUS" = "true" ] && [ -z "${PATCH_VERIFY_FAILED:-}" ] && echo "$OLD_DATE" || echo "null" )"
          jq --arg date "$NEW_DATE" \
             --arg previous "$PREV_VAL" \
             --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg wikidata_date "$WIKIDATA_DATE" \
             '.build = ((.build // {}) + {date: $date, previous: (if $previous == "null" then null else $previous end), built_at: $built_at, wikidata_date: (if $wikidata_date == "null" then null else $wikidata_date end)})' \
             "$WORKDIR/output/configurations.json" > "$WORKDIR/output/configurations.tmp" \
             && mv "$WORKDIR/output/configurations.tmp" "$WORKDIR/output/configurations.json"
          echo "configurations.json size: $(stat -c%s "$WORKDIR/output/configurations.json") bytes"

          # Generate checksums — .bin.zst + .gcpatch + .json. Note that
          # configurations.files[].sha256 holds the RAW (pre-compression)
          # hashes for server-side verification after decompression, while
          # this checksums.sha256 holds the on-wire hashes (compressed).
          echo "Generating checksums..."
          # Hashed on every core (~35 GB), listed in path order.
          (cd "$WORKDIR/output" && find . -type f \( -name "*.zst" -o -name "*.gcpatch" -o -name "*.json" \) -print0 \
            | xargs -0 -P "$(nproc)" -n 8 sha256sum | sort -k2) > "$WORKDIR/output/checksums.sha256"
          echo "$(wc -l < "$WORKDIR/output/checksums.sha256") file checksums generated"

          # Upload configurations.json + checksums (index files + patches
          # already uploaded above). Note: checksums.sha256 is generated
          # AFTER the bulk cache cp at the top of this step, so we
          # re-upload it (and configurations.json) to cache here so the
          # sentinel check sees the full file set — otherwise every build
          # warns "Cache incomplete (N-1/N) — no sentinel".
          $S5 cp "$WORKDIR/output/configurations.json" "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/configurations.json"
          $S5 cp "$WORKDIR/output/checksums.sha256" "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/checksums.sha256"
          $CACHE cp "$WORKDIR/output/configurations.json" "s3://$CACHE_BUCKET/geocoder-cache/builds/$NEW_DATE/configurations.json" 2>/dev/null || true
          $CACHE cp "$WORKDIR/output/checksums.sha256" "s3://$CACHE_BUCKET/geocoder-cache/builds/$NEW_DATE/checksums.sha256" 2>/dev/null || true

          # Verify upload completeness — walk local files and re-upload any that
          # failed to land on Tigris. Use serial single-file uploads for the retry
          # so a concurrency race doesn't re-trigger the multipart issue.
          LOCAL_COUNT=$(find "$WORKDIR/output" -type f | wc -l)
          REMOTE_COUNT=$($S5 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/*" 2>/dev/null | wc -l)
          echo "Tigris: $REMOTE_COUNT/$LOCAL_COUNT files"

          # Build list of remote objects (as relative paths under NEW_DATE/)
          $S5 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/*" 2>/dev/null \
            | awk '{print $NF}' \
            | sed "s|^s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/||" \
            | sort > /tmp/remote.txt

          # List local files, strip the workdir prefix. Includes osm_ids
          # sidecars now that they upload to Tigris too (for durable
          # storage; the cache bucket may be cleared between runs).
          (cd "$WORKDIR/output" && find . -type f \( -name "*.zst" -o -name "*.gcpatch" -o -name "*.json" -o -name "*.sha256" -o -name "*.osm_ids" \)) \
            | sed 's|^\./||' | sort > /tmp/local.txt

          missing=$(comm -23 /tmp/local.txt /tmp/remote.txt)
          if [ -n "$missing" ]; then
            echo "::warning::Missing files — uploading individually:"
            echo "$missing"
            fail_count=0
            echo "$missing" | while IFS= read -r rel; do
              [ -z "$rel" ] && continue
              for attempt in 1 2 3 4 5; do
                if $S5 cp "$WORKDIR/output/$rel" "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/$rel" 2>&1; then
                  break
                fi
                echo "  retry $attempt for $rel"
                sleep 5
              done
            done

            REMOTE_COUNT=$($S5 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/*" 2>/dev/null | wc -l)
            echo "Tigris after retry: $REMOTE_COUNT/$LOCAL_COUNT files"
            if [ "$REMOTE_COUNT" -lt "$LOCAL_COUNT" ]; then
              echo "::error::Tigris upload still incomplete: $REMOTE_COUNT/$LOCAL_COUNT"
              # Print which files are still missing so next run can diagnose
              $S5 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/*" 2>/dev/null \
                | awk '{print $NF}' \
                | sed "s|^s3://$S3_BUCKET/$S3_PREFIX/builds/$NEW_DATE/||" \
                | sort > /tmp/remote2.txt
              echo "Still missing:"
              comm -23 /tmp/local.txt /tmp/remote2.txt
              exit 1
            fi
          fi

          # Cache sentinel
          CACHE_COUNT=$($CACHE ls "s3://$CACHE_BUCKET/geocoder-cache/builds/$NEW_DATE/*" 2>/dev/null | wc -l)
          if [ "$CACHE_COUNT" -ge "$LOCAL_COUNT" ]; then
            echo "{\"date\":\"$NEW_DATE\",\"files\":$LOCAL_COUNT,\"cached_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
              | $CACHE pipe "s3://$CACHE_BUCKET/geocoder-cache/builds/$NEW_DATE/.cache-complete"
            echo "Cache sentinel written"
          else
            echo "::warning::Cache incomplete ($CACHE_COUNT/$LOCAL_COUNT) — no sentinel"
          fi

          # ── Update latest.json ──
          # Skip latest.json update on patch verify failure — we still
          # want the dated-build artifacts uploaded for local debugging,
          # but consumers of latest.json shouldn't switch to a broken
          # build.
          if [ -z "$PATCH_VERIFY_FAILED" ]; then
            PREV_VAL="$( [ "$HAS_PREVIOUS" = "true" ] && echo "$OLD_DATE" || echo "null" )"
            BUILD_V=$(jq -r .build.version "$GITHUB_WORKSPACE/geocoder/builder/configurations.template.json")
            PATCH_V=$(jq -r .build.patch_version "$GITHUB_WORKSPACE/geocoder/builder/configurations.template.json")
            BUILDS="s3://$S3_BUCKET/$S3_PREFIX/builds"
            # The cleanup step below applies these same cutoffs.
            FULL_CUTOFF=$(date -u -d "$NEW_DATE -${KEEP_FULL_DAYS} days +1 day" +%Y-%m-%d)
            PATCH_CUTOFF=$(date -u -d "$NEW_DATE -${KEEP_PATCH_DAYS} days +1 day" +%Y-%m-%d)
            build_field() {
              $S5 cat "$BUILDS/$1/configurations.json" 2>/dev/null | jq -r "$2 // empty" 2>/dev/null || true
            }

            # Oldest date whose full index survives cleanup and has this
            # build_version (a fresh install from it needs the same layout).
            OLDEST_INDEXES=$NEW_DATE
            d=$FULL_CUTOFF
            while [ "$d" \< "$NEW_DATE" ]; do
              if [ "$(build_field "$d" .build.version)" = "$BUILD_V" ]; then OLDEST_INDEXES=$d; break; fi
              d=$(date -u -d "$d +1 day" +%Y-%m-%d)
            done

            # Oldest local date that can patch to latest: walk build.previous
            # back from latest. A client at `prev` needs only cur's patches
            # and configurations.json, so `cur` must be inside the retention
            # window but `prev` need not be. A build without patches (fresh,
            # or verify failed) has no previous and ends the chain.
            OLDEST_PATCHES=$NEW_DATE
            cur=$NEW_DATE
            prev=$(jq -r '.build.previous // empty' "$WORKDIR/output/configurations.json")
            while [ -n "$prev" ] && ! [ "$cur" \< "$PATCH_CUTOFF" ]; do
              OLDEST_PATCHES=$prev
              cur=$prev
              prev=$(build_field "$cur" .build.previous)
            done
            echo "latest.json: oldest_indexes=$OLDEST_INDEXES oldest_patches=$OLDEST_PATCHES"

            jq -n \
              --argjson build_version "$BUILD_V" \
              --argjson patch_version "$PATCH_V" \
              --arg latest "$NEW_DATE" \
              --arg previous "$PREV_VAL" \
              --arg oldest_indexes "$OLDEST_INDEXES" \
              --arg oldest_patches "$OLDEST_PATCHES" \
              --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{build_version: $build_version, patch_version: $patch_version, latest: $latest, previous: (if $previous == "null" then null else $previous end), oldest_indexes: $oldest_indexes, oldest_patches: $oldest_patches, updated_at: $updated_at}' \
              | $S5 pipe "s3://$S3_BUCKET/$S3_PREFIX/builds/latest.json"
          else
            echo "::warning::Skipping latest.json update — patch verify failed"
          fi

          echo "Upload complete."

      # ── Cleanup old Tigris builds ──────────────────────────────────────
      # Retention policy:
      #   - Full builds (every .bin.zst, manifest, etc.): keep 3 days
      #   - Patches (patch.gcpatch + configurations.json): keep next 11 days (14 total)
      #   - Older than 14 days: delete entirely
      # Skip cleanup if:
      #   - This run had patch verify failures (don't trash history when
      #     the new build is unhealthy)
      #   - Today's build directory isn't present in Tigris (defensive
      #     check — refuses to delete anything if the new data didn't
      #     actually land)
      - name: Cleanup old Tigris builds
        if: env.PATCH_VERIFY_FAILED != '1'
        env:
          NEW_DATE: ${{ steps.setup.outputs.today }}
        run: |
          set -eu
          S5="s5cmd --endpoint-url $S3_ENDPOINT --retry-count 5 --numworkers 32"
          BUILDS_PREFIX="s3://$S3_BUCKET/$S3_PREFIX/builds"

          # Cutoff dates (inclusive of the cutoff day itself).
          FULL_CUTOFF=$(date -u -d "$NEW_DATE -${KEEP_FULL_DAYS} days +1 day" +%Y-%m-%d)
          PATCH_CUTOFF=$(date -u -d "$NEW_DATE -${KEEP_PATCH_DAYS} days +1 day" +%Y-%m-%d)

          # Defensive: verify today's build is reachable. Without this,
          # a misconfigured run with the wrong NEW_DATE could nuke
          # every recoverable build.
          if ! $S5 ls "$BUILDS_PREFIX/$NEW_DATE/" >/dev/null 2>&1; then
            echo "::warning::$NEW_DATE not present at $BUILDS_PREFIX — skipping cleanup"
            exit 0
          fi

          echo "Retention: full ≥ $FULL_CUTOFF, patches ≥ $PATCH_CUTOFF, today=$NEW_DATE"

          # Enumerate every dated build directory and decide its fate.
          # s5cmd ls on a prefix returns one DIR line per immediate child.
          ALL_DATES=$($S5 ls "$BUILDS_PREFIX/" 2>/dev/null \
            | awk '/DIR/ {print $NF}' \
            | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort)

          for d in $ALL_DATES; do
            if [ "$d" \> "$FULL_CUTOFF" ] || [ "$d" = "$FULL_CUTOFF" ]; then
              echo "  $d: KEEP (full)"
            elif [ "$d" \> "$PATCH_CUTOFF" ] || [ "$d" = "$PATCH_CUTOFF" ]; then
              echo "  $d: KEEP patches + configurations.json — pruning the rest"
              # rm everything under this date but the patches and
              # configurations.json: clients walk build.previous through
              # it to find the patch chain.
              KEYS=$($S5 ls "$BUILDS_PREFIX/$d/*" 2>/dev/null \
                | awk '{print $NF}' \
                | grep -v -E '\.gcpatch$|^configurations\.json$' || true)
              # One batch (s5cmd's workers) rather than a process per key:
              # a build is ~1000 keys.
              if [ -n "$KEYS" ]; then
                echo "$KEYS" | sed "s|^|rm $BUILDS_PREFIX/$d/|" | $S5 run >/dev/null 2>&1 || true
              fi
            else
              echo "  $d: DELETE (older than $PATCH_CUTOFF)"
              $S5 rm "$BUILDS_PREFIX/$d/*" >/dev/null 2>&1 || true
            fi
          done

          # memwatch logs are keyed by run id, so age them by upload date
          # (s5cmd ls prints YYYY/MM/DD first).
          MEMWATCH_PREFIX="s3://$S3_BUCKET/$S3_PREFIX/memwatch"
          MEMWATCH_CUTOFF=$(date -u -d "$NEW_DATE -${KEEP_MEMWATCH_DAYS} days +1 day" +%Y/%m/%d)
          echo "memwatch: keep logs from $MEMWATCH_CUTOFF on"
          $S5 ls "$MEMWATCH_PREFIX/*" 2>/dev/null \
            | awk -v cutoff="$MEMWATCH_CUTOFF" -v prefix="$MEMWATCH_PREFIX" '$1 < cutoff {print "rm " prefix "/" $NF}' \
            | $S5 run >/dev/null 2>&1 || true
          echo "Public bucket cleanup complete."

      # ── Cleanup old cache bucket entries ───────────────────────────────
      # Cache bucket holds the *.osm_ids sidecars (strategy-2 ID-remap
      # mappings) under geocoder-cache/builds/<DATE>/ AND the raw PBFs
      # under geocoder-cache/planet-<DATE>.osm.pbf used to skip
      # re-download on subsequent runs.
      #
      # Retention:
      #   - geocoder-cache/builds/<DATE>/ : keep 7 days — only the most
      #     recent is needed for --prev-output chaining, but 7 days
      #     gives recovery headroom if a few daily builds fail.
      #   - geocoder-cache/planet-<DATE>.osm.pbf : keep 3 days — only
      #     yesterday/today are useful; older is dead weight at 93 GiB
      #     each.
      - name: Cleanup old cache bucket
        if: env.PATCH_VERIFY_FAILED != '1'
        env:
          CACHE_ENDPOINT: ${{ steps.setup.outputs.cache_endpoint }}
          CACHE_BUCKET: ${{ steps.setup.outputs.cache_bucket }}
          NEW_DATE: ${{ steps.setup.outputs.today }}
        run: |
          set -eu
          CACHE="env AWS_ACCESS_KEY_ID=$CACHE_AWS_KEY AWS_SECRET_ACCESS_KEY=$CACHE_AWS_SECRET s5cmd --endpoint-url $CACHE_ENDPOINT --retry-count 5 --numworkers 15"

          # ── Build dirs in cache (contain *.osm_ids sidecars) ──
          BUILD_CUTOFF=$(date -u -d "$NEW_DATE -7 days +1 day" +%Y-%m-%d)
          echo "Cache builds: keep ≥ $BUILD_CUTOFF"

          CACHE_DATES=$($CACHE ls "s3://$CACHE_BUCKET/geocoder-cache/builds/" 2>/dev/null \
            | awk '/DIR/ {print $NF}' \
            | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort)
          for d in $CACHE_DATES; do
            if [ "$d" \> "$BUILD_CUTOFF" ] || [ "$d" = "$BUILD_CUTOFF" ]; then
              echo "  cache builds/$d: KEEP"
            else
              echo "  cache builds/$d: DELETE"
              $CACHE rm "s3://$CACHE_BUCKET/geocoder-cache/builds/$d/*" >/dev/null 2>&1 || true
            fi
          done

          # ── Cached PBFs (planet-YYYY-MM-DD.osm.pbf) ──
          PBF_CUTOFF=$(date -u -d "$NEW_DATE -3 days +1 day" +%Y-%m-%d)
          echo "Cache PBFs: keep ≥ $PBF_CUTOFF"

          CACHE_PBFS=$($CACHE ls "s3://$CACHE_BUCKET/geocoder-cache/planet-*.osm.pbf" 2>/dev/null \
            | awk '{print $NF}' \
            | sed 's/^planet-//; s/\.osm\.pbf$//' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort)
          for d in $CACHE_PBFS; do
            if [ "$d" \> "$PBF_CUTOFF" ] || [ "$d" = "$PBF_CUTOFF" ]; then
              echo "  cache planet-$d.osm.pbf: KEEP"
            else
              echo "  cache planet-$d.osm.pbf: DELETE"
              $CACHE rm "s3://$CACHE_BUCKET/geocoder-cache/planet-$d.osm.pbf" >/dev/null 2>&1 || true
            fi
          done

          echo "Cache cleanup complete."

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: ${{ steps.setup.outputs.workdir }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload per-variant diff logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-logs
          path: ${{ steps.setup.outputs.workdir }}/diff-logs/
          if-no-files-found: ignore
          retention-days: 7

      # Fail the run at the very end if patch verify reported failures
      # earlier. This lets compress + upload run first so the dated
      # build + individual file-level mismatch reports are all uploaded
      # before the workflow goes red.
      - name: Fail run on patch verify failure
        if: env.PATCH_VERIFY_FAILED == '1'
        run: |
          echo "::error::Patch verify reported failures — see Generate patches and verify step"
          exit 1
