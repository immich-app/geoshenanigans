name: Geocoder Build Watchdog

# Auto-retry the daily geocoder build if its runner crashes mid-flight
# (annotation "The self-hosted runner lost communication with the
# server"). A cron tick walks today's runs and dispatches a retry when
# none succeeded and none is in flight. There is deliberately no
# workflow_run trigger (zizmor dangerous-triggers): for a daily build,
# a retry that starts up to 2h after the failure is fine.
#
# Self-limiting: walks recent runs, counts how many times we've tried
# today, and bails if we've already retried MAX_RETRIES times. Prevents
# runaway loops if the build is broken for non-runner reasons.

on:
  schedule:
    # Every 2 hours: tight enough that a crashed build is retried
    # within the same day without the watchdog firing constantly.
    - cron: '15 */2 * * *'
  workflow_dispatch: {}

# Single concurrency group so the watchdog never runs twice
# simultaneously (e.g. a manual dispatch landing during the cron run).
# The newer invocation cancels the older.
concurrency:
  group: geocoder-build-watchdog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # needs gh workflow run
    steps:
      # For geocoder/builder/tools/workflow_runs.sh.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check and maybe retry today's build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Cap how many times we'll retry a single day before giving up.
          # 5 covers ~10h of runner instability — past that, the failure
          # is likely a real bug and a human should look.
          MAX_RETRIES: 5
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          WORKFLOW=geocoder-build.yml

          # Daily builds (and our retries) run on the repo's default
          # branch — that's the only branch GitHub fires scheduled
          # workflows from, so it's where the build workflow lives in
          # production. Derive it instead of hardcoding a branch name.
          # `gh repo view` ignores GH_REPO and, without an argument, reads
          # the repo from the checkout's remote: it is named here.
          BUILD_REF=$(gh repo view "$GH_REPO" --json defaultBranchRef --jq .defaultBranchRef.name)

          # The build workflow's runs ON THE DEFAULT BRANCH created today
          # (UTC). The branch filter excludes feature-branch test runs that
          # would otherwise skew the retry count. A filtered list holds only
          # its 1,000 newest runs, however many match: workflow_runs.sh lists
          # the day in parts that each hold fewer, so that no day's scratch
          # dispatches on that branch push today's live runs out of it, and
          # gives each run once. We intentionally do NOT filter by event:
          # both the scheduled run and our own workflow_dispatch retries must
          # count toward MAX_RETRIES. A dispatch under any prefix but the live
          # one is a test run whatever its branch, which its title says
          # (geocoder-build.yml's run-name): it is neither today's success
          # nor a failure to retry. The live nightly's runs are those of the
          # two titles run-name gives it, a scheduled run's and a dispatch's
          # under s3_prefix geocoder, matched byte for byte: a dispatch under
          # Geocoder, which Setup refuses, is titled "Build Geocoder Index
          # [Geocoder]" (an expression's == is blind to case).
          RUNS_JSON=$(geocoder/builder/tools/workflow_runs.sh \
            "repos/$GH_REPO/actions/workflows/$WORKFLOW/runs?branch=$BUILD_REF" \
            "${TODAY}T00:00:00Z" "${TODAY}T23:59:59Z" | jq -s .)

          TODAY_RUNS=$(echo "$RUNS_JSON" \
            | jq --arg ref "$BUILD_REF" \
                 '[.[] | select(.head_branch == $ref)
                       | select(.display_title == "Build Geocoder Index" or .display_title == "Build Geocoder Index [geocoder]")]')

          TOTAL=$(echo "$TODAY_RUNS" | jq 'length')
          SUCCEEDED=$(echo "$TODAY_RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
          IN_FLIGHT=$(echo "$TODAY_RUNS" | jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | length')

          echo "Today=$TODAY  total=$TOTAL  succeeded=$SUCCEEDED  in_flight=$IN_FLIGHT"

          if [ "$SUCCEEDED" -gt 0 ]; then
            echo "Today already has a successful build — nothing to do."
            exit 0
          fi

          if [ "$IN_FLIGHT" -gt 0 ]; then
            echo "A build is already running for today — let it finish."
            exit 0
          fi

          if [ "$TOTAL" -eq 0 ]; then
            # No run today at all: the scheduled build owns the first
            # attempt. Dispatching here raced the daily cron and produced
            # duplicate multi-hour builds — the watchdog is retry-only.
            echo "No build attempted today yet — leaving the first attempt to the schedule."
            exit 0
          fi

          if [ "$TOTAL" -ge "$MAX_RETRIES" ]; then
            echo "::error::Reached $MAX_RETRIES attempts for $TODAY without success — giving up. Investigate manually."
            exit 1
          fi

          # Retry only infrastructure failures. A lost runner reports a
          # failed job with no steps at all; these steps fail the same way
          # on every rerun of the same commit and inputs, so a retry only
          # burns hours of the shared runner. A cancelled step means the
          # job hit its timeout (a rerun does the same work and times out
          # again) or someone cancelled the run by hand.
          LAST_ID=$(echo "$TODAY_RUNS" | jq -r 'sort_by(.created_at) | last | .id')
          STOPPED_AT=$(gh run view "$LAST_ID" --json jobs --jq '
            [.jobs[].steps[]
             | select(.conclusion == "cancelled"
                      or (.conclusion == "failure"
                          and (.name == "Build tools" or .name == "Run builder tests" or .name == "Fail run on patch verify failure"
                               or .name == "Fail run on place search index failure")))
             | .name] | first // ""')
          if [ -n "$STOPPED_AT" ]; then
            echo "::notice::Run $LAST_ID stopped at '$STOPPED_AT', which a retry would repeat — not retrying. Investigate manually."
            exit 0
          fi

          # Pin the date: a retry that waits in the runner queue past
          # midnight would otherwise build tomorrow from scratch, breaking
          # the patch chain. Setup fails the run if $TODAY's diff is not
          # published yet.
          ATTEMPT=$((TOTAL + 1))
          echo "Triggering retry $ATTEMPT/$MAX_RETRIES for $TODAY on $BUILD_REF"
          gh workflow run "$WORKFLOW" \
            --ref "$BUILD_REF" \
            -f "build_date=$TODAY"

  # To FUTO o11y: the published build's dates, which the build-stale alert
  # reads, with a heartbeat for watchdog-silent; and the latest finished
  # nightly's outcome, sent from here because a run whose runner died or that
  # timed out never reaches its own report step (see geocoder/README.md,
  # Monitoring).
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the latest nightly's run and job
    env:
      # geocoder-build.yml's O11Y_URL.
      O11Y_URL: https://vmauth.futostatus.com
      LATEST_JSON_URL: https://geoshenanigans-reverse-geocoding.t3.tigrisfiles.io/geocoder/builds/latest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@8d006a0d0a4fd505af7f7ce589e7f768385ff5e4 # v3.0.0

      # The token is read here and handed to the report alone, as in
      # geocoder-build.yml's Report to o11y.
      # The latest finished nightly on main, whatever ended it: a run whose
      # runner died or that timed out never reaches its own report step. A
      # run under any prefix but the live one, a test, is passed over as the
      # retry passes it over, by the same titles. The days of the week are
      # listed whole (workflow_runs.sh), newest first, until one has a live
      # run, so that however many tests ran since the nightly they don't hide
      # it, and the walk ends at the week: a nightly of longer ago was
      # reported on the ticks after it ended. A list that fails ends the
      # walk with nothing to report, rather than an older run.
      - name: Report the published build and the latest nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TF_PROD_ENV }}
        run: |
          if ! token=$(op read "op://tf_prod/O11Y_VICTORIAMETRICS_VMAUTH_PASSWORD/password"); then
            echo "::warning::Could not read the o11y token from 1Password; reporting nothing"
            exit 0
          fi
          echo "::add-mask::$token"
          RUN_JSON="$RUNNER_TEMP/o11y-run.json"
          JOB_JSON="$RUNNER_TEMP/o11y-job.json"
          RUNS_JSON="$RUNNER_TEMP/o11y-runs.json"
          TODAY=$(date -u +%Y-%m-%d)
          echo '{}' > "$RUN_JSON"
          for back in 0 1 2 3 4 5 6 7; do
            DAY=$(date -u -d "$TODAY - $back days" +%Y-%m-%d)
            if ! geocoder/builder/tools/workflow_runs.sh \
                 "repos/$GITHUB_REPOSITORY/actions/workflows/geocoder-build.yml/runs?branch=main&status=completed" \
                 "${DAY}T00:00:00Z" "${DAY}T23:59:59Z" > "$RUNS_JSON"; then
              echo "::warning::Could not list the nightly's runs of $DAY"
              break
            fi
            jq -s '[.[] | select(.display_title == "Build Geocoder Index" or .display_title == "Build Geocoder Index [geocoder]")] | .[0] // {}' \
              "$RUNS_JSON" > "$RUN_JSON"
            if [ -n "$(jq -r '.id // empty' "$RUN_JSON")" ]; then break; fi
          done
          run_id=$(jq -r '.id // empty' "$RUN_JSON")
          if [ -n "$run_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$(jq -r .run_attempt "$RUN_JSON")/jobs" \
              --jq '.jobs[0] // {}' > "$JOB_JSON" || echo "::warning::Could not read the nightly's job"
          else
            echo "::warning::No finished nightly on main to report"
          fi
          O11Y_TOKEN="$token" python3 geocoder/builder/tools/o11y_report.py watchdog --base-url "$O11Y_URL" \
            --latest-url "$LATEST_JSON_URL" --run "$RUN_JSON" --job "$JOB_JSON"
