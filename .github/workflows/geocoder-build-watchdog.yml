name: Geocoder Build Watchdog

# Auto-retry the daily geocoder build if its runner crashes mid-flight
# (annotation "The self-hosted runner lost communication with the
# server"). A cron tick walks today's runs and dispatches a retry when
# none succeeded and none is in flight. There is deliberately no
# workflow_run trigger (zizmor dangerous-triggers): for a daily build,
# a retry that starts up to 2h after the failure is fine.
#
# Self-limiting: walks recent runs, counts how many times we've tried
# today, and bails if we've already retried MAX_RETRIES times. Prevents
# runaway loops if the build is broken for non-runner reasons.

on:
  schedule:
    # Every 2 hours: tight enough that a crashed build is retried
    # within the same day without the watchdog firing constantly.
    - cron: '15 */2 * * *'
  workflow_dispatch: {}

# Single concurrency group so the watchdog never runs twice
# simultaneously (e.g. a manual dispatch landing during the cron run).
# The newer invocation cancels the older.
concurrency:
  group: geocoder-build-watchdog
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # needs gh workflow run

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and maybe retry today's build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Cap how many times we'll retry a single day before giving up.
          # 5 covers ~10h of runner instability — past that, the failure
          # is likely a real bug and a human should look.
          MAX_RETRIES: 5
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          WORKFLOW=geocoder-build.yml

          # Daily builds (and our retries) run on the repo's default
          # branch — that's the only branch GitHub fires scheduled
          # workflows from, so it's where the build workflow lives in
          # production. Derive it instead of hardcoding a branch name.
          BUILD_REF=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)

          # Fetch the last 30 runs of the build workflow and filter to
          # today's runs ON THE DEFAULT BRANCH. The headBranch filter
          # excludes feature-branch test runs that would otherwise skew
          # the retry count. We intentionally do NOT filter by event:
          # both the scheduled run and our own workflow_dispatch retries
          # must count toward MAX_RETRIES. (gh prints UTC ISO timestamps,
          # so startswith($t) is a valid same-day check.)
          RUNS_JSON=$(gh run list \
            --workflow="$WORKFLOW" \
            --limit=30 \
            --json databaseId,conclusion,status,createdAt,event,headBranch)

          TODAY_RUNS=$(echo "$RUNS_JSON" \
            | jq --arg t "$TODAY" --arg ref "$BUILD_REF" \
                 '[.[] | select(.createdAt | startswith($t)) | select(.headBranch == $ref)]')

          TOTAL=$(echo "$TODAY_RUNS" | jq 'length')
          SUCCEEDED=$(echo "$TODAY_RUNS" | jq '[.[] | select(.conclusion == "success")] | length')
          IN_FLIGHT=$(echo "$TODAY_RUNS" | jq '[.[] | select(.status == "in_progress" or .status == "queued" or .status == "pending")] | length')

          echo "Today=$TODAY  total=$TOTAL  succeeded=$SUCCEEDED  in_flight=$IN_FLIGHT"

          if [ "$SUCCEEDED" -gt 0 ]; then
            echo "Today already has a successful build — nothing to do."
            exit 0
          fi

          if [ "$IN_FLIGHT" -gt 0 ]; then
            echo "A build is already running for today — let it finish."
            exit 0
          fi

          if [ "$TOTAL" -eq 0 ]; then
            # No run today at all: the scheduled build owns the first
            # attempt. Dispatching here raced the daily cron and produced
            # duplicate multi-hour builds — the watchdog is retry-only.
            echo "No build attempted today yet — leaving the first attempt to the schedule."
            exit 0
          fi

          if [ "$TOTAL" -ge "$MAX_RETRIES" ]; then
            echo "::error::Reached $MAX_RETRIES attempts for $TODAY without success — giving up. Investigate manually."
            exit 1
          fi

          # Retry only infrastructure failures. A lost runner reports a
          # failed job with no steps at all; these steps fail the same way
          # on every rerun of the same commit and inputs, so a retry only
          # burns hours of the shared runner. A cancelled step means the
          # job hit its timeout (a rerun does the same work and times out
          # again) or someone cancelled the run by hand.
          LAST_ID=$(echo "$TODAY_RUNS" | jq -r 'sort_by(.createdAt) | last | .databaseId')
          STOPPED_AT=$(gh run view "$LAST_ID" --json jobs --jq '
            [.jobs[].steps[]
             | select(.conclusion == "cancelled"
                      or (.conclusion == "failure"
                          and (.name == "Build tools" or .name == "Run builder tests" or .name == "Fail run on patch verify failure")))
             | .name] | first // ""')
          if [ -n "$STOPPED_AT" ]; then
            echo "::notice::Run $LAST_ID stopped at '$STOPPED_AT', which a retry would repeat — not retrying. Investigate manually."
            exit 0
          fi

          # Pin the date: a retry that waits in the runner queue past
          # midnight would otherwise build tomorrow from scratch, breaking
          # the patch chain. Setup fails the run if $TODAY's diff is not
          # published yet.
          ATTEMPT=$((TOTAL + 1))
          echo "Triggering retry $ATTEMPT/$MAX_RETRIES for $TODAY on $BUILD_REF"
          gh workflow run "$WORKFLOW" \
            --ref "$BUILD_REF" \
            -f "build_date=$TODAY"
