[package]
name = "place-search"
version = "0.2.0"
edition = "2021"

# Geocoder-native forward place search over the geocoder's own files: the index holds only
# normalized keys and postings that point at existing records (place_nodes, admin_polygons,
# poi_records); names come from the existing string tiers, context from reverse geocoding.
[lib]
name = "place_search"
path = "src/lib.rs"

[[bin]]
name = "place-search"
path = "src/main.rs"

[dependencies]
fst = "0.4"
levenshtein_automata = "0.2"
unicode-normalization = "0.1"
memmap2 = "0.9"
serde_json = "1"
query-server = { path = "../server" }

[profile.release]
opt-level = 3
lto = true
debug = 1
