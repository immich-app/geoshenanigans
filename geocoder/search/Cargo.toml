[package]
name = "place-search"
version = "0.1.0"
edition = "2021"

# Prototype of geocoder-native forward place search (Immich "Search places").
# Library: corpus loading, fst index build, query. Binary: stdin query runner + bench.
[lib]
name = "place_search"
path = "src/lib.rs"

[[bin]]
name = "place-search"
path = "src/main.rs"

[dependencies]
fst = "0.4"
levenshtein_automata = "0.2"
unicode-normalization = "0.1"
rayon = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
debug = 1
