];

// Whether the shell pattern `pattern` matches `id` whole, as Python's
// fnmatch.fnmatchcase reads it: * any run of characters, ? any one, [...]
// one of a set and [!...] one of none of it (a-z a range; a ] first, a -
// first or last, or a - after a range itself), a [ no ] closes itself, and
// every other character itself.
function namesId(pattern, id) {
  const p = Array.from(pattern), s = Array.from(id);
  // The pattern's parts: '*', or a test of one character.
  const parts = [];
  for (let i = 0; i < p.length;) {
    const c = p[i++];
    if (c === '*') { parts.push('*'); continue; }
    if (c === '?') { parts.push(() => true); continue; }
    let j = i;
    if (c === '[') {
      if (p[j] === '!') j++;
      if (p[j] === ']') j++;
      while (j < p.length && p[j] !== ']') j++;
    }
    if (c !== '[' || j >= p.length) { parts.push((x) => x === c); continue; }
    const none = p[i] === '!';
    const set = p.slice(none ? i + 1 : i, j);
    i = j + 1;
    parts.push((x) => {
      let found = false;
      for (let k = 0; k < set.length && !found; k++) {
        if (set[k + 1] === '-' && k + 2 < set.length) {
          found = set[k].codePointAt(0) <= x.codePointAt(0) && x.codePointAt(0) <= set[k + 2].codePointAt(0);
          k += 2;
        } else {
          found = set[k] === x;
        }
      }
      return found !== none;
    });
  }
  // Each * takes as few characters as it can, one more each time what
  // follows it fails.
  let at = 0, of = 0, star = -1, from = 0;
  while (of < s.length) {
    if (at < parts.length && parts[at] !== '*' && parts[at](s[of])) { at++; of++; }
    else if (parts[at] === '*') { star = at++; from = of; }
    else if (star >= 0) { at = star + 1; of = ++from; }
    else return false;
  }
  while (parts[at] === '*') at++;
  return at === parts.length;
}

// Whether a credit of the build applies to its water alone: of the build's
// components (their ids, as /datasets lists them), those its applies_to
// names (shell patterns of their ids, namesId) are some, and each one of
// water.*. The portal serves the selections without water
// (server/src/portal/catalog.rs's WATER), so such a source is none of the
// answers'.
function ofWaterAlone(entry, components) {
  const to = entry.applies_to;
  if (!Array.isArray(to) || !to.every((p) => typeof p === 'string')) return false;
  const named = components.filter((id) => to.some((p) => namesId(p, id)));
  return named.length > 0 && named.every((id) => id.startsWith('water.'));
}

// The credit of the build served: where /datasets' attribution is a list of
// entries each of a text, its entries but those of the water alone (of the
// components /datasets lists, none where it lists none), then the page's
// (DATA_CREDITS) of the sources it lists none of, by id, in the page's
// order; else, or where none is left, DATA_CREDITS.
function dataCredits(catalog) {
  const listed = catalog ? catalog.attribution : null;
  const reads = Array.isArray(listed) && listed.length > 0
    && listed.every((e) => e && typeof e === 'object' && typeof e.text === 'string' && e.text !== '');
  const components = (catalog && Array.isArray(catalog.components) ? catalog.components : []).filter((c) => typeof c === 'string');
  const own = reads ? listed.filter((e) => !ofWaterAlone(e, components)) : [];
  if (!own.length) return DATA_CREDITS;
  const ids = new Set(own.map((e) => e.id));
  return [...own, ...DATA_CREDITS.filter((e) => !ids.has(e.id))];
}

// `text` as a link to `url`, opened in a tab of its own; the text alone
// where the URL is none of http or https.
function creditLink(url, text) {
  if (typeof url !== 'string' || !/^https?:\/\//i.test(url)) return esc(text);
  return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`;
}

// An entry of a credit: its source, its licence and its notices (those that
// are strings).
function creditHtml(entry) {
  const licence = typeof entry.licence === 'string' && entry.licence ? `, ${creditLink(entry.licence_url, entry.licence)}` : '';
  const notices = (Array.isArray(entry.notices) ? entry.notices : []).filter((n) => typeof n === 'string' && n);
  return `<div class="credit"><div class="credit-source">${creditLink(entry.url, entry.text)}${licence}</div>`
    + (notices.length ? `<ul>${notices.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : '')
    + '</div>';
}

// The sources in full, as the page's disclosure holds them: the build's
// (dataCredits; data-from says whether the build's own, the page's of the
// sources it lists none of after them, or the page's alone), then the
// Immich column's where /datasets lists it.
function creditsHtml(catalog) {
  const credits = dataCredits(catalog);
  let html = `<div class="credit-group" data-from="${credits === DATA_CREDITS ? 'page' : 'build'}">`
    + `<div class="credit-head">The datasets' answers</div>${credits.map(creditHtml).join('')}</div>`;
  if (((catalog && catalog.others) || []).some((o) => o && o.kind === 'immich')) {
    html += `<div class="credit-group" data-from="immich"><div class="credit-head">The Immich column's answers</div>${IMMICH_CREDITS.map(creditHtml).join('')}</div>`;
  }
  return html;
}

// `obj` as JSON, escaped, its keys, strings, numbers and literals marked for
// their colours.
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return json.replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    function(match) {
      let cls = 'json-number';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-string';
      } else if (/true|false/.test(match)) {
        cls = 'json-bool';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return `<span class="${cls}">${match}</span>`;
    }
  );
}
</script>

<script>
// -- Map setup --
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.immich.cloud/v1/style/dark.json',
  center: [0, 40],
  zoom: 3,
  // MapLibre cancels the tiles still loading for the levels a zoom passes
  // through by default, so detail only appeared once the zoom settled.
  cancelPendingTileRequestsWhileZooming: false
});
const mapLoaded = new Promise((resolve) => map.on('load', resolve));

// Marker color map
const MARKER_COLORS = {
  gray: '#888888',
  green: '#4caf80',
  blue: '#4a90d9',
  red: '#d94a4a'
};

const markers = new Map(); // id -> {marker, color, label}
const results = [];        // {id, lat, lng, source, answers: {column key: answer}, nominatim}
let selectedId = null;

// -- Datasets and columns --
// How the page answers (catalogMode), the server's /datasets (catalog) and
// the columns, each a resolveColumn(). A server of one dataset, or a portal
// waiting for its build, has the one column SINGLE.
const SINGLE = { single: true, token: null, dataset: null, custom: false, selection: null, error: null, note: null };
const link = parseLink(location.search);
let mode = 'waiting';
let catalog = null;
let columns = [SINGLE];
// The columns' tokens as the link or the pickers last named them, kept while
// the portal waits for a build.
let wanted = link.datasets.slice();
let waitingFor = '';
let mismatchDismissed = false;

const pacer = new Pacer({ fetch: (url, signal) => fetch(url, { signal }), now: () => performance.now() });
// Nominatim's public API is asked one request at a time.
const nominatimPacer = new Pacer({ limit: 1, fetch: (url, signal) => fetch(url, { signal }), now: () => performance.now() });

// The build served, by its publication ID: a build published again under
// its date is another.
function servedBuild() {
  return catalog ? catalog.build.id : null;
}

function columnLabel(col) {
  if (col.single) return 'This server';
  return col.dataset ? col.dataset.label : col.token;
}

// Each column's view of `entry`'s answers (detailHtml, cardHtml).
function columnViews(entry) {
  return columns.map((col, i) => {
    const key = columnKey(col);
    const answer = key === null ? { error: col.error } : entry.answers[key] || null;
    return { label: columnLabel(col), color: COLUMN_COLORS[i], dataset: col.dataset, answer };
  });
}

let catalogRetry = null;
// The loads of /datasets begun (the retry timer's and the health poll's
// may overlap): one that a later one began after changes nothing.
let catalogLoads = 0;

// Asks /datasets how the page answers, and lays out its columns: as they
// were named (the link's or the pickers'), else OPENING_PRESETS, and the
// search (updateSearch). While the portal waits for a build, it asks again
// every 30 s; once the build is in, the points looked up meanwhile are asked
// in the columns. Where that moves the polygon overlay (another dataset at
// its column, another build, or no column), what it drew goes, and the
// selected result's polygons are asked anew where its column still has a
// dataset.
async function loadCatalog() {
  const load = ++catalogLoads;
  clearTimeout(catalogRetry);
  let status = 0;
  let json = null;
  let body = '';
  try {
    const resp = await fetch('/datasets');
    status = resp.status;
    body = await resp.text();
    json = JSON.parse(body);
  } catch (e) {
    if (!status) body = e.message;
  }
  if (load !== catalogLoads) return;
  const shown = overlayTarget(polygonsColumn, columns, servedBuild());
  const waited = mode === 'waiting';
  mode = catalogMode(status, json);
  if (mode === 'catalog') {
    catalog = json;
    columns = (wanted.length ? wanted : openingTokens(catalog)).map((token) => resolveColumn(catalog, token));
    wanted = columns.map((c) => c.token);
  } else {
    catalog = null;
    columns = [SINGLE];
    waitingFor = body.slice(0, 300);
    if (mode === 'waiting') catalogRetry = setTimeout(loadCatalog, 30000);
  }
  if (polygonsColumn !== 'off' && polygonsColumn >= columns.length) polygonsColumn = 'off';
  document.getElementById('feedbackBtn').hidden = mode !== 'catalog';
  renderColumns();
  renderBanner();
  renderCredits();
  updatePolygonsBtn();
  updateLink();
  updateSearch();
  results.forEach(placeMarker);
  renderResults();
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    showDetail(entry.id);
  }
  // A point looked up while the portal waited was asked of the server as it
  // was (the key '').
  if (waited && mode === 'catalog') results.filter((r) => '' in r.answers).forEach((r) => askColumns(r));
  if (overlayMoved(shown, overlayTarget(polygonsColumn, columns, servedBuild()))) {
    clearPolygonLayer();
    if (polygonsColumn !== 'off' && entry) updatePolygonLayer(entry.id);
  }
}

function renderColumns() {
  const el = document.getElementById('columns');
  if (mode !== 'catalog') {
    el.innerHTML = `<div class="columns-note">${mode === 'single'
      ? 'This server serves one dataset: it has no /datasets to choose from.'
      : 'One column, from the server as it is, until its build is in.'}</div>`;
    return;
  }
  let html = columns.map((col, i) => pickerHtml(catalog, col, i, columns.length)).join('');
  if (columns.length < MAX_COLUMNS) html += '<button class="add-column" data-action="add" title="Compare another dataset">+ Column</button>';
  // The control that had the focus (a select arrowed through from the
  // keyboard changes on each step) gets it back once drawn anew.
  const focused = el.contains(document.activeElement) ? controlKey(document.activeElement.dataset) : null;
  el.innerHTML = html;
  const again = focused === null ? null : [...el.querySelectorAll('select, button')].find((c) => controlKey(c.dataset) === focused);
  if (again) again.focus();
}

function renderBanner() {
  const el = document.getElementById('banner');
  if (mode === 'waiting') {
    el.innerHTML = `<span>Waiting for the portal's build (asked again every 30 s): ${esc(waitingFor || 'no answer')}</span>`;
    return;
  }
  const flag = mismatchDismissed ? '' : mismatchHtml(link.build, servedBuild());
  el.innerHTML = flag ? `<span>${flag}</span><button onclick="dismissMismatch()" title="Dismiss">×</button>` : '';
}

function dismissMismatch() {
  mismatchDismissed = true;
  renderBanner();
}

// A column picked anew, added or removed by `change`: the link, the polygon
// button, the markers (coloured by the first column), the cards, the
// selected result's answers, and the search (a dataset picked anew asked).
// Where that moves the polygon overlay (another dataset at its column, or no
// column), what it drew goes at once, and the selected result's polygons are
// asked anew where its column has a dataset.
function changeColumns(change) {
  const shown = overlayTarget(polygonsColumn, columns, servedBuild());
  change();
  wanted = columns.map((c) => c.token);
  renderColumns();
  updatePolygonsBtn();
  updateLink();
  results.forEach(placeMarker);
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    showDetail(entry.id);
  }
  if (overlayMoved(shown, overlayTarget(polygonsColumn, columns, servedBuild()))) {
    clearPolygonLayer();
    if (polygonsColumn !== 'off' && entry) updatePolygonLayer(entry.id);
  }
  renderResults();
  saveResults();
  placeSearch.ask();
  renderSearch();
}

function setColumn(i, col) {
  changeColumns(() => { columns[i] = col; });
}

const columnsEl = document.getElementById('columns');
columnsEl.addEventListener('change', (e) => {
  const el = e.target;
  const i = Number(el.dataset.col);
  if (mode !== 'catalog' || !columns[i]) return;
  if (el.dataset.role === 'preset') {
    if (el.value) {
      setColumn(i, resolveColumn(catalog, el.value));
    } else {
      // Custom: the axes of the dataset the column had (of one of the
      // others, those its selection keeps).
      const had = pointsOnly(columns[i].dataset) ? null : columns[i].dataset;
      const from = had || datasetOf(catalog, columns[i].selection) || defaultDataset(catalog);
      setColumn(i, resolveColumn(catalog, from.id));
    }
  } else if (el.dataset.axis) {
    const picked = pick(catalog, columns[i].selection, el.dataset.axis, el.value);
    if (picked) setColumn(i, { ...resolveColumn(catalog, picked.dataset.id), note: picked.note });
    else renderColumns();
  }
});
columnsEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || mode !== 'catalog') return;
  if (el.dataset.action === 'add' && columns.length < MAX_COLUMNS) {
    changeColumns(() => columns.push(resolveColumn(catalog, addedToken(catalog, columns))));
  } else if (el.dataset.action === 'remove' && columns.length > 1) {
    const i = Number(el.dataset.col);
    changeColumns(() => {
      columns.splice(i, 1);
      if (polygonsColumn === i) polygonsColumn = 'off';
      else if (polygonsColumn !== 'off' && polygonsColumn > i) polygonsColumn--;
      localStorage.setItem('polygons_column', String(polygonsColumn));
    });
  }
});

// The page's URL: the columns, the selected point and the build that
// answered it (linkBuild; the build served without one), and the search
// box's text while it has any, so that a copy of it opens the same columns
// on the same point and search, flagged where another build answers it
// then. Until the link's points are looked up (once the map is in) it stays
// the link the page opened, so that a reload meanwhile opens them still.
let linkRestored = false;
function updateLink() {
  if (!linkRestored) return;
  const entry = selectedEntry();
  const served = servedBuild() || (mode === 'waiting' ? link.build : null);
  const keys = columns.map(columnKey).filter((key) => key !== null);
  const search = linkSearch({
    datasets: mode === 'single' ? [] : wanted,
    point: entry ? { lat: entry.lat, lng: entry.lng } : null,
    build: entry ? linkBuild(entry.answers, keys, served) : served,
    q: mode === 'single' || !searchBox.value.trim() ? '' : searchBox.value,
  });
  history.replaceState(null, '', location.pathname + search + location.hash);
}

function copyLink(btn) {
  updateLink();
  copyToClipboard(location.href, btn);
}

// -- Place search --
// On a portal whose /datasets names the datasets' indexes, the search box
// searches each column's dataset as one types (PlaceSearch), its requests
// in a rate-limit scope of their own ('search'). Its results go into one
// matrix, and on the map as a dot for each of its rows, coloured by the
// columns that have it, until the next search or the box is emptied. A
// click on a row or a dot looks up its point in every column, as a click on
// the map does; hovering a row marks its dot, and hovering a dot its row.
const searchSection = document.getElementById('searchSection');
const searchBox = document.getElementById('searchInput');
const searchOut = document.getElementById('searchOut');
const placeSearch = new PlaceSearch({
  request: (url, signal) => pacer.request(url, 'search', signal),
  datasets: () => searchDatasets(columns),
  changed: searchChanged,
});
searchBox.value = link.q;
// The rows of the matrix (by data-row); the search whose matrix shows every
// row; the dots on the map, and what they show; the row hovered; /health as
// last asked; the search the link last carried; and whether the map is in.
let searchShown = [];
let searchExpanded = null;
let searchDots = [];
let dotsDrawn = '';
let searchHovered = null;
let lastHealth = null;
let searchLinked = '';
let mapReady = false;

function searchViews() {
  return columns.map((col, i) => ({
    label: columnLabel(col),
    color: COLUMN_COLORS[i],
    dataset: col.dataset,
    error: col.error,
    answer: col.dataset ? placeSearch.answers[col.dataset.id] || null : null,
  }));
}

function searchChanged() {
  renderSearch();
  if (placeSearch.q !== searchLinked) {
    searchLinked = placeSearch.q;
    updateLink();
  }
}

function renderSearch() {
  const views = searchViews();
  searchShown = placeSearch.q ? searchRows(views.map((v) => (v.answer && v.answer.results) || null)) : [];
  searchOut.innerHTML = placeSearch.q ? searchHtml(views, lastHealth, searchShown, searchExpanded === placeSearch.q) : '';
  drawSearchDots(views);
  // The row under the pointer, drawn anew, keeps its mark, and its dot.
  const hovered = searchHovered;
  searchHovered = undefined;
  hoverSearchRow(hovered);
}

// Once /datasets is in: the search where the server offers it, of the box's
// text (the link's q= at first), the search shown asked anew (of another
// build); none where it doesn't offer it.
function updateSearch() {
  const offered = searchOffered(mode, catalog);
  searchSection.hidden = !offered;
  if (!offered) placeSearch.clear();
  else if (placeSearch.q) placeSearch.again();
  else if (searchBox.value.trim()) placeSearch.submit(searchBox.value);
}

// A dot for each row of the matrix, drawn anew only where they change.
function drawSearchDots(views) {
  if (!mapReady) return;
  const colors = views.map((v) => v.color);
  const labels = views.map((v) => v.label);
  const dots = searchShown.map((row) => ({ row, background: dotBackground(row, colors), title: dotTitle(row, labels) }));
  const drawn = JSON.stringify(dots.map((d) => [d.row.lat, d.row.lng, d.background, d.title]));
  if (drawn === dotsDrawn) return;
  dotsDrawn = drawn;
  for (const dot of searchDots) dot.remove();
  searchDots = dots.map((d, n) => {
    const el = document.createElement('div');
    el.className = 'search-dot';
    el.title = d.title;
    const fill = document.createElement('div');
    fill.className = 'search-dot-fill';
    fill.style.background = d.background;
    el.appendChild(fill);
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      pickSearchRow(n);
    });
    el.addEventListener('mouseenter', () => hoverSearchRow(n));
    el.addEventListener('mouseleave', () => hoverSearchRow(null));
    return new maplibregl.Marker({ element: el }).setLngLat([d.row.lng, d.row.lat]).addTo(map);
  });
}

// Marks the row `n` of the matrix and its dot (none: null).
function hoverSearchRow(n) {
  if (n === searchHovered) return;
  searchHovered = n;
  searchDots.forEach((dot, i) => dot.getElement().classList.toggle('hover', i === n));
  searchOut.querySelectorAll('tr[data-row]').forEach((tr) => tr.classList.toggle('hover', Number(tr.dataset.row) === n));
}

// The row `n`'s point, looked up in every column.
function pickSearchRow(n) {
  const row = searchShown[n];
  if (row) reverseGeocode(row.lat, row.lng, searchSource(placeSearch.q, row, columns.map(columnLabel)));
}

searchBox.addEventListener('input', () => placeSearch.typed(searchBox.value));
searchBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    placeSearch.submit(searchBox.value);
  }
});
searchOut.addEventListener('click', (e) => {
  const disagree = e.target.closest('[data-feedback-search]');
  if (disagree) {
    const view = searchViews()[Number(disagree.dataset.feedbackSearch)];
    if (view && view.answer && view.answer.results) openFeedback(searchTarget(view, placeSearch.q));
    return;
  }
  if (e.target.closest('[data-action="more"]')) {
    searchExpanded = searchExpanded === placeSearch.q ? null : placeSearch.q;
    renderSearch();
    return;
  }
  const tr = e.target.closest('tr[data-row]');
  if (tr) pickSearchRow(Number(tr.dataset.row));
});
searchOut.addEventListener('mouseover', (e) => {
  const tr = e.target.closest('tr[data-row]');
  hoverSearchRow(tr ? Number(tr.dataset.row) : null);
});
searchOut.addEventListener('mouseleave', () => hoverSearchRow(null));

// -- Status --
// The portal's /health, every minute (every 5 s while a sync runs): the
// status line, the progress of the indexes a column of the search waits
// for, and the datasets anew once another build is served (catalogStale).
async function pollHealth() {
  let health = null;
  try {
    health = await (await fetch('/health')).json();
  } catch (e) {}
  document.getElementById('status').innerHTML = statusHtml(health);
  lastHealth = health;
  if (Object.values(placeSearch.answers).some((a) => a && a.building)) renderSearch();
  if (catalogStale(health, mode, catalog)) await loadCatalog();
  setTimeout(pollHealth, health && health.sync && health.sync.running ? 5000 : 60000);
}

// -- LocalStorage persistence --
const STORAGE_KEY = 'geocoder_test_results';

// The results, each as savedResult saves it, and why not beside their
// count where the storage refuses them. Clear empties them.
function saveResults() {
  document.getElementById('saveError').textContent = keep(localStorage, STORAGE_KEY, JSON.stringify(results.map(savedResult)));
}

function loadResults() {
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}
  for (const r of Array.isArray(stored) ? stored : []) {
    const entry = storedResult(r);
    if (!entry) continue;
    results.push(entry);
    placeMarker(entry);
  }
  renderResults();
}

function clearResults() {
  results.length = 0;
  selectedId = null;
  markers.forEach(m => m.marker.remove());
  markers.clear();
  localStorage.removeItem(STORAGE_KEY);
  document.getElementById('saveError').textContent = '';
  clearPolygonLayer();
  renderResults();
  updateLink();
  document.getElementById('detailPanel').classList.remove('visible');
}

// Asks every column again for every stored result, after the server's
// build changed. Nominatim's answers stay: they don't change with ours.
function retestAllResults() {
  if (results.length === 0) return;
  const btn = document.getElementById('retestBtn');
  const all = results.slice();
  let done = 0;
  btn.disabled = true;
  btn.textContent = `Re-testing… 0/${all.length}`;
  Promise.all(all.map((entry) => askColumns(entry, true).then(() => {
    done++;
    btn.textContent = `Re-testing… ${done}/${all.length}`;
  }))).then(() => {
    btn.disabled = false;
    btn.textContent = 'Re-test';
  });
}

// -- Click map to geocode --
map.on('click', function(e) {
  reverseGeocode(e.lngLat.lat, e.lngLat.lng, 'map click');
});

// -- Coordinate lookup --
function lookupCoords() {
  const text = document.getElementById('coordInput').value.trim();
  if (!text) return;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    const parts = line.split(/[\s,]+/).map(Number);
    if (parts.length >= 2 && isFinite(parts[0]) && isFinite(parts[1])) {
      reverseGeocode(parts[0], parts[1], 'manual');
    }
  }
  document.getElementById('coordInput').value = '';
}

document.getElementById('coordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    lookupCoords();
  }
});

// -- Photo upload --
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

async function handleFiles(files) {
  const photoList = document.getElementById('photoList');
  for (const file of files) {
    const item = document.createElement('div');
    item.className = 'photo-item';
    const name = `<span>${esc(file.name)}</span>`;
    item.innerHTML = `${name}<span>extracting...</span>`;
    photoList.appendChild(item);

    try {
      const exif = await exifr.gps(file);
      if (exif && isFinite(exif.latitude) && isFinite(exif.longitude)) {
        item.innerHTML = `${name}<span class="coords">${exif.latitude.toFixed(5)}, ${exif.longitude.toFixed(5)}</span>`;
        reverseGeocode(exif.latitude, exif.longitude, file.name);
      } else {
        item.innerHTML = `${name}<span class="no-gps">No GPS data</span>`;
      }
    } catch (err) {
      item.innerHTML = `${name}<span class="no-gps">EXIF error</span>`;
    }
  }
  photoList.scrollTop = photoList.scrollHeight;
}

// -- Reverse geocode --
function newId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function selectedEntry() {
  return results.find((r) => r.id === selectedId) || null;
}

// A new result at (lat, lng): every column is asked, and Nominatim if on.
function reverseGeocode(lat, lng, source) {
  const entry = { id: newId(), lat, lng, source, answers: {}, nominatim: null };
  results.unshift(entry);
  map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 10) });
  placeMarker(entry);
  selectResult(entry.id);
}

// The link's points: each asked afresh in every column (a stored result of
// the point is asked again), the link's first ending selected.
function lookupLinkPoints() {
  for (const p of link.points.slice().reverse()) {
    const entry = results.find((r) => r.lat === p.lat && r.lng === p.lng);
    if (!entry) {
      reverseGeocode(p.lat, p.lng, 'link');
      continue;
    }
    results.splice(results.indexOf(entry), 1);
    results.unshift(entry);
    askColumns(entry, true);
    selectResult(entry.id);
    map.flyTo({ center: [entry.lng, entry.lat], zoom: Math.max(map.getZoom(), 10) });
  }
}

// Asks each column without an answer for `entry` for one (with `again`,
// each column, one being asked already waited for rather than asked
// again), and gives when those answers are in. Columns of one dataset are
// asked once. An answer being asked keeps the promise of its ask (pending).
function askColumns(entry, again = false) {
  const keys = new Map();
  for (const col of columns) {
    const key = columnKey(col);
    if (key !== null && !keys.has(key)) keys.set(key, col);
  }
  const asks = [];
  for (const [key, col] of keys) {
    const have = entry.answers[key];
    if (have && have.loading) {
      if (again) asks.push(have.pending);
      continue;
    }
    if (have && !again) continue;
    const asking = ask(entry, key, col);
    entry.answers[key].pending = asking;
    asks.push(asking);
  }
  return Promise.all(asks);
}

async function ask(entry, key, col) {
  entry.answers[key] = { loading: true };
  answered(entry);
  let answer;
  try {
    const dataset = col.dataset ? `&dataset=${encodeURIComponent(col.dataset.id)}` : '';
    const got = await pacer.request(`/reverse?lat=${entry.lat}&lon=${entry.lng}&key=test${dataset}`, 'reverse');
    answer = answerOf(got.status, got.header, got.body, got.ms);
  } catch (e) {
    answer = { error: e.message };
  }
  entry.answers[key] = answer;
  answered(entry);
}

// Asks Nominatim, where it is on, for `entry`, unless it has its answer or
// is being asked; a request that failed is asked again. One cancelled by
// turning Nominatim off (nominatimCancel) leaves neither an answer nor an
// error: it is asked again once Nominatim is on.
async function askNominatim(entry) {
  if (!nominatimEnabled || entry.nominatim || entry.nominatimLoading) return;
  const { signal } = nominatimCancel;
  entry.nominatimLoading = true;
  entry.nominatimError = null;
  answered(entry);
  try {
    const got = await nominatimPacer.request(`https://nominatim.openstreetmap.org/reverse?lat=${entry.lat}&lon=${entry.lng}&format=jsonv2`, 'reverse', signal);
    const answer = answerOf(got.status, () => null, got.body, got.ms);
    entry.nominatim = answer.data || null;
    entry.nominatimError = answer.error || null;
  } catch (e) {
    if (!signal.aborted) entry.nominatimError = e.message;
  }
  entry.nominatimLoading = false;
  answered(entry);
}

// After an answer of `entry` came in or went out: its marker now, and the
// list, the detail and the link (of the selected result) and the saved
// results once for the answers of 50 ms.
let renderQueued = false;
let detailDirty = false;
function answered(entry) {
  if (!results.includes(entry)) return;
  placeMarker(entry);
  if (entry.id === selectedId) detailDirty = true;
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => {
    renderQueued = false;
    renderResults();
    if (detailDirty) {
      detailDirty = false;
      showDetail(selectedId);
      updateLink();
    }
    saveResults();
  }, 50);
}

// The marker of `entry`, coloured by the first column's answer: gray until
// it is in, red for an error, green with places, else blue.
function placeMarker(entry) {
  const key = columns.length ? columnKey(columns[0]) : null;
  const a = key === null ? null : entry.answers[key];
  const color = !a || a.loading ? MARKER_COLORS.gray
    : a.error ? MARKER_COLORS.red
    : a.data && a.data.places && a.data.places.length ? MARKER_COLORS.green
    : MARKER_COLORS.blue;
  const label = a && a.data ? a.data.display_name || `${entry.lat.toFixed(4)}, ${entry.lng.toFixed(4)}` : null;
  const m = markers.get(entry.id);
  if (m && m.color === color && m.label === label) return;
  if (m) m.marker.remove();
  const marker = new maplibregl.Marker({ color })
    .setLngLat([entry.lng, entry.lat])
    .addTo(map);
  if (label) {
    const places = (a.data.places || []).length;
    marker.setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(
      `<b>${esc(label)}</b>${places ? `<br>${places} place(s)` : ''}`
    ));
  }
  marker.getElement().addEventListener('click', (e) => {
    e.stopPropagation();
    selectResult(entry.id);
  });
  markers.set(entry.id, { marker, color, label });
}

// -- Render results list --
function renderResults() {
  document.getElementById('resultCount').textContent = `(${results.length})`;
  document.getElementById('resultsList').innerHTML = results.map((r) => cardHtml(r, columnViews(r), r.id === selectedId)).join('');
}

// One handler for every card: the copy button copies its coordinates, a
// click elsewhere selects the result. The list can grow large and is drawn
// anew on each answer, so its cards hold no handlers of their own.
document.getElementById('resultsList').addEventListener('click', (ev) => {
  const copy = ev.target.closest('.result-copy');
  if (copy) {
    ev.stopPropagation();
    copyToClipboard(copy.getAttribute('data-copy') || '', copy);
    return;
  }
  const card = ev.target.closest('.result-card');
  const entry = card && results.find((r) => String(r.id) === card.dataset.id);
  if (!entry) return;
  selectResult(entry.id);
  map.flyTo({ center: [entry.lng, entry.lat], zoom: Math.max(map.getZoom(), 13) });
});

function copyToClipboard(text, btn) {
  const finish = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 1000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => legacyCopy(text, finish));
  } else {
    legacyCopy(text, finish);
  }
}
function legacyCopy(text, cb) {
  // Fallback for older browsers / non-HTTPS origins where the async
  // Clipboard API is unavailable. A hidden textarea + execCommand
  // is the standard workaround.
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  cb && cb();
}

// Selects a result: its card, its detail (any column it has no answer of
// asked, and Nominatim where it is on), its polygons and the link.
function selectResult(id) {
  selectedId = id;
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    askNominatim(entry);
  }
  renderResults();
  showDetail(id);
  if (polygonsColumn !== 'off') updatePolygonLayer(id);
  updateLink();
}

// -- Polygon overlay --
const POLY_SOURCE = 'debug-polygons';
const POLY_LABEL_SOURCE = 'debug-polygon-labels';
const POLY_FILL = 'debug-polygons-fill';
const POLY_LINE = 'debug-polygons-line';
const POLY_LABELS = 'debug-polygons-labels';
// The overlay: 'off', or the place of the column whose dataset's /polygons
// it shows. Use to A/B the polygons a smaller dataset drops.
let polygonsColumn = (() => {
  const saved = localStorage.getItem('polygons_column');
  return saved !== null && /^\d+$/.test(saved) ? Number(saved) : 'off';
})();
// The overlay's requests: the polygons of the selected result in the
// overlay's column's dataset, while it is on.
const polygonOverlay = new PolygonOverlay({
  request: (url, signal) => pacer.request(url, 'polygons', signal),
  draw: drawPolygons,
  erase: erasePolygons,
  shown: () => {
    const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
    const key = col ? polygonKey(col) : null;
    return key === null || selectedId === null ? null : { id: selectedId, key };
  },
});

// Nominatim side-by-side lookup is opt-in — every query goes out to
// nominatim.openstreetmap.org so we don't want to hit it unsolicited.
// Default off; toggle button persists choice in localStorage.
let nominatimEnabled = localStorage.getItem('nominatim_enabled') === '1';
// Cancels Nominatim's requests, those queued and the one in flight, once it
// is turned off: none goes after.
let nominatimCancel = new AbortController();
function toggleNominatim() {
  nominatimEnabled = !nominatimEnabled;
  localStorage.setItem('nominatim_enabled', nominatimEnabled ? '1' : '0');
  if (!nominatimEnabled) {
    nominatimCancel.abort();
    nominatimCancel = new AbortController();
  }
  updateNominatimBtn();
  // The selected result gets its comparison at once, without a new query.
  const entry = selectedEntry();
  if (entry) {
    askNominatim(entry);
    showDetail(entry.id);
  }
}
function updateNominatimBtn() {
  const btn = document.getElementById('nominatimBtn');
  btn.textContent = 'Nominatim: ' + (nominatimEnabled ? 'On' : 'Off');
  btn.style.background = nominatimEnabled ? 'var(--green)' : 'var(--surface2)';
}

// Shoelace-weighted centroid of a closed lng/lat ring
function polygonCentroid(ring) {
  let cx = 0, cy = 0, area = 0;
  const n = ring.length - 1; // last vertex == first for closed rings
  for (let i = 0; i < n; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[i + 1];
    const cross = x1 * y2 - x2 * y1;
    area += cross;
    cx += (x1 + x2) * cross;
    cy += (y1 + y2) * cross;
  }
  area /= 2;
  if (Math.abs(area) < 1e-12) return ring[0];
  return [cx / (6 * area), cy / (6 * area)];
}

function ensurePolygonLayer() {
  if (!map.isStyleLoaded()) { map.once('idle', ensurePolygonLayer); return; }
  if (map.getSource(POLY_SOURCE)) return;
  map.addSource(POLY_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource(POLY_LABEL_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  // Color ramp by admin_level: coarser = warmer, finer = cooler, postal = magenta
  const colorExpr = ['match', ['get', 'admin_level'],
    2, '#ff4444',  // country
    3, '#ff7744',
    4, '#ffaa44',  // state
    5, '#ffdd44',
    6, '#aadd44',  // county
    7, '#44dd88',
    8, '#44ddcc',  // city
    9, '#44aadd',
    10, '#4488dd', // suburb
    11, '#4466dd',
    12, '#5555cc',
    15, '#8844dd', // class=place marker
    99, '#dd44bb', // postal
    '#888888'
  ];
  map.addLayer({
    id: POLY_FILL,
    type: 'fill',
    source: POLY_SOURCE,
    paint: { 'fill-color': colorExpr, 'fill-opacity': 0.12 }
  });
  map.addLayer({
    id: POLY_LINE,
    type: 'line',
    source: POLY_SOURCE,
    paint: { 'line-color': colorExpr, 'line-width': 2, 'line-opacity': 0.9 }
  });
  map.addLayer({
    id: POLY_LABELS,
    type: 'symbol',
    source: POLY_LABEL_SOURCE,
    layout: {
      'text-field': ['concat', ['to-string', ['get', 'admin_level']], ': ', ['get', 'name']],
      'text-size': 12,
      'symbol-placement': 'point',
      'text-allow-overlap': true,
      'text-ignore-placement': true,
      'text-anchor': 'center',
    },
    paint: { 'text-color': '#ffffff', 'text-halo-color': '#000000', 'text-halo-width': 1.5 }
  });
  // Click a polygon to see its properties in the console + popup
  map.on('click', POLY_FILL, (e) => {
    if (!e.features || !e.features[0]) return;
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true })
      .setLngLat(e.lngLat)
      .setHTML(`<b>${esc(p.name)}</b><br>admin_level ${esc(p.admin_level)}<br>kind: ${esc(p.kind)}<br>area: ${Number(p.area).toExponential(2)}`)
      .addTo(map);
  });
}

// Erases the polygons drawn, and every answer still to come goes unused
// (the overlay off, its column removed, the results cleared).
function clearPolygonLayer() {
  polygonOverlay.clear();
}

function erasePolygons() {
  const src = map.getSource(POLY_SOURCE);
  if (src) src.setData({ type: 'FeatureCollection', features: [] });
  const lsrc = map.getSource(POLY_LABEL_SOURCE);
  if (lsrc) lsrc.setData({ type: 'FeatureCollection', features: [] });
}

function drawPolygons(fc) {
  // Sort largest-first so smaller polygons render on top
  if (fc.features) {
    fc.features.sort((a, b) => (b.properties.area || 0) - (a.properties.area || 0));
  }
  const src = map.getSource(POLY_SOURCE);
  if (src) src.setData(fc);
  // Build a parallel point FeatureCollection for label placement at centroids
  const labelFc = {
    type: 'FeatureCollection',
    features: (fc.features || []).map(f => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: polygonCentroid(f.geometry.coordinates[0]) },
      properties: f.properties,
    })),
  };
  const lsrc = map.getSource(POLY_LABEL_SOURCE);
  if (lsrc) lsrc.setData(labelFc);
}

function updatePolygonLayer(id) {
  const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
  const r = results.find(x => x.id === id);
  if (!col || polygonKey(col) === null || !r) { clearPolygonLayer(); return; }
  ensurePolygonLayer();
  const dataset = col.dataset ? `&dataset=${encodeURIComponent(col.dataset.id)}` : '';
  polygonOverlay.show(id, columnKey(col), `/polygons?lat=${r.lat}&lon=${r.lng}&key=test${dataset}`)
    .catch(err => console.warn('polygons fetch failed:', err));
}

function togglePolygons() {
  polygonsColumn = nextPolygons(polygonsColumn, columns.length);
  localStorage.setItem('polygons_column', String(polygonsColumn));
  updatePolygonsBtn();
  if (polygonsColumn === 'off') {
    clearPolygonLayer();
  } else {
    ensurePolygonLayer();
    if (selectedId !== null) updatePolygonLayer(selectedId);
  }
}
function updatePolygonsBtn() {
  const btn = document.getElementById('polygonsBtn');
  const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
  btn.textContent = `Polygons: ${col ? columnLabel(col) : 'Off'}${col && polygonKey(col) === null ? ' (none)' : ''}`;
  btn.style.background = col ? COLUMN_COLORS[polygonsColumn] : 'var(--surface2)';
}

// -- Detail panel --
let detailShown = null;
function showDetail(id) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');
  const entry = results.find(x => x.id === id);
  if (!entry) { panel.classList.remove('visible'); detailShown = null; return; }
  panel.classList.add('visible');
  const views = columnViews(entry);
  if (nominatimEnabled) views.push(nominatimView(entry));
  // An answer coming in keeps the JSON blocks of the result open, each by
  // the place of its view.
  const open = detailShown === id ? [...content.querySelectorAll('details')].filter((d) => d.open).map((d) => d.dataset.view) : [];
  content.innerHTML = detailHtml(views, servedBuild(), immichCountryNames(catalog));
  content.querySelectorAll('details').forEach((d) => { if (open.includes(d.dataset.view)) d.open = true; });
  detailShown = id;
}

// -- Feedback --
// A column's "Disagree?" button, in the detail or the search, opens the
// form of a report of its answer (feedbackFormHtml) in a dialog, and the
// toolbar's Feedback one of the page; the portal only, which has /feedback.
// Send posts the report and thanks, with /feedback/count, or says why the
// portal didn't take it; Cancel or Escape closes the dialog.
const feedbackDialog = document.getElementById('feedbackDialog');
const feedbackForm = document.getElementById('feedbackForm');
let feedbackTarget = null;

function openFeedback(target) {
  feedbackTarget = target;
  let contact = '';
  try { contact = localStorage.getItem(FEEDBACK_CONTACT_KEY) || ''; } catch (err) {}
  feedbackForm.innerHTML = feedbackFormHtml(target, contact);
  feedbackDialog.showModal();
}

function openGeneralFeedback() {
  openFeedback(generalTarget(selectedEntry(), servedBuild()));
}

// The link's state as updateLink writes it: the columns, the selected
// point and the search box's text.
function feedbackPage() {
  const entry = selectedEntry();
  return {
    columns: mode === 'single' ? [] : wanted,
    point: entry ? { lat: entry.lat, lng: entry.lng } : null,
    q: mode === 'single' || !searchBox.value.trim() ? '' : searchBox.value,
  };
}

document.getElementById('detailContent').addEventListener('click', (e) => {
  const disagree = e.target.closest('[data-feedback]');
  const entry = selectedEntry();
  if (!disagree || !entry) return;
  const view = columnViews(entry)[Number(disagree.dataset.feedback)];
  if (view && view.dataset && view.answer && view.answer.data) openFeedback(reverseTarget(view, entry));
});

feedbackForm.addEventListener('click', (e) => {
  if (e.target.closest('[data-action="feedback-close"]')) feedbackDialog.close();
});

feedbackForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = feedbackForm.querySelector('.feedback-status');
  const send = feedbackForm.querySelector('button[type="submit"]');
  const report = feedbackReport(feedbackTarget, Object.fromEntries(new FormData(feedbackForm)), feedbackPage());
  if (!feedbackSays(report)) {
    status.innerHTML = '<span class="warn">Say what you expected, or add a comment.</span>';
    return;
  }
  send.disabled = true;
  status.textContent = 'Sending…';
  let failed = null;
  try {
    const resp = await fetch('/feedback?key=test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(report) });
    if (resp.status !== 201) failed = feedbackError(resp.status, await resp.text());
  } catch (err) {
    failed = `Not sent: ${err.message}`;
  }
  if (failed) {
    status.innerHTML = `<span class="warn">${esc(failed)}</span>`;
    send.disabled = false;
    return;
  }
  try {
    if (report.contact) localStorage.setItem(FEEDBACK_CONTACT_KEY, report.contact);
    else localStorage.removeItem(FEEDBACK_CONTACT_KEY);
  } catch (err) {}
  let count = null;
  try {
    count = await (await fetch('/feedback/count')).json();
  } catch (err) {}
  feedbackForm.innerHTML = `<p class="feedback-note">${esc(feedbackThanks(count))}</p>`
    + '<div class="feedback-actions"><button type="button" data-action="feedback-close">Close</button></div>';
});

// -- Credits --
const creditMore = document.getElementById('creditMore');

// The sources in full of the build served, or the page's while it has none.
function renderCredits() {
  document.getElementById('creditBody').innerHTML = creditsHtml(catalog);
}

// Opened, the sources take their place at the end of the panel: it scrolls
// to the whole foot.
creditMore.addEventListener('toggle', () => {
  if (creditMore.open) creditMore.closest('.data-credit').scrollIntoView({ block: 'nearest' });
});

// -- Start --
updateNominatimBtn();
updatePolygonsBtn();
renderCredits();
(async () => {
  await loadCatalog();
  if (mode !== 'single') pollHealth();
  await mapLoaded;
  mapReady = true;
  drawSearchDots(searchViews());
  loadResults();
  if (polygonsColumn !== 'off') ensurePolygonLayer();
  linkRestored = true;
  lookupLinkPoints();
  updateLink();
})();
</script>
</body>
