<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Geocoder Test Portal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #222240;
    --surface2: #2a2a4a;
    --border: #3a3a5c;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #6c8cff;
    --green: #4caf80;
    --blue: #4a90d9;
    --red: #d94a4a;
    --orange: #d9944a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .layout {
    display: flex;
    height: 100vh;
  }

  .map-panel {
    flex: 0 0 60%;
    position: relative;
  }

  /* A window too short for its sections' least heights scrolls the panel. */
  .side-panel {
    flex: 0 0 40%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    overflow-x: hidden;
    overflow-y: auto;
  }

  #map { height: 100%; width: 100%; }

  /* MapLibre dark overrides */
  .maplibregl-ctrl-attrib {
    background: rgba(26, 26, 46, 0.8) !important;
    color: var(--text-dim) !important;
  }
  .maplibregl-ctrl-attrib a { color: var(--accent) !important; }

  section {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .coord-row {
    display: flex;
    gap: 8px;
  }

  .coord-row textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 8px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 13px;
    resize: vertical;
    min-height: 36px;
    height: 36px;
  }

  .coord-row textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(108, 140, 255, 0.05);
  }
  .drop-zone input { display: none; }

  .photo-list {
    margin-top: 8px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 12px;
  }
  .photo-item {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    color: var(--text-dim);
  }
  .photo-item .coords { font-family: monospace; color: var(--text); }
  .photo-item .no-gps { color: var(--red); }

  /* The results keep their toolbar and a few cards in sight: the datasets
     above and the detail below scroll within what is left, down to a least
     height of their own. */
  .results-section {
    flex: 1;
    min-height: max(200px, 30%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .results-section h3 {
    padding: 12px 16px 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  .results-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .result-card:hover { border-color: var(--accent); }
  .result-card.selected { border-color: var(--accent); background: var(--surface2); }
  .result-card.loading { opacity: 0.6; }
  .result-card.error { border-color: var(--red); }

  .result-coords {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-copy {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 11px;
    line-height: 16px;
    cursor: pointer;
    margin-left: auto;
  }
  .result-copy:hover {
    background: var(--surface2);
    color: var(--text);
  }
  .result-copy.copied {
    color: var(--green);
    border-color: var(--green);
  }

  .result-name { font-weight: 500; }

  .result-places {
    margin-top: 4px;
    font-size: 12px;
    color: var(--green);
  }

  .result-error {
    color: var(--red);
    font-size: 12px;
    margin-top: 2px;
  }

  .result-source {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .detail-panel {
    border-top: 1px solid var(--border);
    max-height: 40%;
    min-height: 100px;
    overflow-y: auto;
    padding: 12px 16px;
    display: none;
  }
  .detail-panel.visible { display: block; }

  .detail-panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .detail-address {
    margin-bottom: 10px;
  }
  .detail-address .field {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 2px 0;
  }
  .detail-address .label {
    color: var(--text-dim);
    min-width: 90px;
  }

  .detail-places {
    margin-bottom: 10px;
  }
  .detail-places table {
    width: 100%;
    font-size: 12px;
    border-collapse: collapse;
  }
  /* The columns' tables share the detail's width: a long word breaks
     within its own column rather than running into the next. */
  .detail-places th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    padding: 3px 8px 3px 0;
    border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  .detail-places td {
    padding: 3px 8px 3px 0;
    overflow-wrap: anywhere;
  }

  .json-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .json-key { color: #8cb4ff; }
  .json-string { color: #a8d8a8; }
  .json-number { color: #d9a44a; }
  .json-bool { color: #d98a8a; }
  .json-null { color: var(--text-dim); }

  .loading-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Dataset columns */
  .datasets-section { max-height: 42vh; min-height: 100px; overflow-y: auto; }
  .columns { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .columns-note { font-size: 12px; color: var(--text-dim); }
  .picker {
    flex: 1 1 200px;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .picker select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 4px;
    font-size: 12px;
    min-width: 0;
  }
  .picker-row { display: flex; gap: 4px; align-items: center; }
  .picker-row select { flex: 1; }
  .picker-remove, .add-column, .tool {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 8px;
    font-size: 12px;
  }
  .add-column { border-style: dashed; align-self: center; }
  .tool { padding: 4px 12px; }
  .picker-axes { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
  .picker-axes label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .picker-axes label span { color: var(--text-dim); white-space: nowrap; }
  .picker-axes select { flex: 1; max-width: 62%; }
  .picker-axes option:disabled { color: var(--text-dim); }
  .picker-name { font-weight: 500; margin-top: 5px; }
  .picker-meta, .picker-desc, .picker-constraint { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .picker-constraint { font-style: italic; }
  .picker-note { color: var(--orange); font-size: 11px; margin-top: 3px; }
  .picker-error { color: var(--red); font-size: 11px; margin-top: 3px; }
  .warn { color: var(--red); }
  .status-line { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .banner {
    font-size: 12px;
    color: var(--orange);
    border: 1px solid var(--orange);
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .banner:empty { display: none; }
  .banner button { margin-left: auto; background: transparent; color: var(--orange); padding: 0 4px; }
  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 0 5px;
    border-radius: 3px;
    border: 1px solid var(--orange);
    color: var(--orange);
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Answers side by side */
  .answer-head { border-top: 2px solid var(--accent); padding-top: 4px; min-width: 0; }
  .answer-label { font-size: 11px; text-transform: uppercase; margin-bottom: 2px; }
  .answer-meta { font-size: 11px; color: var(--text-dim); overflow-wrap: anywhere; }
  .answer-name { font-size: 13px; color: var(--text-dim); margin-top: 4px; overflow-wrap: anywhere; }
  .fields { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fields tr { border-bottom: 1px solid var(--border); }
  .fields th { text-align: left; padding: 4px 8px; }
  .fields td { padding: 4px 8px; overflow-wrap: anywhere; }
  .fields td.field { color: var(--text-dim); width: 140px; }
  .fields tr.differs, .fields tr.missing { background: rgba(217, 74, 74, 0.06); }
  .fields tr.differs td.value { color: var(--red); }
  .fields td.empty { color: var(--orange); }
  .detail-places tr.unshared td { color: var(--orange); }

  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .map-panel { flex: 0 0 45vh; }
    .side-panel { flex: 1; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="map-panel">
    <div id="map"></div>
  </div>
  <div class="side-panel">
    <section class="datasets-section">
      <h3>Datasets</h3>
      <div class="banner" id="banner"></div>
      <div class="columns" id="columns"></div>
      <div class="status-line" id="status"></div>
    </section>

    <section>
      <h3>Coordinates</h3>
      <div class="coord-row">
        <textarea id="coordInput" placeholder="lat, lng (one per line for batch)" rows="1"></textarea>
        <button id="lookupBtn" onclick="lookupCoords()">Lookup</button>
      </div>
    </section>

    <section>
      <h3>Photo Upload</h3>
      <div class="drop-zone" id="dropZone">
        <div>Drop images here or click to browse</div>
        <div style="font-size:11px; margin-top:4px; color:var(--text-dim)">JPG, HEIC, PNG, TIFF</div>
        <input type="file" id="fileInput" accept="image/jpeg,image/heic,image/png,image/tiff,.heic,.heif" multiple />
      </div>
      <div class="photo-list" id="photoList"></div>
    </section>

    <div class="results-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;flex-wrap:wrap;">
        <h3 style="margin:0;flex:1">Results <span id="resultCount"></span></h3>
        <button id="nominatimBtn" class="tool" onclick="toggleNominatim()" title="Query Nominatim's public API for side-by-side comparison. Off by default — each query hits nominatim.openstreetmap.org so leave off unless you need the comparison.">Nominatim: Off</button>
        <button id="polygonsBtn" class="tool" onclick="togglePolygons()" title="Cycle the polygon overlay: Off, then the admin polygons of each column's dataset in turn. Use to compare which admin levels a smaller dataset drops.">Polygons: Off</button>
        <button id="linkBtn" class="tool" onclick="copyLink(this)" title="Copy a link to these columns, the selected point and the build that answered">Copy link</button>
        <button id="retestBtn" onclick="retestAllResults()" style="padding:4px 12px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;">Re-test</button>
        <button onclick="clearResults()" style="padding:4px 12px;font-size:12px;background:var(--red);color:#fff;border:none;border-radius:4px;cursor:pointer;">Clear</button>
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <h3>Detail</h3>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script id="core">
// The page's logic that reads no DOM: the link, the columns and the datasets
// they name (the server's /datasets), the pacing of requests, the comparison
// of answers and the HTML of each part. page.test.mjs runs it in node.

// At most this many dataset columns.
const MAX_COLUMNS = 4;
// The columns a link without d= opens with: the dataset with street
// addresses beside the smallest.
const OPENING_PRESETS = ['with-addresses', 'smallest'];
// The requests to the server in flight at once, over every column and
// result: every visitor of the page shares the test key's rate.
const IN_FLIGHT = 8;
// Each column's colour, by its place, and Nominatim's.
const COLUMN_COLORS = ['#6c8cff', '#d9944a', '#c77dff', '#4ac9d9'];
const NOMINATIM_COLOR = '#4caf80';
// The order of the common address hierarchy in the field table. Other
// fields (landmark classes etc.) follow by name, so that any field the
// answers gain shows without a change here.
const PREFERRED_ORDER = [
  'landmark',
  'house_number', 'road', 'city_block', 'neighbourhood', 'quarter',
  'suburb', 'borough', 'city_district', 'city', 'town', 'village',
  'hamlet', 'municipality', 'district', 'county', 'state_district',
  'region', 'province', 'state', 'postcode', 'country', 'country_code',
];

// `s` as HTML text, in an element or a quoted attribute.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function formatSize(bytes) {
  return `${(Number(bytes) / 2 ** 30).toFixed(2)} GiB`;
}

// A time of the server (ISO 8601, UTC) as the page shows it.
function shortTime(iso) {
  return iso ? String(iso).replace('T', ' ').replace(/Z$/, ' UTC') : '—';
}

function onGlobe(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

// -- Builds --
// A build as the page names it: the portal's dir of it, <date>-<n> (the
// build of a date as it was published: a rerun of the nightly that
// publishes the date again makes another), or a date alone (a link's b=,
// or an answer saved, before builds were named by their dir), which stands
// for any build of its date.
function buildParts(build) {
  const m = /^(\d{4}-\d{2}-\d{2})(?:-(\d+))?$/.exec(String(build));
  return m ? { date: m[1], n: m[2] === undefined ? null : Number(m[2]) } : { date: String(build), n: null };
}

// Whether `a` and `b` name one build.
function sameBuild(a, b) {
  const [x, y] = [buildParts(a), buildParts(b)];
  return x.date === y.date && (x.n === null || y.n === null || x.n === y.n);
}

// The order of builds: by date, then dir (a date alone first).
function buildOrder(a, b) {
  const [x, y] = [buildParts(a), buildParts(b)];
  if (x.date !== y.date) return x.date < y.date ? -1 : 1;
  return (x.n ?? -1) - (y.n ?? -1);
}

// -- The link --
// ?d=<dataset> for each column (a preset's id, or <mode>.<quality>.<poi_tier>),
// at=<lat>,<lon> for each point to look up, and b=<build>, the build the
// answers came from (its dir; a date alone still opens).
function parseLink(search) {
  const q = new URLSearchParams(search);
  const points = [];
  for (const at of q.getAll('at')) {
    const parts = at.split(',');
    if (parts.length !== 2 || parts.some((p) => p.trim() === '')) continue;
    const [lat, lng] = parts.map(Number);
    if (onGlobe(lat, lng)) points.push({ lat, lng });
  }
  return { datasets: q.getAll('d').filter((d) => d).slice(0, MAX_COLUMNS), points, build: q.get('b') || null };
}

// The build a link to a result names (b=): the oldest that answered it in
// the columns `keys` (`answers`, by key) other than the build `served`
// (answers saved, or asked before the build changed: older, or newer where
// the portal went back to an older build), so that a link to answers the
// server no longer gives is flagged; else the oldest that answered it;
// else `served`.
function linkBuild(answers, keys, served) {
  const builds = keys.map((key) => answers[key] && answers[key].build).filter(Boolean).sort(buildOrder);
  return builds.find((build) => !served || !sameBuild(build, served)) || builds[0] || served;
}

function linkSearch({ datasets = [], point = null, build = null }) {
  const parts = datasets.map((d) => `d=${encodeURIComponent(d).replace(/%2F/g, '/')}`);
  if (point) parts.push(`at=${point.lat},${point.lng}`);
  if (build) parts.push(`b=${encodeURIComponent(build)}`);
  return parts.length ? `?${parts.join('&')}` : '';
}

// How the page answers, by /datasets' status and JSON: in columns of the
// datasets it lists ('catalog'); in one column, a server of one dataset
// having no /datasets ('single'); or not yet, while the portal has no build
// to serve or can't be reached ('waiting', asked again).
function catalogMode(status, json) {
  if (status === 200) return json && Array.isArray(json.datasets) && Array.isArray(json.axes) ? 'catalog' : 'single';
  return status === 404 || status === 405 ? 'single' : 'waiting';
}

// Whether /health's `health` names a build served other than the one the
// page's datasets (`catalog`, in `mode`) are of, a build published again
// under its date among them, or one at all while the page waits for one:
// the page then asks /datasets anew.
function catalogStale(health, mode, catalog) {
  const dir = health && health.build ? health.build.dir : null;
  if (!dir) return false;
  return mode === 'waiting' || (mode === 'catalog' && dir !== catalog.build.dir);
}

// -- Columns --
function openingTokens(catalog) {
  const tokens = OPENING_PRESETS.filter((id) => catalog.presets.some((p) => p.id === id));
  return tokens.length ? tokens : [catalog.default];
}

// The token of a column added beside `columns`: the first preset whose
// dataset none of them shows, else the first such dataset.
function addedToken(catalog, columns) {
  const shown = new Set(columns.map((c) => c.dataset && c.dataset.id));
  const preset = catalog.presets.find((p) => !shown.has(p.dataset));
  if (preset) return preset.id;
  const dataset = catalog.datasets.find((d) => !shown.has(d.id));
  return dataset ? dataset.id : catalog.default;
}

function sameSelection(catalog, a, b) {
  return catalog.axes.every((axis) => a[axis.id] === b[axis.id]);
}

function datasetOf(catalog, selection) {
  return catalog.datasets.find((d) => sameSelection(catalog, d.selection, selection)) || null;
}

function excludedOf(catalog, selection) {
  return catalog.excluded.find((x) => sameSelection(catalog, x.selection, selection)) || null;
}

function defaultDataset(catalog) {
  return catalog.datasets.find((d) => d.id === catalog.default) || catalog.datasets[0];
}

// The column `token` picks: its dataset, whether it is a custom pick (no
// preset's id), the selection its axes show, and why it has no dataset.
function resolveColumn(catalog, token) {
  const preset = catalog.presets.find((p) => p.id === token);
  const dataset = catalog.datasets.find((d) => d.id === (preset ? preset.dataset : token)) || null;
  const excluded = catalog.excluded.find((x) => x.id === token) || null;
  let error = null;
  if (!dataset) {
    error = excluded ? `dataset ${token} is not offered: ${excluded.message}` : `unknown dataset "${token}": pick one`;
  }
  const selection = { ...(dataset || excluded || defaultDataset(catalog)).selection };
  return { token, dataset, custom: !preset, selection, error, note: null };
}

// The values of the axis `axisId` as a custom pick of `selection`'s other
// values offers them: 'offered'; 'moves' where a constraint requires other
// values of the others, which the pick then takes; or 'excluded' where the
// constraints rule the value out whatever the others. Each with the
// selection it makes and the constraint's message.
function axisChoices(catalog, selection, axisId) {
  const axis = catalog.axes.find((a) => a.id === axisId);
  return axis.values.map((value) => {
    const picked = { ...selection, [axisId]: value.id };
    if (datasetOf(catalog, picked)) return { ...value, state: 'offered', selection: picked, message: null };
    const excluded = excludedOf(catalog, picked);
    const moved = excluded ? { ...picked, ...excluded.requires } : null;
    if (moved && moved[axisId] === value.id && datasetOf(catalog, moved)) {
      return { ...value, state: 'moves', selection: moved, message: excluded.message };
    }
    return { ...value, state: 'excluded', selection: null, message: excluded ? excluded.message : 'not in this build' };
  });
}

function valueLabel(axis, id) {
  const value = axis.values.find((v) => v.id === id);
  return value ? value.label : id;
}

// What a custom pick of `selection` becomes when its axis `axisId` takes
// `valueId`: the selection, its dataset, and a note of the axes that move
// for a constraint, with its message. None for a value the constraints
// rule out.
function pick(catalog, selection, axisId, valueId) {
  const choice = axisChoices(catalog, selection, axisId).find((c) => c.id === valueId);
  if (!choice || choice.state === 'excluded') return null;
  let note = null;
  if (choice.state === 'moves') {
    const moved = catalog.axes
      .filter((a) => a.id !== axisId && choice.selection[a.id] !== selection[a.id])
      .map((a) => `${a.label} moves to ${valueLabel(a, choice.selection[a.id])}`);
    note = `${moved.join(', ')}: ${choice.message}`;
  }
  return { selection: choice.selection, dataset: datasetOf(catalog, choice.selection), note };
}

// A selection by the labels of its values, on the axes that offer a choice.
function selectionLabel(catalog, selection) {
  return catalog.axes.filter((a) => a.values.length > 1).map((a) => valueLabel(a, selection[a.id])).join(' · ');
}

// -- Answers --
// An answer as the page keeps it, from a response of the server: its JSON
// (data) or why there is none (error), the build and the dataset that
// answered (X-Geocoder-Build-Dir, the portal's dir of the build, and
// X-Geocoder-Dataset), and the ms it took.
function answerOf(status, header, body, ms) {
  const build = header('x-geocoder-build-dir');
  const dataset = header('x-geocoder-dataset');
  if (status !== 200) return { error: `HTTP ${status}${body ? `: ${body.slice(0, 300)}` : ''}`, build, dataset, ms };
  try {
    return { data: JSON.parse(body), build, dataset, ms };
  } catch (e) {
    return { error: `not JSON: ${body.slice(0, 300)}`, build, dataset, ms };
  }
}

// The field table's rows: each address field of any of `addresses` (null
// for a column without an answer, which lacks no field), in PREFERRED_ORDER
// then by name, with each one's value ('' for none), whether two values
// disagree, and whether an answer lacks the field.
function fieldRows(addresses) {
  const fields = [...new Set(addresses.flatMap((a) => Object.keys(a || {})))];
  const rank = (f) => (PREFERRED_ORDER.includes(f) ? PREFERRED_ORDER.indexOf(f) : PREFERRED_ORDER.length);
  fields.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  return fields
    .map((field) => {
      const values = addresses.map((a) => (a && a[field] != null && a[field] !== '' ? String(a[field]) : ''));
      const present = values.filter((v) => v);
      const lacking = values.filter((v, i) => !v && addresses[i]);
      return { field, values, differs: present.some((v) => v !== present[0]), missing: present.length > 0 && lacking.length > 0 };
    })
    .filter((row) => row.values.some((v) => v));
}

function placeKey(p) {
  return `${p.name}\u0000${p.category}`;
}

// Whether the answers `datas` (null for a column without one) disagree on
// what the page shows: the display name, an address field or the places,
// each with its distance.
function answersDiffer(datas) {
  const answered = datas.filter((d) => d);
  if (answered.length < 2) return false;
  const name = (d) => d.display_name || '';
  const places = (d) => (d.places || []).map((p) => `${placeKey(p)}\u0000${p.distance_m}`).join('\u0001');
  return answered.some((d) => name(d) !== name(answered[0]) || places(d) !== places(answered[0]))
    || fieldRows(answered.map((d) => d.address || {})).some((row) => row.differs || row.missing);
}

// -- Requests --
// Asks the server, `limit` requests in flight at most over the whole page.
// Each request counts against a rate-limit scope: 'reverse' (the default),
// /reverse's (the test key's rate, which every visitor shares), or
// 'polygons', /polygons' (none). A 429 is asked again after a pause of its
// scope, which begins before the 429's place goes to the next in line and
// which the scope's requests wait out without a place, so that those of
// another scope go meanwhile: `firstPause` ms, doubled by each 429 of a
// request started after the scope's last pause began (those in flight
// together make one) up to `maxPause`, and back to none after a success
// (2xx) of a request of the scope started after it began. After `tries`
// asks a 429 is the answer. request(url, scope, signal) gives the status,
// the headers (header(name)), the body and the ms the request took, its
// wait in line not counted. A request whose `signal` (an AbortController's)
// aborts stops where it is, its promise rejected with the abort's reason:
// one waiting in line or out a pause gives up its turn and is never sent
// or asked again, and one in flight frees its place at once, its fetch,
// given the signal, ending its download.
class Pacer {
  constructor({ limit = IN_FLIGHT, fetch, sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)), now = () => Date.now(),
                tries = 8, firstPause = 500, maxPause = 8000 }) {
    Object.assign(this, { limit, send: fetch, sleep, now, tries, firstPause, maxPause });
    this.active = 0;
    this.waiting = [];
    this.scopes = new Map();
  }

  // The pause of the scope `name`: its length, when it began and when it
  // ends.
  scope(name) {
    if (!this.scopes.has(name)) this.scopes.set(name, { pause: 0, pausedAt: -Infinity, pausedUntil: -Infinity });
    return this.scopes.get(name);
  }

  async request(url, scope = 'reverse', signal = null) {
    const s = this.scope(scope);
    for (let tries = 1; ; tries++) {
      await this.turn(s, signal);
      let got;
      try {
        const started = this.now();
        const response = await abortable(this.send(url, signal), signal);
        const body = await abortable(response.text(), signal);
        got = { status: response.status, header: (name) => response.headers.get(name), body, ms: this.now() - started };
        if (got.status === 429 && started > s.pausedAt) {
          s.pause = Math.min(this.maxPause, s.pause ? s.pause * 2 : this.firstPause);
          s.pausedAt = this.now();
          s.pausedUntil = s.pausedAt + s.pause;
        } else if (got.status >= 200 && got.status < 300 && started > s.pausedAt) {
          s.pause = 0;
        }
      } finally {
        this.release();
      }
      if (got.status !== 429 || tries >= this.tries) return got;
    }
  }

  // A place in line once the pause of the scope `s` is over. A pause that
  // began while it waited in line it waits out without one, its place
  // going to the next in line. None once `signal` aborts.
  async turn(s, signal) {
    for (;;) {
      for (let wait; (wait = s.pausedUntil - this.now()) > 0;) await abortable(this.sleep(wait), signal);
      await this.acquire(signal);
      if (signal && signal.aborted) {
        this.release();
        throw signal.reason;
      }
      if (s.pausedUntil <= this.now()) return;
      this.release();
    }
  }

  // A place, once one is free; a request whose `signal` aborts while it
  // waits for one leaves the line.
  acquire(signal) {
    if (signal && signal.aborted) return Promise.reject(signal.reason);
    if (this.active < this.limit) {
      this.active++;
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const leave = () => {
        this.waiting.splice(this.waiting.indexOf(go), 1);
        reject(signal.reason);
      };
      const go = () => {
        if (signal) signal.removeEventListener('abort', leave);
        resolve();
      };
      this.waiting.push(go);
      if (signal) signal.addEventListener('abort', leave, { once: true });
    });
  }

  // Hands the place of a request that is done to the next in line.
  release() {
    const next = this.waiting.shift();
    if (next) next();
    else this.active--;
  }
}

// `promise`, or the abort of `signal` (none: never), whichever comes first.
function abortable(promise, signal) {
  if (!signal) return promise;
  if (signal.aborted) return Promise.reject(signal.reason);
  return new Promise((resolve, reject) => {
    const abort = () => reject(signal.reason);
    signal.addEventListener('abort', abort, { once: true });
    promise.then((value) => {
      signal.removeEventListener('abort', abort);
      resolve(value);
    }, (e) => {
      signal.removeEventListener('abort', abort);
      reject(e);
    });
  });
}

// -- HTML --
// The picker of the column `col`, the `index`th of `count`: a preset or a
// custom pick by axis (a value the constraints rule out greyed, with their
// message), then its dataset's name, values, sizes and description.
function pickerHtml(catalog, col, index, count) {
  const color = COLUMN_COLORS[index % COLUMN_COLORS.length];
  let html = `<div class="picker" style="border-left-color:${color}">`;
  html += `<div class="picker-row"><select data-col="${index}" data-role="preset" title="A preset of the build, or a custom pick by axis">`;
  for (const p of catalog.presets) {
    const d = catalog.datasets.find((x) => x.id === p.dataset);
    const size = d ? ` · ${formatSize(d.size_disk)}` : '';
    html += `<option value="${esc(p.id)}"${!col.custom && col.token === p.id ? ' selected' : ''} title="${esc(p.description)}">${esc(p.label)}${size}</option>`;
  }
  html += `<option value=""${col.custom ? ' selected' : ''}>Custom…</option></select>`;
  if (count > 1) html += `<button class="picker-remove" data-col="${index}" data-action="remove" title="Remove this column">×</button>`;
  html += '</div>';
  if (col.custom) {
    const constraints = [];
    html += '<div class="picker-axes">';
    for (const axis of catalog.axes) {
      if (axis.values.length < 2) continue;
      html += `<label title="${esc(axis.description)}"><span>${esc(axis.label)}</span><select data-col="${index}" data-axis="${esc(axis.id)}">`;
      for (const c of axisChoices(catalog, col.selection, axis.id)) {
        const mark = c.state === 'excluded' ? ' (not offered)' : c.state === 'moves' ? ' *' : '';
        html += `<option value="${esc(c.id)}"${c.id === col.selection[axis.id] ? ' selected' : ''}${c.state === 'excluded' ? ' disabled' : ''}`
          + ` title="${esc(c.message || c.description)}">${esc(c.label)}${mark}</option>`;
        if (c.message) constraints.push(`${c.label}: ${c.message}`);
      }
      html += '</select></label>';
    }
    html += '</div>';
    for (const line of constraints) html += `<div class="picker-constraint">${esc(line)}</div>`;
  }
  const d = col.dataset;
  if (d) {
    html += `<div class="picker-name">${esc(d.label)}</div>`;
    html += `<div class="picker-meta">${esc(selectionLabel(catalog, d.selection))} · ${esc(d.id)}</div>`;
    html += `<div class="picker-meta">${formatSize(d.size_disk)} on disk · ${formatSize(d.size_download)} download</div>`;
    if (d.description) html += `<div class="picker-desc">${esc(d.description)}</div>`;
  }
  if (col.note) html += `<div class="picker-note">${esc(col.note)}</div>`;
  if (col.error) html += `<div class="picker-error">${esc(col.error)}</div>`;
  return `${html}</div>`;
}

// The key of the control of the pickers whose element's data-* attributes
// are `data` (its dataset): its column, and its role, axis or action, which
// name it again once the pickers are drawn anew; none for an element of
// none.
function controlKey(data) {
  if (data.col === undefined && data.action === undefined) return null;
  return [data.col, data.role, data.axis, data.action].map((v) => v ?? '').join('\u0000');
}

// The detail of a result, from `views`: one a column ({label, color,
// dataset, answer}), and Nominatim's. Per answer its name, dataset, build
// and time, flagged where a build other than the one `served` answered
// (sameBuild: one published before it under its date among them), and the
// sizes of its dataset in the build served, where that answered; the
// address fields side by side, those the answers disagree on or lack
// marked; the places, those not in every answer marked; the JSON, each
// panel named by the place of its view (data-view).
function detailHtml(views, served) {
  const grid = `display:grid;grid-template-columns:repeat(${views.length},minmax(0,1fr));gap:12px`;
  let html = `<div style="${grid};margin-bottom:12px">`;
  for (const v of views) {
    const a = v.answer || {};
    html += `<div class="answer-head" style="border-top-color:${v.color}"><div class="answer-label" style="color:${v.color}">${esc(v.label)}</div>`;
    const meta = [];
    if (v.dataset) meta.push(esc(v.dataset.id));
    if (a.build) meta.push(`build ${esc(a.build)}`);
    if (Number.isFinite(a.ms)) meta.push(`${Math.round(a.ms)} ms`);
    if (meta.length) html += `<div class="answer-meta">${meta.join(' · ')}</div>`;
    const stale = a.build && served && !sameBuild(a.build, served);
    if (v.dataset && !stale) html += `<div class="answer-meta">${formatSize(v.dataset.size_disk)} on disk · ${formatSize(v.dataset.size_download)} download</div>`;
    if (stale) {
      html += `<span class="tag stale" title="The server serves build ${esc(served)} now: Re-test asks it again">build ${esc(a.build)}, not ${esc(served)}</span>`;
    }
    if (a.loading) html += '<div class="answer-name"><span class="loading-spinner"></span>Loading…</div>';
    else if (a.error) html += `<div class="result-error">${esc(a.error)}</div>`;
    else if (a.data) html += `<div class="answer-name">${a.data.display_name ? esc(a.data.display_name) : '—'}</div>`;
    else html += '<div class="answer-meta">not asked yet</div>';
    html += '</div>';
  }
  html += '</div>';

  const datas = views.map((v) => (v.answer && v.answer.data) || null);
  const rows = fieldRows(datas.map((d) => (d ? d.address || {} : null)));
  if (rows.length) {
    html += '<table class="fields"><tr><th style="color:var(--text-dim);width:140px">Field</th>';
    for (const v of views) html += `<th style="color:${v.color}">${esc(v.label)}</th>`;
    html += '</tr>';
    for (const row of rows) {
      html += `<tr class="${row.differs ? 'differs' : row.missing ? 'missing' : ''}"><td class="field">${esc(row.field)}</td>`;
      row.values.forEach((value, i) => {
        html += value ? `<td class="value">${esc(value)}</td>` : `<td class="empty">${datas[i] ? '—' : ''}</td>`;
      });
      html += '</tr>';
    }
    html += '</table>';
  }

  if (datas.some((d) => d && d.places && d.places.length)) {
    const keys = datas.map((d) => (d ? new Set((d.places || []).map(placeKey)) : null));
    html += `<div class="detail-places"><h3 style="margin:10px 0 6px">Places</h3><div style="${grid}">`;
    views.forEach((v, i) => {
      const places = (datas[i] && datas[i].places) || [];
      html += `<div><div class="answer-label" style="color:${v.color}">${esc(v.label)}</div>`;
      if (!datas[i]) {
        html += '<div class="answer-meta">—</div>';
      } else if (!places.length) {
        html += '<div class="answer-meta">— no places —</div>';
      } else {
        html += '<table><tr><th>Name</th><th>Category</th><th>Dist</th></tr>';
        for (const p of places) {
          const shared = keys.every((k) => !k || k.has(placeKey(p)));
          html += `<tr${shared ? '' : ' class="unshared"'}><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.distance_m)}m</td></tr>`;
        }
        html += '</table>';
      }
      html += '</div>';
    });
    html += '</div></div>';
  }

  views.forEach((v, i) => {
    if (!v.answer || !v.answer.data) return;
    html += `<details data-view="${i}" style="margin-top:6px"><summary style="cursor:pointer;color:${v.color}">${esc(v.label)}: response JSON</summary>`
      + `<div class="json-block">${syntaxHighlight(v.answer.data)}</div></details>`;
  });
  return html;
}

// A result's card: its point, the first column's answer and whether the
// columns' answers differ, the columns' errors, and where the point came
// from.
function cardHtml(entry, views, selected) {
  const answers = views.map((v) => v.answer || {});
  const first = answers[0] || {};
  const loading = answers.some((a) => a.loading);
  const failed = views.filter((v) => v.answer && v.answer.error);
  const classes = ['result-card'];
  if (loading) classes.push('loading');
  if (failed.length) classes.push('error');
  if (selected) classes.push('selected');
  // The coordinates with a copy button, whose `data-copy` the list's click
  // handler copies.
  const coords = `${Number(entry.lat).toFixed(5)}, ${Number(entry.lng).toFixed(5)}`;
  let html = `<div class="${classes.join(' ')}" data-id="${esc(entry.id)}">`;
  html += `<div class="result-coords">${coords}<button class="result-copy" data-copy="${coords}" title="Copy coordinates">⧉</button></div>`;
  if (first.data) {
    html += `<div class="result-name">${esc(first.data.display_name || 'Unknown location')}`;
    if (answersDiffer(answers.map((a) => a.data || null))) html += '<span class="tag" title="The columns answer differently">differs</span>';
    html += '</div>';
    const places = first.data.places || [];
    if (places.length) {
      const extra = places.length > 3 ? ` +${places.length - 3} more` : '';
      html += `<div class="result-places">${esc(places.slice(0, 3).map((p) => p.name).join(', '))}${extra}</div>`;
    }
  } else if (loading) {
    html += '<div class="result-name"><span class="loading-spinner"></span>Loading...</div>';
  } else if (!first.error) {
    html += '<div class="result-source">not asked yet: select it or Re-test</div>';
  }
  for (const v of failed) html += `<div class="result-error">${esc(v.label)}: ${esc(v.answer.error)}</div>`;
  if (entry.source) html += `<div class="result-source">${esc(entry.source)}</div>`;
  return `${html}</div>`;
}

// Nominatim's view of a result (detailHtml): its answer, its request in
// flight, or why it has none.
function nominatimView(entry) {
  const answer = entry.nominatimLoading ? { loading: true }
    : entry.nominatim ? { data: entry.nominatim }
    : entry.nominatimError ? { error: entry.nominatimError }
    : null;
  return { label: 'Nominatim', color: NOMINATIM_COLOR, dataset: null, answer };
}

// A result as the page saves it: its point, where it came from, Nominatim's
// answer and every answer of the columns, those of a column no longer shown
// too (each keeps the build that gave it), but none being asked.
function savedResult(r) {
  return {
    id: r.id, lat: r.lat, lng: r.lng, source: r.source, nominatim: r.nominatim || null,
    answers: Object.fromEntries(Object.entries(r.answers).filter(([, a]) => a && !a.loading)),
  };
}

// A result as savedResult saved it, as the page keeps it; none for a point
// off the globe. The page before the dataset columns saved the answer of its
// server as `data` and that of the minimal one as `minimal`, of datasets it
// did not record: those go, and the columns are asked again.
function storedResult(r) {
  if (!r || !onGlobe(r.lat, r.lng)) return null;
  const answers = r.answers && typeof r.answers === 'object' ? r.answers : {};
  return { id: r.id, lat: r.lat, lng: r.lng, source: r.source || null, answers, nominatim: r.nominatim || null };
}

// The status line from the portal's /health: the build served (by its
// dir, or why none), how the sync goes, and the builds it refused.
function statusHtml(health) {
  if (!health || typeof health !== 'object' || !health.sync) return '';
  const s = health.sync;
  const parts = [];
  if (health.build) parts.push(`build ${esc(health.build.dir)} (v${esc(health.build.version)}) · ${esc(health.datasets)} datasets`);
  else if (health.reason) parts.push(`<span class="warn">${esc(health.reason)}</span>`);
  if (s.running) {
    let running = `sync: ${esc(s.running)}`;
    if (s.progress) {
      const p = s.progress;
      running += ` (${esc(p.objects_done)}/${esc(p.objects_total)} objects, ${formatSize(p.bytes_done)} of ${formatSize(p.bytes_total)})`;
    }
    parts.push(running);
  } else {
    if (s.last_result) parts.push(`last sync ${esc(shortTime(s.last_finished))}: ${esc(s.last_result)}`);
    if (s.next_round) parts.push(`next ${esc(shortTime(s.next_round))}`);
  }
  if (s.latest && (!health.build || s.latest.date !== health.build.date)) parts.push(`latest ${esc(s.latest.date)}`);
  for (const r of s.refused || []) parts.push(`<span class="warn">refused ${esc(r.date)} (v${esc(r.version)}): ${esc(r.reason)}</span>`);
  return parts.join(' · ');
}

// The flag of a link made on a build (b=) other than the one served
// (sameBuild).
function mismatchHtml(linkBuild, served) {
  if (!linkBuild || !served || sameBuild(linkBuild, served)) return '';
  return `This link was made on build ${esc(linkBuild)}; the server serves build ${esc(served)} now, whose answers may differ.`;
}

// The key a column's answers are kept by: its dataset's id ('' for the one
// dataset of a server without /datasets, or of the portal while it waits
// for a build); none for a column without one.
function columnKey(col) {
  if (col.single) return '';
  return col.dataset ? col.dataset.id : null;
}

// The polygon overlay's next state: off, then each of `count` columns in
// turn, then off.
function nextPolygons(current, count) {
  const next = current === 'off' ? 0 : current + 1;
  return next < count ? next : 'off';
}

// What the polygon overlay on the column `column` ('off', or a place in
// `columns`) shows of a result: the dataset of that column (its key) in the
// build `build`; none while it is off or its column has no dataset.
function overlayTarget(column, columns, build) {
  const col = column === 'off' ? null : columns[column];
  const key = col ? columnKey(col) : null;
  return key === null ? null : { key, build };
}

// Whether the overlay shows another thing (overlayTarget) as `after` than
// as `before`: another dataset, another build, or none where it showed one
// or the other way round. What it drew of `before` is then of neither.
function overlayMoved(before, after) {
  if (!before || !after) return before !== after;
  return before.key !== after.key || before.build !== after.build;
}

// The polygon overlay's requests (the page's other script draws them):
// show(id, key, url) asks `url` for the polygons around the point of the
// result `id` in the dataset of column key `key`, and draws them only if,
// when they come, no other show and no clear came after it and the overlay
// still shows that result in that dataset (shown(): { id, key }, or null
// while it shows none). A show or a clear cancels the request of the show
// before it. request(url, signal) asks the server (the pacer), the request
// cancelled once `signal` aborts; draw(fc) and erase() the map.
class PolygonOverlay {
  constructor({ request, draw, erase, shown }) {
    Object.assign(this, { request, draw, erase, shown });
    this.asked = 0;
    this.cancelling = null;
  }

  // Whether the polygons came and were drawn.
  async show(id, key, url) {
    const asked = ++this.asked;
    this.cancel();
    const cancelling = new AbortController();
    this.cancelling = cancelling;
    let got;
    try {
      got = await this.request(url, cancelling.signal);
    } catch (e) {
      if (cancelling.signal.aborted) return false;
      throw e;
    } finally {
      if (this.cancelling === cancelling) this.cancelling = null;
    }
    const now = this.shown();
    if (asked !== this.asked || !now || now.id !== id || now.key !== key) return false;
    if (got.status !== 200) throw new Error(`HTTP ${got.status}: ${got.body}`);
    this.draw(JSON.parse(got.body));
    return true;
  }

  // Erases what is drawn; the request in flight is cancelled, and no answer
  // still to come is drawn.
  clear() {
    this.asked++;
    this.cancel();
    this.erase();
  }

  // Cancels the request of the last show, if it is in flight.
  cancel() {
    if (this.cancelling) this.cancelling.abort();
    this.cancelling = null;
  }
}

// `obj` as JSON, escaped, its keys, strings, numbers and literals marked for
// their colours.
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return json.replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    function(match) {
      let cls = 'json-number';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-string';
      } else if (/true|false/.test(match)) {
        cls = 'json-bool';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return `<span class="${cls}">${match}</span>`;
    }
  );
}
</script>

<script>
// -- Map setup --
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.immich.cloud/v1/style/dark.json',
  center: [0, 40],
  zoom: 3,
  // MapLibre cancels the tiles still loading for the levels a zoom passes
  // through by default, so detail only appeared once the zoom settled.
  cancelPendingTileRequestsWhileZooming: false
});
const mapLoaded = new Promise((resolve) => map.on('load', resolve));

// Marker color map
const MARKER_COLORS = {
  gray: '#888888',
  green: '#4caf80',
  blue: '#4a90d9',
  red: '#d94a4a'
};

const markers = new Map(); // id -> {marker, color, label}
const results = [];        // {id, lat, lng, source, answers: {column key: answer}, nominatim}
let selectedId = null;

// -- Datasets and columns --
// How the page answers (catalogMode), the server's /datasets (catalog) and
// the columns, each a resolveColumn(). A server of one dataset, or a portal
// waiting for its build, has the one column SINGLE.
const SINGLE = { single: true, token: null, dataset: null, custom: false, selection: null, error: null, note: null };
const link = parseLink(location.search);
let mode = 'waiting';
let catalog = null;
let columns = [SINGLE];
// The columns' tokens as the link or the pickers last named them, kept while
// the portal waits for a build.
let wanted = link.datasets.slice();
let waitingFor = '';
let mismatchDismissed = false;

const pacer = new Pacer({ fetch: (url, signal) => fetch(url, { signal }), now: () => performance.now() });
// Nominatim's public API is asked one request at a time.
const nominatimPacer = new Pacer({ limit: 1, fetch: (url, signal) => fetch(url, { signal }), now: () => performance.now() });

// The build served, by its dir: a build published again under its date is
// another.
function servedBuild() {
  return catalog ? catalog.build.dir : null;
}

function columnLabel(col) {
  if (col.single) return 'This server';
  return col.dataset ? col.dataset.label : col.token;
}

// Each column's view of `entry`'s answers (detailHtml, cardHtml).
function columnViews(entry) {
  return columns.map((col, i) => {
    const key = columnKey(col);
    const answer = key === null ? { error: col.error } : entry.answers[key] || null;
    return { label: columnLabel(col), color: COLUMN_COLORS[i], dataset: col.dataset, answer };
  });
}

let catalogRetry = null;
// The loads of /datasets begun (the retry timer's and the health poll's
// may overlap): one that a later one began after changes nothing.
let catalogLoads = 0;

// Asks /datasets how the page answers, and lays out its columns: as they
// were named (the link's or the pickers'), else OPENING_PRESETS. While the
// portal waits for a build, it asks again every 30 s; once the build is in,
// the points looked up meanwhile are asked in the columns. Where that moves
// the polygon overlay (another dataset at its column, another build, or no
// column), what it drew goes, and the selected result's polygons are asked
// anew where its column still has a dataset.
async function loadCatalog() {
  const load = ++catalogLoads;
  clearTimeout(catalogRetry);
  let status = 0;
  let json = null;
  let body = '';
  try {
    const resp = await fetch('/datasets');
    status = resp.status;
    body = await resp.text();
    json = JSON.parse(body);
  } catch (e) {
    if (!status) body = e.message;
  }
  if (load !== catalogLoads) return;
  const shown = overlayTarget(polygonsColumn, columns, servedBuild());
  const waited = mode === 'waiting';
  mode = catalogMode(status, json);
  if (mode === 'catalog') {
    catalog = json;
    columns = (wanted.length ? wanted : openingTokens(catalog)).map((token) => resolveColumn(catalog, token));
    wanted = columns.map((c) => c.token);
  } else {
    catalog = null;
    columns = [SINGLE];
    waitingFor = body.slice(0, 300);
    if (mode === 'waiting') catalogRetry = setTimeout(loadCatalog, 30000);
  }
  if (polygonsColumn !== 'off' && polygonsColumn >= columns.length) polygonsColumn = 'off';
  renderColumns();
  renderBanner();
  updatePolygonsBtn();
  updateLink();
  results.forEach(placeMarker);
  renderResults();
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    showDetail(entry.id);
  }
  // A point looked up while the portal waited was asked of the server as it
  // was (the key '').
  if (waited && mode === 'catalog') results.filter((r) => '' in r.answers).forEach((r) => askColumns(r));
  if (overlayMoved(shown, overlayTarget(polygonsColumn, columns, servedBuild()))) {
    clearPolygonLayer();
    if (polygonsColumn !== 'off' && entry) updatePolygonLayer(entry.id);
  }
}

function renderColumns() {
  const el = document.getElementById('columns');
  if (mode !== 'catalog') {
    el.innerHTML = `<div class="columns-note">${mode === 'single'
      ? 'This server serves one dataset: it has no /datasets to choose from.'
      : 'One column, from the server as it is, until its build is in.'}</div>`;
    return;
  }
  let html = columns.map((col, i) => pickerHtml(catalog, col, i, columns.length)).join('');
  if (columns.length < MAX_COLUMNS) html += '<button class="add-column" data-action="add" title="Compare another dataset">+ Column</button>';
  // The control that had the focus (a select arrowed through from the
  // keyboard changes on each step) gets it back once drawn anew.
  const focused = el.contains(document.activeElement) ? controlKey(document.activeElement.dataset) : null;
  el.innerHTML = html;
  const again = focused === null ? null : [...el.querySelectorAll('select, button')].find((c) => controlKey(c.dataset) === focused);
  if (again) again.focus();
}

function renderBanner() {
  const el = document.getElementById('banner');
  if (mode === 'waiting') {
    el.innerHTML = `<span>Waiting for the portal's build (asked again every 30 s): ${esc(waitingFor || 'no answer')}</span>`;
    return;
  }
  const flag = mismatchDismissed ? '' : mismatchHtml(link.build, servedBuild());
  el.innerHTML = flag ? `<span>${flag}</span><button onclick="dismissMismatch()" title="Dismiss">×</button>` : '';
}

function dismissMismatch() {
  mismatchDismissed = true;
  renderBanner();
}

// A column picked anew, added or removed by `change`: the link, the polygon
// button, the markers (coloured by the first column), the cards, and the
// selected result's answers. Where that moves the polygon overlay (another
// dataset at its column, or no column), what it drew goes at once, and the
// selected result's polygons are asked anew where its column has a dataset.
function changeColumns(change) {
  const shown = overlayTarget(polygonsColumn, columns, servedBuild());
  change();
  wanted = columns.map((c) => c.token);
  renderColumns();
  updatePolygonsBtn();
  updateLink();
  results.forEach(placeMarker);
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    showDetail(entry.id);
  }
  if (overlayMoved(shown, overlayTarget(polygonsColumn, columns, servedBuild()))) {
    clearPolygonLayer();
    if (polygonsColumn !== 'off' && entry) updatePolygonLayer(entry.id);
  }
  renderResults();
  saveResults();
}

function setColumn(i, col) {
  changeColumns(() => { columns[i] = col; });
}

const columnsEl = document.getElementById('columns');
columnsEl.addEventListener('change', (e) => {
  const el = e.target;
  const i = Number(el.dataset.col);
  if (mode !== 'catalog' || !columns[i]) return;
  if (el.dataset.role === 'preset') {
    if (el.value) {
      setColumn(i, resolveColumn(catalog, el.value));
    } else {
      // Custom: the axes of the dataset the column had.
      const from = columns[i].dataset || datasetOf(catalog, columns[i].selection) || defaultDataset(catalog);
      setColumn(i, resolveColumn(catalog, from.id));
    }
  } else if (el.dataset.axis) {
    const picked = pick(catalog, columns[i].selection, el.dataset.axis, el.value);
    if (picked) setColumn(i, { ...resolveColumn(catalog, picked.dataset.id), note: picked.note });
    else renderColumns();
  }
});
columnsEl.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || mode !== 'catalog') return;
  if (el.dataset.action === 'add' && columns.length < MAX_COLUMNS) {
    changeColumns(() => columns.push(resolveColumn(catalog, addedToken(catalog, columns))));
  } else if (el.dataset.action === 'remove' && columns.length > 1) {
    const i = Number(el.dataset.col);
    changeColumns(() => {
      columns.splice(i, 1);
      if (polygonsColumn === i) polygonsColumn = 'off';
      else if (polygonsColumn !== 'off' && polygonsColumn > i) polygonsColumn--;
      localStorage.setItem('polygons_column', String(polygonsColumn));
    });
  }
});

// The page's URL: the columns, the selected point and the build that
// answered it (linkBuild; the build served without one), so that a copy of
// it opens the same columns on the same point, flagged where another build
// answers it then. Until the link's points are looked up (once the map is
// in) it stays the link the page opened, so that a reload meanwhile opens
// them still.
let linkRestored = false;
function updateLink() {
  if (!linkRestored) return;
  const entry = selectedEntry();
  const served = servedBuild() || (mode === 'waiting' ? link.build : null);
  const keys = columns.map(columnKey).filter((key) => key !== null);
  const search = linkSearch({
    datasets: mode === 'single' ? [] : wanted,
    point: entry ? { lat: entry.lat, lng: entry.lng } : null,
    build: entry ? linkBuild(entry.answers, keys, served) : served,
  });
  history.replaceState(null, '', location.pathname + search + location.hash);
}

function copyLink(btn) {
  updateLink();
  copyToClipboard(location.href, btn);
}

// -- Status --
// The portal's /health, every minute (every 5 s while a sync runs): the
// status line, and the datasets anew once another build is served
// (catalogStale).
async function pollHealth() {
  let health = null;
  try {
    health = await (await fetch('/health')).json();
  } catch (e) {}
  document.getElementById('status').innerHTML = statusHtml(health);
  if (catalogStale(health, mode, catalog)) await loadCatalog();
  setTimeout(pollHealth, health && health.sync && health.sync.running ? 5000 : 60000);
}

// -- LocalStorage persistence --
const STORAGE_KEY = 'geocoder_test_results';

// The results, each as savedResult saves it. Clear empties them.
function saveResults() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(results.map(savedResult))); } catch(e) {}
}

function loadResults() {
  let stored = [];
  try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}
  for (const r of Array.isArray(stored) ? stored : []) {
    const entry = storedResult(r);
    if (!entry) continue;
    results.push(entry);
    placeMarker(entry);
  }
  renderResults();
}

function clearResults() {
  results.length = 0;
  selectedId = null;
  markers.forEach(m => m.marker.remove());
  markers.clear();
  localStorage.removeItem(STORAGE_KEY);
  clearPolygonLayer();
  renderResults();
  updateLink();
  document.getElementById('detailPanel').classList.remove('visible');
}

// Asks every column again for every stored result, after the server's
// build changed. Nominatim's answers stay: they don't change with ours.
function retestAllResults() {
  if (results.length === 0) return;
  const btn = document.getElementById('retestBtn');
  const all = results.slice();
  let done = 0;
  btn.disabled = true;
  btn.textContent = `Re-testing… 0/${all.length}`;
  Promise.all(all.map((entry) => askColumns(entry, true).then(() => {
    done++;
    btn.textContent = `Re-testing… ${done}/${all.length}`;
  }))).then(() => {
    btn.disabled = false;
    btn.textContent = 'Re-test';
  });
}

// -- Click map to geocode --
map.on('click', function(e) {
  reverseGeocode(e.lngLat.lat, e.lngLat.lng, 'map click');
});

// -- Coordinate lookup --
function lookupCoords() {
  const text = document.getElementById('coordInput').value.trim();
  if (!text) return;
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    const parts = line.split(/[\s,]+/).map(Number);
    if (parts.length >= 2 && isFinite(parts[0]) && isFinite(parts[1])) {
      reverseGeocode(parts[0], parts[1], 'manual');
    }
  }
  document.getElementById('coordInput').value = '';
}

document.getElementById('coordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    lookupCoords();
  }
});

// -- Photo upload --
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

async function handleFiles(files) {
  const photoList = document.getElementById('photoList');
  for (const file of files) {
    const item = document.createElement('div');
    item.className = 'photo-item';
    const name = `<span>${esc(file.name)}</span>`;
    item.innerHTML = `${name}<span>extracting...</span>`;
    photoList.appendChild(item);

    try {
      const exif = await exifr.gps(file);
      if (exif && isFinite(exif.latitude) && isFinite(exif.longitude)) {
        item.innerHTML = `${name}<span class="coords">${exif.latitude.toFixed(5)}, ${exif.longitude.toFixed(5)}</span>`;
        reverseGeocode(exif.latitude, exif.longitude, file.name);
      } else {
        item.innerHTML = `${name}<span class="no-gps">No GPS data</span>`;
      }
    } catch (err) {
      item.innerHTML = `${name}<span class="no-gps">EXIF error</span>`;
    }
  }
  photoList.scrollTop = photoList.scrollHeight;
}

// -- Reverse geocode --
function newId() {
  return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
}

function selectedEntry() {
  return results.find((r) => r.id === selectedId) || null;
}

// A new result at (lat, lng): every column is asked, and Nominatim if on.
function reverseGeocode(lat, lng, source) {
  const entry = { id: newId(), lat, lng, source, answers: {}, nominatim: null };
  results.unshift(entry);
  map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 10) });
  placeMarker(entry);
  selectResult(entry.id);
}

// The link's points: each asked afresh in every column (a stored result of
// the point is asked again), the link's first ending selected.
function lookupLinkPoints() {
  for (const p of link.points.slice().reverse()) {
    const entry = results.find((r) => r.lat === p.lat && r.lng === p.lng);
    if (!entry) {
      reverseGeocode(p.lat, p.lng, 'link');
      continue;
    }
    results.splice(results.indexOf(entry), 1);
    results.unshift(entry);
    askColumns(entry, true);
    selectResult(entry.id);
    map.flyTo({ center: [entry.lng, entry.lat], zoom: Math.max(map.getZoom(), 10) });
  }
}

// Asks each column without an answer for `entry` for one (with `again`,
// each column, one being asked already waited for rather than asked
// again), and gives when those answers are in. Columns of one dataset are
// asked once. An answer being asked keeps the promise of its ask (pending).
function askColumns(entry, again = false) {
  const keys = new Map();
  for (const col of columns) {
    const key = columnKey(col);
    if (key !== null && !keys.has(key)) keys.set(key, col);
  }
  const asks = [];
  for (const [key, col] of keys) {
    const have = entry.answers[key];
    if (have && have.loading) {
      if (again) asks.push(have.pending);
      continue;
    }
    if (have && !again) continue;
    const asking = ask(entry, key, col);
    entry.answers[key].pending = asking;
    asks.push(asking);
  }
  return Promise.all(asks);
}

async function ask(entry, key, col) {
  entry.answers[key] = { loading: true };
  answered(entry);
  let answer;
  try {
    const dataset = col.dataset ? `&dataset=${encodeURIComponent(col.dataset.id)}` : '';
    const got = await pacer.request(`/reverse?lat=${entry.lat}&lon=${entry.lng}&key=test${dataset}`, 'reverse');
    answer = answerOf(got.status, got.header, got.body, got.ms);
  } catch (e) {
    answer = { error: e.message };
  }
  entry.answers[key] = answer;
  answered(entry);
}

// Asks Nominatim, where it is on, for `entry`, unless it has its answer or
// is being asked; a request that failed is asked again. One cancelled by
// turning Nominatim off (nominatimCancel) leaves neither an answer nor an
// error: it is asked again once Nominatim is on.
async function askNominatim(entry) {
  if (!nominatimEnabled || entry.nominatim || entry.nominatimLoading) return;
  const { signal } = nominatimCancel;
  entry.nominatimLoading = true;
  entry.nominatimError = null;
  answered(entry);
  try {
    const got = await nominatimPacer.request(`https://nominatim.openstreetmap.org/reverse?lat=${entry.lat}&lon=${entry.lng}&format=jsonv2`, 'reverse', signal);
    const answer = answerOf(got.status, () => null, got.body, got.ms);
    entry.nominatim = answer.data || null;
    entry.nominatimError = answer.error || null;
  } catch (e) {
    if (!signal.aborted) entry.nominatimError = e.message;
  }
  entry.nominatimLoading = false;
  answered(entry);
}

// After an answer of `entry` came in or went out: its marker now, and the
// list, the detail and the link (of the selected result) and the saved
// results once for the answers of 50 ms.
let renderQueued = false;
let detailDirty = false;
function answered(entry) {
  if (!results.includes(entry)) return;
  placeMarker(entry);
  if (entry.id === selectedId) detailDirty = true;
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => {
    renderQueued = false;
    renderResults();
    if (detailDirty) {
      detailDirty = false;
      showDetail(selectedId);
      updateLink();
    }
    saveResults();
  }, 50);
}

// The marker of `entry`, coloured by the first column's answer: gray until
// it is in, red for an error, green with places, else blue.
function placeMarker(entry) {
  const key = columns.length ? columnKey(columns[0]) : null;
  const a = key === null ? null : entry.answers[key];
  const color = !a || a.loading ? MARKER_COLORS.gray
    : a.error ? MARKER_COLORS.red
    : a.data && a.data.places && a.data.places.length ? MARKER_COLORS.green
    : MARKER_COLORS.blue;
  const label = a && a.data ? a.data.display_name || `${entry.lat.toFixed(4)}, ${entry.lng.toFixed(4)}` : null;
  const m = markers.get(entry.id);
  if (m && m.color === color && m.label === label) return;
  if (m) m.marker.remove();
  const marker = new maplibregl.Marker({ color })
    .setLngLat([entry.lng, entry.lat])
    .addTo(map);
  if (label) {
    const places = (a.data.places || []).length;
    marker.setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(
      `<b>${esc(label)}</b>${places ? `<br>${places} place(s)` : ''}`
    ));
  }
  marker.getElement().addEventListener('click', (e) => {
    e.stopPropagation();
    selectResult(entry.id);
  });
  markers.set(entry.id, { marker, color, label });
}

// -- Render results list --
function renderResults() {
  document.getElementById('resultCount').textContent = `(${results.length})`;
  document.getElementById('resultsList').innerHTML = results.map((r) => cardHtml(r, columnViews(r), r.id === selectedId)).join('');
}

// One handler for every card: the copy button copies its coordinates, a
// click elsewhere selects the result. The list can grow large and is drawn
// anew on each answer, so its cards hold no handlers of their own.
document.getElementById('resultsList').addEventListener('click', (ev) => {
  const copy = ev.target.closest('.result-copy');
  if (copy) {
    ev.stopPropagation();
    copyToClipboard(copy.getAttribute('data-copy') || '', copy);
    return;
  }
  const card = ev.target.closest('.result-card');
  const entry = card && results.find((r) => String(r.id) === card.dataset.id);
  if (!entry) return;
  selectResult(entry.id);
  map.flyTo({ center: [entry.lng, entry.lat], zoom: Math.max(map.getZoom(), 13) });
});

function copyToClipboard(text, btn) {
  const finish = () => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = orig;
      btn.classList.remove('copied');
    }, 1000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => legacyCopy(text, finish));
  } else {
    legacyCopy(text, finish);
  }
}
function legacyCopy(text, cb) {
  // Fallback for older browsers / non-HTTPS origins where the async
  // Clipboard API is unavailable. A hidden textarea + execCommand
  // is the standard workaround.
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (_) {}
  document.body.removeChild(ta);
  cb && cb();
}

// Selects a result: its card, its detail (any column it has no answer of
// asked, and Nominatim where it is on), its polygons and the link.
function selectResult(id) {
  selectedId = id;
  const entry = selectedEntry();
  if (entry) {
    askColumns(entry);
    askNominatim(entry);
  }
  renderResults();
  showDetail(id);
  if (polygonsColumn !== 'off') updatePolygonLayer(id);
  updateLink();
}

// -- Polygon overlay --
const POLY_SOURCE = 'debug-polygons';
const POLY_LABEL_SOURCE = 'debug-polygon-labels';
const POLY_FILL = 'debug-polygons-fill';
const POLY_LINE = 'debug-polygons-line';
const POLY_LABELS = 'debug-polygons-labels';
// The overlay: 'off', or the place of the column whose dataset's /polygons
// it shows. Use to A/B the polygons a smaller dataset drops.
let polygonsColumn = (() => {
  const saved = localStorage.getItem('polygons_column');
  return saved !== null && /^\d+$/.test(saved) ? Number(saved) : 'off';
})();
// The overlay's requests: the polygons of the selected result in the
// overlay's column's dataset, while it is on.
const polygonOverlay = new PolygonOverlay({
  request: (url, signal) => pacer.request(url, 'polygons', signal),
  draw: drawPolygons,
  erase: erasePolygons,
  shown: () => {
    const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
    const key = col ? columnKey(col) : null;
    return key === null || selectedId === null ? null : { id: selectedId, key };
  },
});

// Nominatim side-by-side lookup is opt-in — every query goes out to
// nominatim.openstreetmap.org so we don't want to hit it unsolicited.
// Default off; toggle button persists choice in localStorage.
let nominatimEnabled = localStorage.getItem('nominatim_enabled') === '1';
// Cancels Nominatim's requests, those queued and the one in flight, once it
// is turned off: none goes after.
let nominatimCancel = new AbortController();
function toggleNominatim() {
  nominatimEnabled = !nominatimEnabled;
  localStorage.setItem('nominatim_enabled', nominatimEnabled ? '1' : '0');
  if (!nominatimEnabled) {
    nominatimCancel.abort();
    nominatimCancel = new AbortController();
  }
  updateNominatimBtn();
  // The selected result gets its comparison at once, without a new query.
  const entry = selectedEntry();
  if (entry) {
    askNominatim(entry);
    showDetail(entry.id);
  }
}
function updateNominatimBtn() {
  const btn = document.getElementById('nominatimBtn');
  btn.textContent = 'Nominatim: ' + (nominatimEnabled ? 'On' : 'Off');
  btn.style.background = nominatimEnabled ? 'var(--green)' : 'var(--surface2)';
}

// Shoelace-weighted centroid of a closed lng/lat ring
function polygonCentroid(ring) {
  let cx = 0, cy = 0, area = 0;
  const n = ring.length - 1; // last vertex == first for closed rings
  for (let i = 0; i < n; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[i + 1];
    const cross = x1 * y2 - x2 * y1;
    area += cross;
    cx += (x1 + x2) * cross;
    cy += (y1 + y2) * cross;
  }
  area /= 2;
  if (Math.abs(area) < 1e-12) return ring[0];
  return [cx / (6 * area), cy / (6 * area)];
}

function ensurePolygonLayer() {
  if (!map.isStyleLoaded()) { map.once('idle', ensurePolygonLayer); return; }
  if (map.getSource(POLY_SOURCE)) return;
  map.addSource(POLY_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addSource(POLY_LABEL_SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  // Color ramp by admin_level: coarser = warmer, finer = cooler, postal = magenta
  const colorExpr = ['match', ['get', 'admin_level'],
    2, '#ff4444',  // country
    3, '#ff7744',
    4, '#ffaa44',  // state
    5, '#ffdd44',
    6, '#aadd44',  // county
    7, '#44dd88',
    8, '#44ddcc',  // city
    9, '#44aadd',
    10, '#4488dd', // suburb
    11, '#4466dd',
    15, '#8844dd', // class=place marker
    99, '#dd44bb', // postal
    '#888888'
  ];
  map.addLayer({
    id: POLY_FILL,
    type: 'fill',
    source: POLY_SOURCE,
    paint: { 'fill-color': colorExpr, 'fill-opacity': 0.12 }
  });
  map.addLayer({
    id: POLY_LINE,
    type: 'line',
    source: POLY_SOURCE,
    paint: { 'line-color': colorExpr, 'line-width': 2, 'line-opacity': 0.9 }
  });
  map.addLayer({
    id: POLY_LABELS,
    type: 'symbol',
    source: POLY_LABEL_SOURCE,
    layout: {
      'text-field': ['concat', ['to-string', ['get', 'admin_level']], ': ', ['get', 'name']],
      'text-size': 12,
      'symbol-placement': 'point',
      'text-allow-overlap': true,
      'text-ignore-placement': true,
      'text-anchor': 'center',
    },
    paint: { 'text-color': '#ffffff', 'text-halo-color': '#000000', 'text-halo-width': 1.5 }
  });
  // Click a polygon to see its properties in the console + popup
  map.on('click', POLY_FILL, (e) => {
    if (!e.features || !e.features[0]) return;
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true })
      .setLngLat(e.lngLat)
      .setHTML(`<b>${esc(p.name)}</b><br>admin_level ${esc(p.admin_level)}<br>kind: ${esc(p.kind)}<br>area: ${Number(p.area).toExponential(2)}`)
      .addTo(map);
  });
}

// Erases the polygons drawn, and every answer still to come goes unused
// (the overlay off, its column removed, the results cleared).
function clearPolygonLayer() {
  polygonOverlay.clear();
}

function erasePolygons() {
  const src = map.getSource(POLY_SOURCE);
  if (src) src.setData({ type: 'FeatureCollection', features: [] });
  const lsrc = map.getSource(POLY_LABEL_SOURCE);
  if (lsrc) lsrc.setData({ type: 'FeatureCollection', features: [] });
}

function drawPolygons(fc) {
  // Sort largest-first so smaller polygons render on top
  if (fc.features) {
    fc.features.sort((a, b) => (b.properties.area || 0) - (a.properties.area || 0));
  }
  const src = map.getSource(POLY_SOURCE);
  if (src) src.setData(fc);
  // Build a parallel point FeatureCollection for label placement at centroids
  const labelFc = {
    type: 'FeatureCollection',
    features: (fc.features || []).map(f => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: polygonCentroid(f.geometry.coordinates[0]) },
      properties: f.properties,
    })),
  };
  const lsrc = map.getSource(POLY_LABEL_SOURCE);
  if (lsrc) lsrc.setData(labelFc);
}

function updatePolygonLayer(id) {
  const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
  const r = results.find(x => x.id === id);
  if (!col || columnKey(col) === null || !r) { clearPolygonLayer(); return; }
  ensurePolygonLayer();
  const dataset = col.dataset ? `&dataset=${encodeURIComponent(col.dataset.id)}` : '';
  polygonOverlay.show(id, columnKey(col), `/polygons?lat=${r.lat}&lon=${r.lng}&key=test${dataset}`)
    .catch(err => console.warn('polygons fetch failed:', err));
}

function togglePolygons() {
  polygonsColumn = nextPolygons(polygonsColumn, columns.length);
  localStorage.setItem('polygons_column', String(polygonsColumn));
  updatePolygonsBtn();
  if (polygonsColumn === 'off') {
    clearPolygonLayer();
  } else {
    ensurePolygonLayer();
    if (selectedId !== null) updatePolygonLayer(selectedId);
  }
}
function updatePolygonsBtn() {
  const btn = document.getElementById('polygonsBtn');
  const col = polygonsColumn === 'off' ? null : columns[polygonsColumn];
  btn.textContent = `Polygons: ${col ? columnLabel(col) : 'Off'}`;
  btn.style.background = col ? COLUMN_COLORS[polygonsColumn] : 'var(--surface2)';
}

// -- Detail panel --
let detailShown = null;
function showDetail(id) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');
  const entry = results.find(x => x.id === id);
  if (!entry) { panel.classList.remove('visible'); detailShown = null; return; }
  panel.classList.add('visible');
  const views = columnViews(entry);
  if (nominatimEnabled) views.push(nominatimView(entry));
  // An answer coming in keeps the JSON blocks of the result open, each by
  // the place of its view.
  const open = detailShown === id ? [...content.querySelectorAll('details')].filter((d) => d.open).map((d) => d.dataset.view) : [];
  content.innerHTML = detailHtml(views, servedBuild());
  content.querySelectorAll('details').forEach((d) => { if (open.includes(d.dataset.view)) d.open = true; });
  detailShown = id;
}

// -- Start --
updateNominatimBtn();
updatePolygonsBtn();
(async () => {
  await loadCatalog();
  if (mode !== 'single') pollHealth();
  await mapLoaded;
  loadResults();
  if (polygonsColumn !== 'off') ensurePolygonLayer();
  linkRestored = true;
  lookupLinkPoints();
  updateLink();
})();
</script>
