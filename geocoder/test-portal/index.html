<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Geocoder Test Portal</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #222240;
    --surface2: #2a2a4a;
    --border: #3a3a5c;
    --text: #e0e0e8;
    --text-dim: #8888a0;
    --accent: #6c8cff;
    --green: #4caf80;
    --blue: #4a90d9;
    --red: #d94a4a;
    --orange: #d9944a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }

  .layout {
    display: flex;
    height: 100vh;
  }

  .map-panel {
    flex: 0 0 60%;
    position: relative;
  }

  /* A window too short for its sections' least heights scrolls the panel. */
  .side-panel {
    flex: 0 0 40%;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--border);
    overflow-x: hidden;
    overflow-y: auto;
  }

  #map { height: 100%; width: 100%; }

  /* MapLibre dark overrides */
  .maplibregl-ctrl-attrib {
    background: rgba(26, 26, 46, 0.8) !important;
    color: var(--text-dim) !important;
  }
  .maplibregl-ctrl-attrib a { color: var(--accent) !important; }

  section {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  section h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .coord-row {
    display: flex;
    gap: 8px;
  }

  .coord-row textarea {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 8px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 13px;
    resize: vertical;
    min-height: 36px;
    height: 36px;
  }

  .coord-row textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }

  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: default; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 6px;
    padding: 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(108, 140, 255, 0.05);
  }
  .drop-zone input { display: none; }

  .photo-list {
    margin-top: 8px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 12px;
  }
  .photo-item {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    color: var(--text-dim);
  }
  .photo-item .coords { font-family: monospace; color: var(--text); }
  .photo-item .no-gps { color: var(--red); }

  /* The results keep their toolbar and a few cards in sight: the datasets
     above and the detail below scroll within what is left, down to a least
     height of their own. */
  .results-section {
    flex: 1;
    min-height: max(200px, 30%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .results-section h3 {
    padding: 12px 16px 8px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }
  /* Why the results were not saved, as the browser says it. */
  .results-section h3 .warn { text-transform: none; letter-spacing: normal; }

  .results-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.15s;
  }
  .result-card:hover { border-color: var(--accent); }
  .result-card.selected { border-color: var(--accent); background: var(--surface2); }
  .result-card.loading { opacity: 0.6; }
  .result-card.error { border-color: var(--red); }

  .result-coords {
    font-family: monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-copy {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 11px;
    line-height: 16px;
    cursor: pointer;
    margin-left: auto;
  }
  .result-copy:hover {
    background: var(--surface2);
    color: var(--text);
  }
  .result-copy.copied {
    color: var(--green);
    border-color: var(--green);
  }

  .result-name { font-weight: 500; }

  .result-places {
    margin-top: 4px;
    font-size: 12px;
    color: var(--green);
  }

  .result-error {
    color: var(--red);
    font-size: 12px;
    margin-top: 2px;
  }

  .result-source {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .detail-panel {
    border-top: 1px solid var(--border);
    max-height: 40%;
    min-height: 100px;
    overflow-y: auto;
    padding: 12px 16px;
    display: none;
  }
  .detail-panel.visible { display: block; }

  .detail-panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .detail-address {
    margin-bottom: 10px;
  }
  .detail-address .field {
    display: flex;
    gap: 8px;
    font-size: 12px;
    padding: 2px 0;
  }
  .detail-address .label {
    color: var(--text-dim);
    min-width: 90px;
  }

  .detail-places {
    margin-bottom: 10px;
  }
  /* The columns' places tables, side by side, each of a least width it
     reads at: a detail narrower than they are scrolls them sideways. */
  .places-scroll { overflow-x: auto; }
  .places-grid { display: grid; gap: 12px; }
  .detail-places table {
    width: 100%;
    font-size: 12px;
    border-collapse: collapse;
  }
  /* The columns' tables share the detail's width: a long word breaks
     within its own column rather than running into the next. */
  .detail-places th {
    text-align: left;
    color: var(--text-dim);
    font-weight: 500;
    padding: 3px 8px 3px 0;
    border-bottom: 1px solid var(--border);
    overflow-wrap: anywhere;
  }
  .detail-places td {
    padding: 3px 8px 3px 0;
    overflow-wrap: anywhere;
  }

  .json-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 12px;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .json-key { color: #8cb4ff; }
  .json-string { color: #a8d8a8; }
  .json-number { color: #d9a44a; }
  .json-bool { color: #d98a8a; }
  .json-null { color: var(--text-dim); }

  .loading-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Dataset columns */
  .datasets-section { max-height: 42vh; min-height: 100px; overflow-y: auto; }
  .columns { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
  .columns-note { font-size: 12px; color: var(--text-dim); }
  .picker {
    flex: 1 1 200px;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .picker select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 4px;
    font-size: 12px;
    min-width: 0;
  }
  .picker-row { display: flex; gap: 4px; align-items: center; }
  .picker-row select { flex: 1; }
  .picker-remove, .add-column, .tool {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 8px;
    font-size: 12px;
  }
  .add-column { border-style: dashed; align-self: center; }
  .tool { padding: 4px 12px; }
  .picker-axes { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
  .picker-axes label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .picker-axes label span { color: var(--text-dim); white-space: nowrap; }
  .picker-axes select { flex: 1; max-width: 62%; }
  .picker-axes option:disabled { color: var(--text-dim); }
  .picker-name { font-weight: 500; margin-top: 5px; }
  .picker-meta, .picker-desc, .picker-constraint { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .picker-constraint { font-style: italic; }
  .picker-note { color: var(--orange); font-size: 11px; margin-top: 3px; }
  .picker-error { color: var(--red); font-size: 11px; margin-top: 3px; }
  .warn { color: var(--red); }
  .status-line { font-size: 11px; color: var(--text-dim); margin-top: 6px; }
  .banner {
    font-size: 12px;
    color: var(--orange);
    border: 1px solid var(--orange);
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .banner:empty { display: none; }
  .banner button { margin-left: auto; background: transparent; color: var(--orange); padding: 0 4px; }
  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 0 5px;
    border-radius: 3px;
    border: 1px solid var(--orange);
    color: var(--orange);
    margin-left: 6px;
    vertical-align: middle;
  }

  /* Answers side by side */
  .answer-head { border-top: 2px solid var(--accent); padding-top: 4px; min-width: 0; }
  .answer-label { font-size: 11px; text-transform: uppercase; margin-bottom: 2px; }
  .answer-meta { font-size: 11px; color: var(--text-dim); overflow-wrap: anywhere; }
  .answer-name { font-size: 13px; color: var(--text-dim); margin-top: 4px; overflow-wrap: anywhere; }
  .fields { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fields tr { border-bottom: 1px solid var(--border); }
  .fields th { text-align: left; padding: 4px 8px; }
  .fields td { padding: 4px 8px; overflow-wrap: anywhere; }
  .fields td.field { color: var(--text-dim); width: 140px; }
  .fields tr.differs, .fields tr.missing { background: rgba(217, 74, 74, 0.06); }
  .fields tr.differs td.value { color: var(--red); }
  .fields td.empty { color: var(--orange); }
  .detail-places tr.unshared td { color: var(--orange); }

  /* The search: its box, each column's head and the matrix of their
     results, which scrolls within a height of its own. */
  .search-section { max-height: 45vh; min-height: 70px; overflow-y: auto; }
  .search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 7px 8px;
    font-size: 13px;
  }
  .search-input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .search-heads { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 11px; color: var(--text-dim); }
  .search-head { border-left: 3px solid var(--accent); padding-left: 6px; overflow-wrap: anywhere; }
  .search-none { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .search-matrix { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .search-matrix th { text-align: left; color: var(--text-dim); font-weight: 500; padding: 2px 4px; border-bottom: 1px solid var(--border); }
  .search-matrix td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid var(--border); }
  .search-matrix .rank { width: 24px; text-align: center; font-family: "SF Mono", "Fira Code", "Consolas", monospace; }
  .search-matrix td.shifted { text-decoration: underline dotted; }
  .search-matrix td.absent { color: var(--red); }
  .search-matrix td.unanswered { color: var(--text-dim); }
  .search-matrix tr.search-hit { cursor: pointer; }
  .search-matrix tr.missing { background: rgba(217, 74, 74, 0.06); }
  .search-matrix tr.search-hit:hover, .search-matrix tr.search-hit.hover { background: var(--surface2); }
  .hit { overflow-wrap: anywhere; }
  .hit-name { font-weight: 500; }
  .hit-kind, .hit-type { font-size: 10px; color: var(--text-dim); margin-left: 6px; }
  .hit-context { font-size: 11px; color: var(--text-dim); }
  .hit-context .differs { color: var(--red); }
  .search-more { margin-top: 6px; }
  /* A dot of the search on the map: MapLibre places the outer element by
     its transform, so the fill is what grows on hover. */
  .search-dot { width: 14px; height: 14px; cursor: pointer; }
  .search-dot-fill { width: 100%; height: 100%; border-radius: 50%; border: 1px solid rgba(0, 0, 0, 0.8); transition: transform 0.1s; }
  .search-dot.hover .search-dot-fill { transform: scale(1.7); border-color: #fff; }

  /* The form of a report, in a dialog over the page. */
  .feedback-dialog {
    margin: auto;
    width: min(520px, 94vw);
    max-height: 90vh;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 13px;
  }
  .feedback-dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  .feedback-dialog h3 { font-size: 13px; margin-bottom: 4px; }
  .feedback-about { font-size: 11px; color: var(--text-dim); overflow-wrap: anywhere; margin-bottom: 8px; }
  .feedback-dialog details { margin-bottom: 8px; font-size: 12px; }
  .feedback-dialog .json-block { max-height: 200px; overflow-y: auto; }
  .feedback-row { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .feedback-row span, .feedback-fields span { font-size: 11px; color: var(--text-dim); }
  .feedback-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; margin-bottom: 8px; }
  .feedback-fields label { display: flex; flex-direction: column; gap: 2px; }
  .feedback-dialog textarea, .feedback-dialog input:not([type]), .feedback-dialog select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 6px;
    font: inherit;
  }
  .feedback-dialog textarea { resize: vertical; }
  .feedback-check { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .feedback-note { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .feedback-actions { display: flex; gap: 8px; }
  .feedback-status { margin-top: 8px; font-size: 12px; }
  .feedback-btn { margin-top: 4px; padding: 1px 8px; font-size: 11px; }

  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .map-panel { flex: 0 0 45vh; }
    .side-panel { flex: 1; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="map-panel">
    <div id="map"></div>
  </div>
  <div class="side-panel">
    <section class="datasets-section">
      <h3>Datasets</h3>
      <div class="banner" id="banner"></div>
      <div class="columns" id="columns"></div>
      <div class="status-line" id="status"></div>
    </section>

    <section class="search-section" id="searchSection" hidden>
      <h3>Search</h3>
      <input id="searchInput" class="search-input" type="search" placeholder="A place or a POI: searched as you type, Enter searches at once" autocomplete="off" spellcheck="false" />
      <div id="searchOut"></div>
    </section>

    <section>
      <h3>Coordinates</h3>
      <div class="coord-row">
        <textarea id="coordInput" placeholder="lat, lng (one per line for batch)" rows="1"></textarea>
        <button id="lookupBtn" onclick="lookupCoords()">Lookup</button>
      </div>
    </section>

    <section>
      <h3>Photo Upload</h3>
      <div class="drop-zone" id="dropZone">
        <div>Drop images here or click to browse</div>
        <div style="font-size:11px; margin-top:4px; color:var(--text-dim)">JPG, HEIC, PNG, TIFF</div>
        <input type="file" id="fileInput" accept="image/jpeg,image/heic,image/png,image/tiff,.heic,.heif" multiple />
      </div>
      <div class="photo-list" id="photoList"></div>
    </section>

    <div class="results-section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;flex-wrap:wrap;">
        <h3 style="margin:0;flex:1">Results <span id="resultCount"></span> <span id="saveError" class="warn"></span></h3>
        <button id="nominatimBtn" class="tool" onclick="toggleNominatim()" title="Query Nominatim's public API for side-by-side comparison. Off by default — each query hits nominatim.openstreetmap.org so leave off unless you need the comparison.">Nominatim: Off</button>
        <button id="polygonsBtn" class="tool" onclick="togglePolygons()" title="Cycle the polygon overlay: Off, then the admin polygons of each column's dataset in turn. Use to compare which admin levels a smaller dataset drops.">Polygons: Off</button>
        <button id="linkBtn" class="tool" onclick="copyLink(this)" title="Copy a link to these columns, the selected point and the build that answered">Copy link</button>
        <button id="feedbackBtn" class="tool" onclick="openGeneralFeedback()" title="Tell us what you think of the answers or the page" hidden>Feedback</button>
        <button id="retestBtn" onclick="retestAllResults()" style="padding:4px 12px;font-size:12px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;">Re-test</button>
        <button onclick="clearResults()" style="padding:4px 12px;font-size:12px;background:var(--red);color:#fff;border:none;border-radius:4px;cursor:pointer;">Clear</button>
      </div>
      <div class="results-list" id="resultsList"></div>
    </div>

    <div class="detail-panel" id="detailPanel">
      <h3>Detail</h3>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<dialog id="feedbackDialog" class="feedback-dialog"><form id="feedbackForm"></form></dialog>

<script id="core">
// The page's logic that reads no DOM: the link, the columns and the datasets
// they name (the server's /datasets), the pacing of requests, the comparison
// of answers, the place search and its matrix, the reports of those who
// disagree with an answer, and the HTML of each part.
// page.test.mjs runs it in node.

// At most this many dataset columns.
const MAX_COLUMNS = 4;
// The columns a link without d= opens with: the dataset with street
// addresses beside the smallest.
const OPENING_PRESETS = ['with-addresses', 'smallest'];
// The requests to the server in flight at once, over every column and
// result: every visitor of the page shares the test key's rate.
const IN_FLIGHT = 8;
// Each column's colour, by its place, and Nominatim's.
const COLUMN_COLORS = ['#6c8cff', '#d9944a', '#c77dff', '#4ac9d9'];
const NOMINATIM_COLOR = '#4caf80';
// The order of the common address hierarchy in the field table. Other
// fields (landmark classes etc.) follow by name, so that any field the
// answers gain shows without a change here.
const PREFERRED_ORDER = [
  'landmark',
  'house_number', 'road', 'city_block', 'neighbourhood', 'quarter',
  'suburb', 'borough', 'city_district', 'city', 'town', 'village',
  'hamlet', 'municipality', 'district', 'county', 'state_district',
  'region', 'province', 'state', 'postcode', 'country', 'country_code',
];

// `s` as HTML text, in an element or a quoted attribute.
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function formatSize(bytes) {
  return `${(Number(bytes) / 2 ** 30).toFixed(2)} GiB`;
}

// A time of the server (ISO 8601, UTC) as the page shows it.
function shortTime(iso) {
  return iso ? String(iso).replace('T', ' ').replace(/Z$/, ' UTC') : '—';
}

function onGlobe(lat, lng) {
  return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

// -- Builds --
// A build as the page names it: its publication ID, <date>-<the first 12
// hex digits of its manifest's sha256> (the build of a date as it was
// published: a rerun of the nightly that publishes the date again makes
// another), the same on every portal's volume, whatever the dir it fills
// there; or a date alone (a link's b= of a date), which stands for any build
// of its date.
function buildParts(build) {
  const m = /^(\d{4}-\d{2}-\d{2})(?:-([0-9a-f]+))?$/.exec(String(build));
  return m ? { date: m[1], id: m[2] ?? null } : { date: String(build), id: null };
}

// Whether `a` and `b` name one build.
function sameBuild(a, b) {
  const [x, y] = [buildParts(a), buildParts(b)];
  return x.date === y.date && (x.id === null || y.id === null || x.id === y.id);
}

// The order of builds: by date, then ID (a date alone first). Which of two
// publications of a date came first their IDs don't tell.
function buildOrder(a, b) {
  const [x, y] = [buildParts(a), buildParts(b)];
  if (x.date !== y.date) return x.date < y.date ? -1 : 1;
  if (x.id === y.id) return 0;
  if (x.id === null || y.id === null) return x.id === null ? -1 : 1;
  return x.id < y.id ? -1 : 1;
}

// -- The link --
// ?d=<dataset> for each column (a preset's id, or <mode>.<quality>.<poi_tier>),
// at=<lat>,<lon> for each point to look up, b=<build>, the build the
// answers came from (its publication ID; a date alone still opens), and
// q=<text>, the search box's text as it was typed.
function parseLink(search) {
  const params = new URLSearchParams(search);
  const points = [];
  for (const at of params.getAll('at')) {
    const parts = at.split(',');
    if (parts.length !== 2 || parts.some((p) => p.trim() === '')) continue;
    const [lat, lng] = parts.map(Number);
    if (onGlobe(lat, lng)) points.push({ lat, lng });
  }
  return { datasets: params.getAll('d').filter((d) => d).slice(0, MAX_COLUMNS), points, build: params.get('b') || null, q: params.get('q') || '' };
}

// The build a link to a result names (b=): the oldest that answered it in
// the columns `keys` (`answers`, by key) other than the build `served`
// (answers saved, or asked before the build changed: older, or newer where
// the portal went back to an older build), so that a link to answers the
// server no longer gives is flagged; else the oldest that answered it;
// else `served`.
function linkBuild(answers, keys, served) {
  const builds = keys.map((key) => answers[key] && answers[key].build).filter(Boolean).sort(buildOrder);
  return builds.find((build) => !served || !sameBuild(build, served)) || builds[0] || served;
}

function linkSearch({ datasets = [], point = null, build = null, q = '' }) {
  const parts = datasets.map((d) => `d=${encodeURIComponent(d).replace(/%2F/g, '/')}`);
  if (point) parts.push(`at=${point.lat},${point.lng}`);
  if (build) parts.push(`b=${encodeURIComponent(build)}`);
  if (q) parts.push(`q=${encodeURIComponent(q)}`);
  return parts.length ? `?${parts.join('&')}` : '';
}

// How the page answers, by /datasets' status and JSON: in columns of the
// datasets it lists ('catalog'); in one column, a server of one dataset
// having no /datasets ('single'); or not yet, while the portal has no build
// to serve or can't be reached ('waiting', asked again).
function catalogMode(status, json) {
  if (status === 200) return json && Array.isArray(json.datasets) && Array.isArray(json.axes) ? 'catalog' : 'single';
  return status === 404 || status === 405 ? 'single' : 'waiting';
}

// Whether /health's `health` names a build served other than the one the
// page's datasets (`catalog`, in `mode`) are of, by its publication ID (a
// build published again under its date among them, in a dir of the name of
// the one before), or one at all while the page waits for one: the page
// then asks /datasets anew.
function catalogStale(health, mode, catalog) {
  const id = health && health.build ? health.build.id : null;
  if (!id) return false;
  return mode === 'waiting' || (mode === 'catalog' && id !== catalog.build.id);
}

// -- Columns --
function openingTokens(catalog) {
  const tokens = OPENING_PRESETS.filter((id) => catalog.presets.some((p) => p.id === id));
  return tokens.length ? tokens : [catalog.default];
}

// The token of a column added beside `columns`: the first preset whose
// dataset none of them shows, else the first such dataset.
function addedToken(catalog, columns) {
  const shown = new Set(columns.map((c) => c.dataset && c.dataset.id));
  const preset = catalog.presets.find((p) => !shown.has(p.dataset));
  if (preset) return preset.id;
  const dataset = catalog.datasets.find((d) => !shown.has(d.id));
  return dataset ? dataset.id : catalog.default;
}

function sameSelection(catalog, a, b) {
  return catalog.axes.every((axis) => a[axis.id] === b[axis.id]);
}

function datasetOf(catalog, selection) {
  return catalog.datasets.find((d) => sameSelection(catalog, d.selection, selection)) || null;
}

function excludedOf(catalog, selection) {
  return catalog.excluded.find((x) => sameSelection(catalog, x.selection, selection)) || null;
}

function defaultDataset(catalog) {
  return catalog.datasets.find((d) => d.id === catalog.default) || catalog.datasets[0];
}

// The column `token` picks: its dataset, whether it is a custom pick (no
// preset's id), the selection its axes show, and why it has no dataset.
function resolveColumn(catalog, token) {
  const preset = catalog.presets.find((p) => p.id === token);
  const dataset = catalog.datasets.find((d) => d.id === (preset ? preset.dataset : token)) || null;
  const excluded = catalog.excluded.find((x) => x.id === token) || null;
  let error = null;
  if (!dataset) {
    error = excluded ? `dataset ${token} is not offered: ${excluded.message}` : `unknown dataset "${token}": pick one`;
  }
  const selection = { ...(dataset || excluded || defaultDataset(catalog)).selection };
  return { token, dataset, custom: !preset, selection, error, note: null };
}

// The values of the axis `axisId` as a custom pick of `selection`'s other
// values offers them: 'offered'; 'moves' where a constraint requires other
// values of the others, which the pick then takes; or 'excluded' where the
// constraints rule the value out whatever the others. Each with the
// selection it makes and the constraint's message.
function axisChoices(catalog, selection, axisId) {
  const axis = catalog.axes.find((a) => a.id === axisId);
  return axis.values.map((value) => {
    const picked = { ...selection, [axisId]: value.id };
    if (datasetOf(catalog, picked)) return { ...value, state: 'offered', selection: picked, message: null };
    const excluded = excludedOf(catalog, picked);
    const moved = excluded ? { ...picked, ...excluded.requires } : null;
    if (moved && moved[axisId] === value.id && datasetOf(catalog, moved)) {
      return { ...value, state: 'moves', selection: moved, message: excluded.message };
    }
    return { ...value, state: 'excluded', selection: null, message: excluded ? excluded.message : 'not in this build' };
  });
}

function valueLabel(axis, id) {
  const value = axis.values.find((v) => v.id === id);
  return value ? value.label : id;
}

// What a custom pick of `selection` becomes when its axis `axisId` takes
// `valueId`: the selection, its dataset, and a note of the axes that move
// for a constraint, with its message. None for a value the constraints
// rule out.
function pick(catalog, selection, axisId, valueId) {
  const choice = axisChoices(catalog, selection, axisId).find((c) => c.id === valueId);
  if (!choice || choice.state === 'excluded') return null;
  let note = null;
  if (choice.state === 'moves') {
    const moved = catalog.axes
      .filter((a) => a.id !== axisId && choice.selection[a.id] !== selection[a.id])
      .map((a) => `${a.label} moves to ${valueLabel(a, choice.selection[a.id])}`);
    note = `${moved.join(', ')}: ${choice.message}`;
  }
  return { selection: choice.selection, dataset: datasetOf(catalog, choice.selection), note };
}

// A selection by the labels of its values, on the axes that offer a choice.
function selectionLabel(catalog, selection) {
  return catalog.axes.filter((a) => a.values.length > 1).map((a) => valueLabel(a, selection[a.id])).join(' · ');
}

// -- Answers --
// An answer as the page keeps it, from a response of the server: its JSON
// (data) or why there is none (error), the build and the dataset that
// answered (X-Geocoder-Build-Id, the build's publication ID, and
// X-Geocoder-Dataset), and the ms it took.
function answerOf(status, header, body, ms) {
  const build = header('x-geocoder-build-id');
  const dataset = header('x-geocoder-dataset');
  if (status !== 200) return { error: `HTTP ${status}${body ? `: ${body.slice(0, 300)}` : ''}`, build, dataset, ms };
  try {
    return { data: JSON.parse(body), build, dataset, ms };
  } catch (e) {
    return { error: `not JSON: ${body.slice(0, 300)}`, build, dataset, ms };
  }
}

// The field table's rows: each address field of any of `addresses` (null
// for a column without an answer, which lacks no field), in PREFERRED_ORDER
// then by name, with each one's value ('' for none), whether two values
// disagree, and whether an answer lacks the field.
function fieldRows(addresses) {
  const fields = [...new Set(addresses.flatMap((a) => Object.keys(a || {})))];
  const rank = (f) => (PREFERRED_ORDER.includes(f) ? PREFERRED_ORDER.indexOf(f) : PREFERRED_ORDER.length);
  fields.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  return fields
    .map((field) => {
      const values = addresses.map((a) => (a && a[field] != null && a[field] !== '' ? String(a[field]) : ''));
      const present = values.filter((v) => v);
      const lacking = values.filter((v, i) => !v && addresses[i]);
      return { field, values, differs: present.some((v) => v !== present[0]), missing: present.length > 0 && lacking.length > 0 };
    })
    .filter((row) => row.values.some((v) => v));
}

function placeKey(p) {
  return `${p.name}\u0000${p.category}`;
}

// Whether the answers `datas` (null for a column without one) disagree on
// what the page shows: the display name, an address field or the places,
// each with its distance.
function answersDiffer(datas) {
  const answered = datas.filter((d) => d);
  if (answered.length < 2) return false;
  const name = (d) => d.display_name || '';
  const places = (d) => (d.places || []).map((p) => `${placeKey(p)}\u0000${p.distance_m}`).join('\u0001');
  return answered.some((d) => name(d) !== name(answered[0]) || places(d) !== places(answered[0]))
    || fieldRows(answered.map((d) => d.address || {})).some((row) => row.differs || row.missing);
}

// -- Requests --
// Asks the server, `limit` requests in flight at most over the whole page.
// Each request counts against a rate-limit scope: 'reverse' (the default),
// /reverse's (the test key's rate, which every visitor shares), or
// 'polygons', /polygons' (none). A 429 is asked again after a pause of its
// scope, which begins before the 429's place goes to the next in line and
// which the scope's requests wait out without a place, so that those of
// another scope go meanwhile: `firstPause` ms, doubled by each 429 of a
// request started after the scope's last pause began (those in flight
// together make one) up to `maxPause`, and back to none after a success
// (2xx) of a request of the scope started after it began. After `tries`
// asks a 429 is the answer. request(url, scope, signal) gives the status,
// the headers (header(name)), the body and the ms the request took, its
// wait in line not counted. A request whose `signal` (an AbortController's)
// aborts stops where it is, its promise rejected with the abort's reason:
// one waiting in line or out a pause gives up its turn and is never sent
// or asked again, and one in flight frees its place at once, its fetch,
// given the signal, ending its download.
class Pacer {
  constructor({ limit = IN_FLIGHT, fetch, sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)), now = () => Date.now(),
                tries = 8, firstPause = 500, maxPause = 8000 }) {
    Object.assign(this, { limit, send: fetch, sleep, now, tries, firstPause, maxPause });
    this.active = 0;
    this.waiting = [];
    this.scopes = new Map();
  }

  // The pause of the scope `name`: its length, when it began and when it
  // ends.
  scope(name) {
    if (!this.scopes.has(name)) this.scopes.set(name, { pause: 0, pausedAt: -Infinity, pausedUntil: -Infinity });
    return this.scopes.get(name);
  }

  async request(url, scope = 'reverse', signal = null) {
    const s = this.scope(scope);
    for (let tries = 1; ; tries++) {
      await this.turn(s, signal);
      let got;
      try {
        const started = this.now();
        const response = await abortable(this.send(url, signal), signal);
        const body = await abortable(response.text(), signal);
        got = { status: response.status, header: (name) => response.headers.get(name), body, ms: this.now() - started };
        if (got.status === 429 && started > s.pausedAt) {
          s.pause = Math.min(this.maxPause, s.pause ? s.pause * 2 : this.firstPause);
          s.pausedAt = this.now();
          s.pausedUntil = s.pausedAt + s.pause;
        } else if (got.status >= 200 && got.status < 300 && started > s.pausedAt) {
          s.pause = 0;
        }
      } finally {
        this.release();
      }
      if (got.status !== 429 || tries >= this.tries) return got;
    }
  }

  // A place in line once the pause of the scope `s` is over. A pause that
  // began while it waited in line it waits out without one, its place
  // going to the next in line. None once `signal` aborts.
  async turn(s, signal) {
    for (;;) {
      for (let wait; (wait = s.pausedUntil - this.now()) > 0;) await abortable(this.sleep(wait), signal);
      await this.acquire(signal);
      if (signal && signal.aborted) {
        this.release();
        throw signal.reason;
      }
      if (s.pausedUntil <= this.now()) return;
      this.release();
    }
  }

  // A place, once one is free; a request whose `signal` aborts while it
  // waits for one leaves the line.
  acquire(signal) {
    if (signal && signal.aborted) return Promise.reject(signal.reason);
    if (this.active < this.limit) {
      this.active++;
      return Promise.resolve();
    }
    return new Promise((resolve, reject) => {
      const leave = () => {
        this.waiting.splice(this.waiting.indexOf(go), 1);
        reject(signal.reason);
      };
      const go = () => {
        if (signal) signal.removeEventListener('abort', leave);
        resolve();
      };
      this.waiting.push(go);
      if (signal) signal.addEventListener('abort', leave, { once: true });
    });
  }

  // Hands the place of a request that is done to the next in line.
  release() {
    const next = this.waiting.shift();
    if (next) next();
    else this.active--;
  }
}

// `promise`, or the abort of `signal` (none: never), whichever comes first.
function abortable(promise, signal) {
  if (!signal) return promise;
  if (signal.aborted) return Promise.reject(signal.reason);
  return new Promise((resolve, reject) => {
    const abort = () => reject(signal.reason);
    signal.addEventListener('abort', abort, { once: true });
    promise.then((value) => {
      signal.removeEventListener('abort', abort);
      resolve(value);
    }, (e) => {
      signal.removeEventListener('abort', abort);
      reject(e);
    });
  });
}

// -- Place search --
// The search box's search of each column's dataset (/search, the portal's),
// whose results go into one matrix: a row for each result, those of the
// columns that name one place one row.

// The results each column is asked for.
const SEARCH_LIMIT = 10;
// The quiet in the box, in ms, before its text is searched.
const SEARCH_DEBOUNCE = 250;
// The rows of the matrix shown until every one is asked for.
const SEARCH_ROWS = 5;
// The results of two columns are one where their names are equal, both or
// neither is a POI (poiOrNot), and their points at most this many metres
// apart; within AREA_MATCH_METRES where one is a boundary without a label
// node, whose point is one on its ring's surface, which moves with the
// boundary's precision.
const MATCH_METRES = 1000;
const AREA_MATCH_METRES = 20000;
// The parts of a result's context, the smallest first.
const SEARCH_CONTEXT = ['admin2name', 'admin1name', 'country'];
// A result's kind (its letter in /search?debug=1) as the matrix names it.
const SEARCH_KINDS = {
  P: { label: 'place', title: 'a place node of a settlement' },
  M: { label: 'place', title: 'a place node of a suburb, quarter or neighbourhood' },
  B: { label: 'boundary', title: 'a boundary, at its label node' },
  A: { label: 'boundary', title: 'a boundary without a label node, at a point on its surface' },
  O: { label: 'POI', title: 'a point of interest' },
};
// A dot's slice of a column that lacks its result or has no answer.
const DOT_ABSENT = '#555566';

// Whether results of the kinds `a` and `b` can be one: a POI with a POI
// only, however near a place or boundary of its name (a dataset without
// POIs gives the town where another gives a memorial of the town's name).
// A place and a boundary can: a dataset gives a place node where another
// gives the boundary it labels.
function poiOrNot(a, b) {
  return (a === 'O') === (b === 'O');
}

// Whether the server searches: a portal whose /datasets names each
// dataset's index. A production server has no /datasets.
function searchOffered(mode, catalog) {
  return mode === 'catalog' && Boolean(catalog) && catalog.datasets.length > 0
    && catalog.datasets.every((d) => d.search && d.search.index);
}

// The search of `q` in `dataset`, its results with how each was found.
function searchUrl(q, dataset, limit = SEARCH_LIMIT) {
  return `/search?q=${encodeURIComponent(q)}&dataset=${encodeURIComponent(dataset)}&limit=${limit}&key=test&debug=1`;
}

// A search answer as the page keeps it, from a response of the server: its
// results (best first) with the µs the search took in the server, the index
// it searched (X-Geocoder-Search-Index), the build and the dataset; the
// state of an index not open, building (asked again after `retry` s, its
// Retry-After) or failed and why; or why there is none. With the ms it
// took.
function searchAnswerOf(status, header, body, ms) {
  let json = null;
  try {
    json = JSON.parse(body);
  } catch (e) {}
  if (status === 200) {
    if (!json || typeof json !== 'object' || !Array.isArray(json.results)) return { error: `not a search answer: ${body.slice(0, 300)}`, ms };
    return { results: json.results, us: json.us, index: header('x-geocoder-search-index'), build: header('x-geocoder-build-id'), dataset: header('x-geocoder-dataset'), ms };
  }
  if (status === 503 && json && json.status === 'building') {
    return { building: { index: json.index, since: json.since }, retry: Number(header('retry-after')) || 5, dataset: json.dataset, ms };
  }
  if (status === 503 && json && json.status === 'failed') {
    return { failed: { index: json.index, since: json.since, reason: json.reason }, dataset: json.dataset, ms };
  }
  return { error: `HTTP ${status}${body ? `: ${body.slice(0, 300)}` : ''}`, ms };
}

// The metres between two points, along the globe.
function metres(lat1, lng1, lat2, lng2) {
  const rad = Math.PI / 180;
  const h = Math.sin(((lat2 - lat1) * rad) / 2) ** 2
    + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(((lng2 - lng1) * rad) / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.min(1, Math.sqrt(h)));
}

function formatMetres(m) {
  return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1)} km`;
}

// The matrix's rows from each column's results (`lists`: null for a column
// without an answer, which lacks none). A result joins the row of an earlier
// column's result of its name and a kind it can be one with (poiOrNot)
// within MATCH_METRES of it, the closest pairs first, each row and each
// result once; else it makes a row of its own. A column's own results
// never share one. Each row has the name, kind, type
// and point of its first result; its cell of each column (the rank, the
// result and its metres from that point; null where the column has none);
// its best rank; whether a column that answered lacks it; whether the ranks
// differ; the most it moved; whether the columns give another type or kind;
// and its context, each part with the first result's value, each column's
// (null where it has no cell) and whether they disagree. By best rank: of
// rows of one, those of the earlier columns first.
function searchRows(lists) {
  const rows = [];
  lists.forEach((list, c) => {
    if (!list) return;
    const before = rows.slice();
    const pairs = [];
    list.forEach((r, i) => before.forEach((row, n) => {
      if (row.name !== r.name || !poiOrNot(row.kind, r.kind)) return;
      const m = metres(row.lat, row.lng, r.latitude, r.longitude);
      if (m <= (row.kind === 'A' || r.kind === 'A' ? AREA_MATCH_METRES : MATCH_METRES)) pairs.push({ m, i, n });
    }));
    pairs.sort((a, b) => a.m - b.m || a.i - b.i || a.n - b.n);
    const placed = new Set();
    for (const { m, i, n } of pairs) {
      if (placed.has(i) || before[n].cells[c]) continue;
      before[n].cells[c] = { rank: i + 1, result: list[i], metres: m };
      placed.add(i);
    }
    list.forEach((r, i) => {
      if (placed.has(i)) return;
      const cells = lists.map(() => null);
      cells[c] = { rank: i + 1, result: r, metres: 0 };
      rows.push({ name: r.name, kind: r.kind, type: r.type, lat: r.latitude, lng: r.longitude, cells });
    });
  });
  for (const row of rows) {
    const cells = row.cells.filter(Boolean);
    row.best = Math.min(...cells.map((x) => x.rank));
    row.missing = lists.some((list, c) => list && !row.cells[c]);
    row.ranksDiffer = cells.some((x) => x.rank !== row.best);
    row.moved = Math.max(...cells.map((x) => x.metres));
    row.typeDiffers = cells.some((x) => x.result.type !== row.type || x.result.kind !== row.kind);
    row.context = SEARCH_CONTEXT.map((part) => {
      const values = row.cells.map((x) => (x ? String(x.result[part] ?? '') : null));
      const given = values.filter((v) => v !== null);
      return { part, value: given[0], values, differs: given.some((v) => v !== given[0]) };
    });
  }
  return rows.sort((a, b) => a.best - b.best);
}

// The background of a row's dot: a slice of each column, in the column's
// colour where it has the result, else DOT_ABSENT; of one column, its
// colour.
function dotBackground(row, colors) {
  const n = row.cells.length;
  const color = (c) => (row.cells[c] ? colors[c] : DOT_ABSENT);
  if (n === 1) return color(0);
  const at = (k) => `${Number(((k * 100) / n).toFixed(2))}%`;
  return `conic-gradient(${row.cells.map((_, c) => `${color(c)} ${at(c)} ${at(c + 1)}`).join(', ')})`;
}

// A row's dot's tooltip, as text: its name and type, and its rank in each
// column (`labels`) that has it.
function dotTitle(row, labels) {
  const ranks = row.cells.map((x, c) => (x ? `#${x.rank} in ${labels[c]}` : null)).filter(Boolean);
  return `${row.name} (${row.type}): ${ranks.join(', ')}`;
}

// Where a result picked from the matrix of the search `q` came from, as its
// card says: its name, and its best rank in the first column of it.
function searchSource(q, row, labels) {
  const c = row.cells.findIndex((x) => x && x.rank === row.best);
  return `search "${q}": ${row.name}, #${row.best} in ${labels[c]}`;
}

// The search box's search (the page's other script wires it to the box):
// the text searched (q; '' for none) and each dataset's answer to it
// (answers, by its id; { loading: true } while it is asked). typed(text)
// searches the text once the box has kept it for `debounce` ms, but not the
// search shown again; submit(text) (Enter) searches it at once; text of
// spaces alone ends the search at once. A search asks each dataset of
// `datasets()` (the columns') once, and cancels the requests of the one
// before, whose answers it drops. ask() asks those datasets that have no
// answer of the search shown (a column added, or another dataset picked),
// again() searches every one anew (another build). A dataset whose index is
// building is asked again after its Retry-After, its state shown meanwhile.
// request(url, signal) asks the server (the pacer), changed() follows each
// change, setTimer(fn, ms) and clearTimer(id) as setTimeout and
// clearTimeout.
class PlaceSearch {
  constructor({ request, datasets, changed = () => {}, setTimer = (fn, ms) => setTimeout(fn, ms), clearTimer = (id) => clearTimeout(id),
                debounce = SEARCH_DEBOUNCE, limit = SEARCH_LIMIT }) {
    Object.assign(this, { request, datasets, changed, setTimer, clearTimer, debounce, limit });
    this.q = '';
    this.answers = {};
    this.timer = null;
    this.retries = new Map();
    this.cancelling = null;
  }

  typed(text) {
    this.clearTimer(this.timer);
    this.timer = null;
    if (!text.trim()) {
      this.run('');
      return;
    }
    this.timer = this.setTimer(() => {
      this.timer = null;
      if (text !== this.q) this.run(text);
    }, this.debounce);
  }

  submit(text) {
    this.clearTimer(this.timer);
    this.timer = null;
    this.run(text);
  }

  clear() {
    this.submit('');
  }

  again() {
    if (this.q) this.run(this.q);
  }

  // A new search of `text` ('' ends the search): the one before cancelled,
  // its answers and its retries dropped.
  run(text) {
    if (this.cancelling) this.cancelling.abort();
    for (const id of this.retries.values()) this.clearTimer(id);
    this.retries.clear();
    this.answers = {};
    this.q = text.trim() ? text : '';
    this.cancelling = this.q ? new AbortController() : null;
    this.ask();
    this.changed();
  }

  ask() {
    if (!this.q) return;
    for (const dataset of new Set(this.datasets())) {
      if (!Object.hasOwn(this.answers, dataset)) this.askOne(dataset);
    }
  }

  // Asks `dataset`, unless the search is cancelled before its answer comes;
  // one asked again while its index builds keeps that state meanwhile.
  async askOne(dataset) {
    const { cancelling } = this;
    if (!(this.answers[dataset] && this.answers[dataset].building)) {
      this.answers[dataset] = { loading: true };
      this.changed();
    }
    let answer;
    try {
      const got = await this.request(searchUrl(this.q, dataset, this.limit), cancelling.signal);
      answer = searchAnswerOf(got.status, got.header, got.body, got.ms);
    } catch (e) {
      if (cancelling.signal.aborted) return;
      answer = { error: e.message };
    }
    if (cancelling !== this.cancelling) return;
    this.answers[dataset] = answer;
    if (answer.building) {
      this.retries.set(dataset, this.setTimer(() => {
        this.retries.delete(dataset);
        if (cancelling === this.cancelling) this.askOne(dataset);
      }, answer.retry * 1000));
    }
    this.changed();
  }
}

// The heads of the columns' searches (`views`: each column's label, colour,
// dataset, error and answer to the search shown): its results' count, the ms
// its request took and the time of the search in the server, and its index,
// noted where an earlier column's is the same; its index queued or building
// since when, with how many of the build's indexes /health (`health`) gives
// ready; its index failed, and why; or why it has no answer. A dataset's
// answer has a "Disagree?" button, named by its column (data-feedback-search).
function searchHeadsHtml(views, health) {
  const groups = health && health.search && Array.isArray(health.search.groups) ? health.search.groups : null;
  let html = '<div class="search-heads">';
  views.forEach((v, c) => {
    const a = v.answer;
    let state = '';
    if (!a) {
      if (v.error) state = `<span class="warn">${esc(v.error)}</span>`;
    } else if (a.loading) {
      state = '<span class="loading-spinner"></span>searching…';
    } else if (a.building) {
      const group = groups ? groups.find((g) => g.index === a.building.index) : null;
      state = `<span class="loading-spinner"></span>index ${esc(a.building.index)} ${group && group.state === 'queued' ? 'queued' : 'building'}`
        + ` since ${esc(shortTime(a.building.since))}`;
      if (groups) state += ` · ${groups.filter((g) => g.state === 'ready').length} of ${groups.length} indexes ready`;
    } else if (a.failed) {
      state = `<span class="warn">search unavailable: ${esc(a.failed.reason)}</span> · index ${esc(a.failed.index)},`
        + ` failed ${esc(shortTime(a.failed.since))}; the next sync round tries it again`;
    } else if (a.error) {
      state = `<span class="warn">${esc(a.error)}</span>`;
    } else if (a.results) {
      const n = a.results.length;
      const index = a.index || (v.dataset && v.dataset.search ? v.dataset.search.index : '');
      const parts = [`${n} result${n === 1 ? '' : 's'}`];
      if (Number.isFinite(a.ms)) parts.push(`${Math.round(a.ms)} ms${Number.isFinite(a.us) ? `, ${(a.us / 1000).toFixed(2)} ms in the search` : ''}`);
      parts.push(`index ${esc(index)}`);
      state = parts.join(' · ');
      const same = views.findIndex((w, d) => d < c && w.answer && w.answer.results && w.answer.index === a.index);
      if (same >= 0) state += `, as ${same + 1}'s`;
    }
    const disagree = a && a.results && v.dataset
      ? ` <button class="tool feedback-btn" data-feedback-search="${c}" title="Tell us what you expected this search to find">Disagree?</button>` : '';
    html += `<div class="search-head" style="border-left-color:${v.color}"><span style="color:${v.color}">${c + 1}</span> ${esc(v.label)}${state ? `: ${state}` : ''}${disagree}</div>`;
  });
  return `${html}</div>`;
}

// The matrix of a search's `rows`: a column of ranks for each of `views`, in
// its colour ('–' where it answered without the row's result, '·' where it
// has no answer; a rank below the row's best marked), then the result: its
// name, kind and type, how far it moved between the columns and whether
// they give it another type, and its context, each part they disagree on
// marked with each one's value. The first SEARCH_ROWS rows, or every one
// where `expanded`, and the button that shows the others or hides them;
// none until a column answers.
function searchMatrixHtml(rows, views, expanded) {
  const answered = views.map((v) => Boolean(v.answer && v.answer.results));
  if (!answered.some(Boolean)) return '';
  if (!rows.length) return '<div class="search-none">No results</div>';
  let html = '<table class="search-matrix"><tr>';
  views.forEach((v, c) => { html += `<th class="rank" style="color:${v.color}" title="${esc(v.label)}">${c + 1}</th>`; });
  html += '<th>Result</th></tr>';
  (expanded ? rows : rows.slice(0, SEARCH_ROWS)).forEach((row, n) => {
    html += `<tr class="search-hit${row.missing ? ' missing' : ''}" data-row="${n}">`;
    row.cells.forEach((cell, c) => {
      const v = views[c];
      if (cell) {
        const r = cell.result;
        const how = [`${v.label}: #${cell.rank}`];
        if (Number.isFinite(r.score)) how.push(`score ${r.score.toFixed(3)}`);
        if (Number.isFinite(r.text)) how.push(`text ${r.text.toFixed(3)}`);
        if (r.context) how.push('its context matched');
        html += `<td class="rank${cell.rank > row.best ? ' shifted' : ''}" style="color:${v.color}" title="${esc(how.join(' · '))}">${cell.rank}</td>`;
      } else if (answered[c]) {
        html += `<td class="rank absent" title="${esc(`${v.label}: not among its results`)}">–</td>`;
      } else {
        html += `<td class="rank unanswered" title="${esc(`${v.label}: no answer`)}">·</td>`;
      }
    });
    const kind = Object.hasOwn(SEARCH_KINDS, row.kind) ? SEARCH_KINDS[row.kind] : { label: row.kind, title: row.kind };
    html += `<td class="hit"><div><span class="hit-name">${esc(row.name)}</span>`
      + `<span class="hit-kind" title="${esc(kind.title)}">${esc(kind.label)}</span><span class="hit-type">${esc(row.type)}</span>`;
    if (row.moved >= 1) html += `<span class="tag" title="The farthest of its points from the first column's">moved ${formatMetres(row.moved)}</span>`;
    if (row.typeDiffers) {
      const types = row.cells.map((x, c) => (x ? `${views[c].label}: ${x.result.type} (${x.result.kind})` : null)).filter(Boolean);
      html += `<span class="tag" title="${esc(types.join(' · '))}">type differs</span>`;
    }
    const parts = row.context.filter((p) => p.value || p.differs).map((p) => {
      if (!p.differs) return esc(p.value);
      const each = p.values.map((value, c) => (value === null ? null : `${views[c].label}: ${value || '—'}`)).filter(Boolean);
      return `<span class="differs" title="${esc(each.join(' · '))}">${esc(p.value || '—')}</span>`;
    });
    html += `</div><div class="hit-context">${parts.join(' · ')}</div></td></tr>`;
  });
  html += '</table>';
  if (rows.length > SEARCH_ROWS) {
    html += `<button class="tool search-more" data-action="more">${expanded ? `Show the first ${SEARCH_ROWS}` : `Show ${rows.length - SEARCH_ROWS} more`}</button>`;
  }
  return html;
}

// The search's part of the page: the columns' heads, then the matrix.
function searchHtml(views, health, rows, expanded) {
  return searchHeadsHtml(views, health) + searchMatrixHtml(rows, views, expanded);
}

// -- HTML --
// The picker of the column `col`, the `index`th of `count`: a preset or a
// custom pick by axis (a value the constraints rule out greyed, with their
// message), then its dataset's name, values, sizes and description.
function pickerHtml(catalog, col, index, count) {
  const color = COLUMN_COLORS[index % COLUMN_COLORS.length];
  let html = `<div class="picker" style="border-left-color:${color}">`;
  html += `<div class="picker-row"><select data-col="${index}" data-role="preset" title="A preset of the build, or a custom pick by axis">`;
  for (const p of catalog.presets) {
    const d = catalog.datasets.find((x) => x.id === p.dataset);
    const size = d ? ` · ${formatSize(d.size_disk)}` : '';
    html += `<option value="${esc(p.id)}"${!col.custom && col.token === p.id ? ' selected' : ''} title="${esc(p.description)}">${esc(p.label)}${size}</option>`;
  }
  html += `<option value=""${col.custom ? ' selected' : ''}>Custom…</option></select>`;
  if (count > 1) html += `<button class="picker-remove" data-col="${index}" data-action="remove" title="Remove this column">×</button>`;
  html += '</div>';
  if (col.custom) {
    const constraints = [];
    html += '<div class="picker-axes">';
    for (const axis of catalog.axes) {
      if (axis.values.length < 2) continue;
      html += `<label title="${esc(axis.description)}"><span>${esc(axis.label)}</span><select data-col="${index}" data-axis="${esc(axis.id)}">`;
      for (const c of axisChoices(catalog, col.selection, axis.id)) {
        const mark = c.state === 'excluded' ? ' (not offered)' : c.state === 'moves' ? ' *' : '';
        html += `<option value="${esc(c.id)}"${c.id === col.selection[axis.id] ? ' selected' : ''}${c.state === 'excluded' ? ' disabled' : ''}`
          + ` title="${esc(c.message || c.description)}">${esc(c.label)}${mark}</option>`;
        if (c.message) constraints.push(`${c.label}: ${c.message}`);
      }
      html += '</select></label>';
    }
    html += '</div>';
    for (const line of constraints) html += `<div class="picker-constraint">${esc(line)}</div>`;
  }
  const d = col.dataset;
  if (d) {
    html += `<div class="picker-name">${esc(d.label)}</div>`;
    html += `<div class="picker-meta">${esc(selectionLabel(catalog, d.selection))} · ${esc(d.id)}</div>`;
    html += `<div class="picker-meta">${formatSize(d.size_disk)} on disk · ${formatSize(d.size_download)} download</div>`;
    if (d.description) html += `<div class="picker-desc">${esc(d.description)}</div>`;
  }
  if (col.note) html += `<div class="picker-note">${esc(col.note)}</div>`;
  if (col.error) html += `<div class="picker-error">${esc(col.error)}</div>`;
  return `${html}</div>`;
}

// The key of the control of the pickers whose element's data-* attributes
// are `data` (its dataset): its column, and its role, axis or action, which
// name it again once the pickers are drawn anew; none for an element of
// none.
function controlKey(data) {
  if (data.col === undefined && data.action === undefined) return null;
  return [data.col, data.role, data.axis, data.action].map((v) => v ?? '').join('\u0000');
}

// The least width of a column's places table in the detail, in px: its
// three columns' padding and a few letters of each.
const PLACES_WIDTH = 160;

// The detail of a result, from `views`: one a column ({label, color,
// dataset, answer}), and Nominatim's. Per answer its name, dataset, build
// and time, flagged where a build other than the one `served` answered
// (sameBuild: one published before it under its date among them), and the
// sizes of its dataset in the build served, where that answered; the
// address fields side by side, those the answers disagree on or lack
// marked; the places, those not in every answer marked; the JSON, each
// panel named by the place of its view (data-view). An answer of a dataset
// has a "Disagree?" button, named by the place of its view (data-feedback).
function detailHtml(views, served) {
  const grid = `display:grid;grid-template-columns:repeat(${views.length},minmax(0,1fr));gap:12px`;
  let html = `<div style="${grid};margin-bottom:12px">`;
  for (const [i, v] of views.entries()) {
    const a = v.answer || {};
    html += `<div class="answer-head" style="border-top-color:${v.color}"><div class="answer-label" style="color:${v.color}">${esc(v.label)}</div>`;
    const meta = [];
    if (v.dataset) meta.push(esc(v.dataset.id));
    if (a.build) meta.push(`build ${esc(a.build)}`);
    if (Number.isFinite(a.ms)) meta.push(`${Math.round(a.ms)} ms`);
    if (meta.length) html += `<div class="answer-meta">${meta.join(' · ')}</div>`;
    const stale = a.build && served && !sameBuild(a.build, served);
    if (v.dataset && !stale) html += `<div class="answer-meta">${formatSize(v.dataset.size_disk)} on disk · ${formatSize(v.dataset.size_download)} download</div>`;
    if (stale) {
      html += `<span class="tag stale" title="The server serves build ${esc(served)} now: Re-test asks it again">build ${esc(a.build)}, not ${esc(served)}</span>`;
    }
    if (a.loading) html += '<div class="answer-name"><span class="loading-spinner"></span>Loading…</div>';
    else if (a.error) html += `<div class="result-error">${esc(a.error)}</div>`;
    else if (a.data) html += `<div class="answer-name">${a.data.display_name ? esc(a.data.display_name) : '—'}</div>`;
    else html += '<div class="answer-meta">not asked yet</div>';
    if (v.dataset && a.data) html += `<button class="tool feedback-btn" data-feedback="${i}" title="Tell us what you expected here">Disagree?</button>`;
    html += '</div>';
  }
  html += '</div>';

  const datas = views.map((v) => (v.answer && v.answer.data) || null);
  const rows = fieldRows(datas.map((d) => (d ? d.address || {} : null)));
  if (rows.length) {
    html += '<table class="fields"><tr><th style="color:var(--text-dim);width:140px">Field</th>';
    for (const v of views) html += `<th style="color:${v.color}">${esc(v.label)}</th>`;
    html += '</tr>';
    for (const row of rows) {
      html += `<tr class="${row.differs ? 'differs' : row.missing ? 'missing' : ''}"><td class="field">${esc(row.field)}</td>`;
      row.values.forEach((value, i) => {
        html += value ? `<td class="value">${esc(value)}</td>` : `<td class="empty">${datas[i] ? '—' : ''}</td>`;
      });
      html += '</tr>';
    }
    html += '</table>';
  }

  if (datas.some((d) => d && d.places && d.places.length)) {
    const keys = datas.map((d) => (d ? new Set((d.places || []).map(placeKey)) : null));
    // Each column's table keeps a width it reads at: the places scroll
    // sideways in a box of their own where the detail is narrower.
    html += '<div class="detail-places"><h3 style="margin:10px 0 6px">Places</h3><div class="places-scroll">'
      + `<div class="places-grid" style="grid-template-columns:repeat(${views.length},minmax(${PLACES_WIDTH}px,1fr))">`;
    views.forEach((v, i) => {
      const places = (datas[i] && datas[i].places) || [];
      html += `<div><div class="answer-label" style="color:${v.color}">${esc(v.label)}</div>`;
      if (!datas[i]) {
        html += '<div class="answer-meta">—</div>';
      } else if (!places.length) {
        html += '<div class="answer-meta">— no places —</div>';
      } else {
        html += '<table><tr><th>Name</th><th>Category</th><th>Dist</th></tr>';
        for (const p of places) {
          const shared = keys.every((k) => !k || k.has(placeKey(p)));
          html += `<tr${shared ? '' : ' class="unshared"'}><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.distance_m)}m</td></tr>`;
        }
        html += '</table>';
      }
      html += '</div>';
    });
    html += '</div></div></div>';
  }

  views.forEach((v, i) => {
    if (!v.answer || !v.answer.data) return;
    html += `<details data-view="${i}" style="margin-top:6px"><summary style="cursor:pointer;color:${v.color}">${esc(v.label)}: response JSON</summary>`
      + `<div class="json-block">${syntaxHighlight(v.answer.data)}</div></details>`;
  });
  return html;
}

// A result's card: its point, the first column's answer and whether the
// columns' answers differ, the columns' errors, and where the point came
// from.
function cardHtml(entry, views, selected) {
  const answers = views.map((v) => v.answer || {});
  const first = answers[0] || {};
  const loading = answers.some((a) => a.loading);
  const failed = views.filter((v) => v.answer && v.answer.error);
  const classes = ['result-card'];
  if (loading) classes.push('loading');
  if (failed.length) classes.push('error');
  if (selected) classes.push('selected');
  // The coordinates with a copy button, whose `data-copy` the list's click
  // handler copies.
  const coords = `${Number(entry.lat).toFixed(5)}, ${Number(entry.lng).toFixed(5)}`;
  let html = `<div class="${classes.join(' ')}" data-id="${esc(entry.id)}">`;
  html += `<div class="result-coords">${coords}<button class="result-copy" data-copy="${coords}" title="Copy coordinates">⧉</button></div>`;
  if (first.data) {
    html += `<div class="result-name">${esc(first.data.display_name || 'Unknown location')}`;
    if (answersDiffer(answers.map((a) => a.data || null))) html += '<span class="tag" title="The columns answer differently">differs</span>';
    html += '</div>';
    const places = first.data.places || [];
    if (places.length) {
      const extra = places.length > 3 ? ` +${places.length - 3} more` : '';
      html += `<div class="result-places">${esc(places.slice(0, 3).map((p) => p.name).join(', '))}${extra}</div>`;
    }
  } else if (loading) {
    html += '<div class="result-name"><span class="loading-spinner"></span>Loading...</div>';
  } else if (!first.error) {
    html += '<div class="result-source">not asked yet: select it or Re-test</div>';
  }
  for (const v of failed) html += `<div class="result-error">${esc(v.label)}: ${esc(v.answer.error)}</div>`;
  if (entry.source) html += `<div class="result-source">${esc(entry.source)}</div>`;
  return `${html}</div>`;
}

// Nominatim's view of a result (detailHtml): its answer, its request in
// flight, or why it has none.
function nominatimView(entry) {
  const answer = entry.nominatimLoading ? { loading: true }
    : entry.nominatim ? { data: entry.nominatim }
    : entry.nominatimError ? { error: entry.nominatimError }
    : null;
  return { label: 'Nominatim', color: NOMINATIM_COLOR, dataset: null, answer };
}

// A result as the page saves it: its point, where it came from, Nominatim's
// answer and every answer of the columns, those of a column no longer shown
// too (each keeps the build that gave it), but none being asked.
function savedResult(r) {
  return {
    id: r.id, lat: r.lat, lng: r.lng, source: r.source, nominatim: r.nominatim || null,
    answers: Object.fromEntries(Object.entries(r.answers).filter(([, a]) => a && !a.loading)),
  };
}

// A result as savedResult saved it, as the page keeps it; none for a point
// off the globe. The page before the dataset columns saved the answer of its
// server as `data` and that of the minimal one as `minimal`, of datasets it
// did not record: those go, and the columns are asked again.
function storedResult(r) {
  if (!r || !onGlobe(r.lat, r.lng)) return null;
  const answers = r.answers && typeof r.answers === 'object' ? r.answers : {};
  return { id: r.id, lat: r.lat, lng: r.lng, source: r.source || null, answers, nominatim: r.nominatim || null };
}

// Writes `value` into `storage` at `key`: '' once it is in, else why not
// (a storage full, or off, throws), which the page shows beside the
// results' count until a save goes in. What the storage held stays.
function keep(storage, key, value) {
  try {
    storage.setItem(key, value);
    return '';
  } catch (e) {
    return `not saved: ${e.message}`;
  }
}

// The status line from the portal's /health: the build served (by its
// publication ID and its dir on the portal's volume, or why none), how the
// sync goes, and the builds it refused.
function statusHtml(health) {
  if (!health || typeof health !== 'object' || !health.sync) return '';
  const s = health.sync;
  const parts = [];
  const b = health.build;
  if (b) parts.push(`build ${esc(b.id)} (v${esc(b.version)}, dir ${esc(b.dir)}) · ${esc(health.datasets)} datasets`);
  else if (health.reason) parts.push(`<span class="warn">${esc(health.reason)}</span>`);
  if (s.running) {
    let running = `sync: ${esc(s.running)}`;
    if (s.progress) {
      const p = s.progress;
      running += ` (${esc(p.objects_done)}/${esc(p.objects_total)} objects, ${formatSize(p.bytes_done)} of ${formatSize(p.bytes_total)})`;
    }
    parts.push(running);
  } else {
    if (s.last_result) parts.push(`last sync ${esc(shortTime(s.last_finished))}: ${esc(s.last_result)}`);
    if (s.next_round) parts.push(`next ${esc(shortTime(s.next_round))}`);
  }
  if (s.latest && (!health.build || s.latest.date !== health.build.date)) parts.push(`latest ${esc(s.latest.date)}`);
  for (const r of s.refused || []) parts.push(`<span class="warn">refused ${esc(r.date)} (v${esc(r.version)}): ${esc(r.reason)}</span>`);
  return parts.join(' · ');
}

// The flag of a link made on a build (b=) other than the one served
// (sameBuild).
function mismatchHtml(linkBuild, served) {
  if (!linkBuild || !served || sameBuild(linkBuild, served)) return '';
  return `This link was made on build ${esc(linkBuild)}; the server serves build ${esc(served)} now, whose answers may differ.`;
}

// The key a column's answers are kept by: its dataset's id ('' for the one
// dataset of a server without /datasets, or of the portal while it waits
// for a build); none for a column without one.
function columnKey(col) {
  if (col.single) return '';
  return col.dataset ? col.dataset.id : null;
}

// The polygon overlay's next state: off, then each of `count` columns in
// turn, then off.
function nextPolygons(current, count) {
  const next = current === 'off' ? 0 : current + 1;
  return next < count ? next : 'off';
}

// What the polygon overlay on the column `column` ('off', or a place in
// `columns`) shows of a result: the dataset of that column (its key) in the
// build `build`; none while it is off or its column has no dataset.
function overlayTarget(column, columns, build) {
  const col = column === 'off' ? null : columns[column];
  const key = col ? columnKey(col) : null;
  return key === null ? null : { key, build };
}

// Whether the overlay shows another thing (overlayTarget) as `after` than
// as `before`: another dataset, another build, or none where it showed one
// or the other way round. What it drew of `before` is then of neither.
function overlayMoved(before, after) {
  if (!before || !after) return before !== after;
  return before.key !== after.key || before.build !== after.build;
}

// The polygon overlay's requests (the page's other script draws them):
// show(id, key, url) asks `url` for the polygons around the point of the
// result `id` in the dataset of column key `key`, and draws them only if,
// when they come, no other show and no clear came after it and the overlay
// still shows that result in that dataset (shown(): { id, key }, or null
// while it shows none). A show or a clear cancels the request of the show
// before it. request(url, signal) asks the server (the pacer), the request
// cancelled once `signal` aborts; draw(fc) and erase() the map.
class PolygonOverlay {
  constructor({ request, draw, erase, shown }) {
    Object.assign(this, { request, draw, erase, shown });
    this.asked = 0;
    this.cancelling = null;
  }

  // Whether the polygons came and were drawn.
  async show(id, key, url) {
    const asked = ++this.asked;
    this.cancel();
    const cancelling = new AbortController();
    this.cancelling = cancelling;
    let got;
    try {
      got = await this.request(url, cancelling.signal);
    } catch (e) {
      if (cancelling.signal.aborted) return false;
      throw e;
    } finally {
      if (this.cancelling === cancelling) this.cancelling = null;
    }
    const now = this.shown();
    if (asked !== this.asked || !now || now.id !== id || now.key !== key) return false;
    if (got.status !== 200) throw new Error(`HTTP ${got.status}: ${got.body}`);
    this.draw(JSON.parse(got.body));
    return true;
  }

  // Erases what is drawn; the request in flight is cancelled, and no answer
  // still to come is drawn.
  clear() {
    this.asked++;
    this.cancel();
    this.erase();
  }

  // Cancels the request of the last show, if it is in flight.
  cancel() {
    if (this.cancelling) this.cancelling.abort();
    this.cancelling = null;
  }
}

// -- Feedback --
// A report of someone who disagrees with an answer, as the portal's POST
// /feedback takes it: what it is of (its target: a column's reverse answer,
// its search's results, or the page), what they expected and their
// comment, and the page's link as it was. The page's other script opens the
// form in a dialog and sends it.

// The most bytes of the answer in a report's JSON: a longer one goes as the
// start of its JSON, a string, flagged answer_trimmed, so that a report
// keeps within the portal's 16 KiB.
const FEEDBACK_ANSWER_MAX = 8192;
// The fields of an address a report can say it expected, by name, and their
// labels.
const FEEDBACK_FIELDS = [['name', 'Name'], ['road', 'Road'], ['house_number', 'House number'], ['city', 'City'], ['postcode', 'Postcode'], ['country', 'Country']];
// The most characters of the form's texts and of each field.
const FEEDBACK_TEXT_MAX = 2000;
const FEEDBACK_FIELD_MAX = 200;

// The start of `s` of at most `max` bytes of UTF-8, or where `escaped` of
// its JSON string, its quotes left out: cut between characters.
function byteStart(s, max, escaped) {
  let bytes = 0;
  let end = 0;
  for (const ch of s) {
    const c = ch.codePointAt(0);
    const n = escaped && (ch === '"' || ch === '\\' || '\b\f\n\r\t'.includes(ch)) ? 2
      : escaped && (c < 0x20 || (c >= 0xd800 && c <= 0xdfff)) ? 6
      : c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    if (bytes + n > max) break;
    bytes += n;
    end += ch.length;
  }
  return s.slice(0, end);
}

// What a report of a column's reverse answer (`view`, of the result
// `entry`) is of: the column, the dataset and build that answered, the
// point, and the JSON the detail shows.
function reverseTarget(view, entry) {
  const a = view.answer;
  return {
    kind: 'reverse', label: view.label, dataset: a.dataset || (view.dataset && view.dataset.id) || null, build: a.build || null,
    point: { lat: entry.lat, lng: entry.lng }, q: null, results: null, answer: a.data,
  };
}

// What a report of a column's search answer (`view`) to `q` is of: the
// column, the dataset and build that answered, the search and its results,
// one of which the form may name.
function searchTarget(view, q) {
  const a = view.answer;
  return {
    kind: 'search', label: view.label, dataset: a.dataset || (view.dataset && view.dataset.id) || null, build: a.build || null,
    point: null, q, results: a.results, answer: a.results,
  };
}

// What a general report is of: the page as the build `served` answers it,
// at the selected result `entry`'s point where there is one.
function generalTarget(entry, served) {
  return {
    kind: 'general', label: 'The page', dataset: null, build: served || null,
    point: entry ? { lat: entry.lat, lng: entry.lng } : null, q: null, results: null, answer: null,
  };
}

// The report of `target` from the form's values (`form`, by name: text, the
// FEEDBACK_FIELDS, empty, comment, and a search's result: '' for its
// results as a whole, else the index of one) and the page's link as it is
// (`page`: the columns' tokens, the selected point and the search box's
// text). Each text goes trimmed, one left empty as null; a search's report
// is at the point of the result it names.
function feedbackReport(target, form, page) {
  const text = (v) => String(v ?? '').trim() || null;
  const expected = { text: text(form.text) };
  for (const [field] of FEEDBACK_FIELDS) expected[field] = text(form[field]);
  expected.empty = Boolean(form.empty);
  const index = target.kind === 'search' && form.result != null && form.result !== '' ? Number(form.result) : null;
  const result = index === null ? null : target.results[index];
  const point = result ? { lat: result.latitude, lng: result.longitude } : target.point;
  let answer = target.answer ?? null;
  let trimmed = false;
  const json = JSON.stringify(answer);
  if (byteStart(json, FEEDBACK_ANSWER_MAX, false) !== json) {
    answer = byteStart(json, FEEDBACK_ANSWER_MAX, true);
    trimmed = true;
  }
  return {
    kind: target.kind,
    lat: point ? point.lat : null,
    lon: point ? point.lng : null,
    q: target.q,
    result_index: index,
    dataset: target.dataset,
    build: target.build,
    answer,
    answer_trimmed: trimmed,
    expected,
    comment: text(form.comment),
    page: { columns: page.columns.slice(), point: page.point ? { lat: page.point.lat, lon: page.point.lng } : null, q: page.q || null },
  };
}

// Whether `report` says what was expected (in words, a field, or that the
// answer should be empty) or comments: the portal takes none that doesn't.
function feedbackSays(report) {
  const e = report.expected;
  return e.empty || Boolean(e.text || report.comment) || FEEDBACK_FIELDS.some(([field]) => e[field]);
}

// The form of a report of `target`: what it is of, the answer it sends, a
// search's results to name one of, what was expected, a comment, and what
// is kept of it.
function feedbackFormHtml(target) {
  const about = [esc(target.label)];
  if (target.dataset) about.push(esc(target.dataset));
  if (target.build) about.push(`build ${esc(target.build)}`);
  if (target.kind === 'search') about.push(`search “${esc(target.q)}”`);
  else if (target.point) about.push(`${Number(target.point.lat).toFixed(5)}, ${Number(target.point.lng).toFixed(5)}`);
  let html = `<h3>${target.kind === 'general' ? 'Feedback' : 'Disagree? Tell us what you expected'}</h3>`;
  html += `<div class="feedback-about">${about.join(' · ')}</div>`;
  if (target.answer != null) {
    html += `<details><summary>The answer sent with it</summary><div class="json-block">${syntaxHighlight(target.answer)}</div></details>`;
  }
  if (target.kind === 'search') {
    html += '<label class="feedback-row"><span>Which result</span><select name="result"><option value="">The results as a whole</option>';
    (target.results || []).forEach((r, i) => {
      html += `<option value="${i}">#${i + 1} ${esc(r.name)}${r.type ? ` (${esc(r.type)})` : ''}</option>`;
    });
    html += '</select></label>';
  }
  html += `<label class="feedback-row"><span>What did you expect?</span><textarea name="text" rows="2" maxlength="${FEEDBACK_TEXT_MAX}"></textarea></label>`;
  html += '<div class="feedback-fields">';
  for (const [field, label] of FEEDBACK_FIELDS) {
    html += `<label><span>${label}</span><input name="${field}" maxlength="${FEEDBACK_FIELD_MAX}" autocomplete="off"></label>`;
  }
  html += '</div><label class="feedback-check"><input type="checkbox" name="empty"> The answer should be empty</label>';
  html += `<label class="feedback-row"><span>Comment</span><textarea name="comment" rows="2" maxlength="${FEEDBACK_TEXT_MAX}"></textarea></label>`;
  html += '<div class="feedback-note">We keep what you write here with the answer, its dataset and build, and the page\'s link.'
    + ' No IP address and no email are kept: leave out anything personal.</div>';
  html += '<div class="feedback-actions"><button type="submit">Send</button><button type="button" class="tool" data-action="feedback-close">Cancel</button></div>';
  return `${html}<div class="feedback-status" role="status"></div>`;
}

// The thanks once the portal has a report, with the reports of the day and
// in all where /feedback/count told them (`count`; none where it didn't).
function feedbackThanks(count) {
  if (!count || !Number.isFinite(count.today) || !Number.isFinite(count.total)) return 'Thank you! We have your report.';
  return `Thank you! That makes ${count.today} report${count.today === 1 ? '' : 's'} today, ${count.total} in all.`;
}

// Why a report wasn't taken, from the portal's answer: what to do about a
// 413 or a 429, else its status and why.
function feedbackError(status, body) {
  if (status === 413) return 'Too long to send: shorten what you wrote.';
  if (status === 429) return 'Too many reports from here just now: try again in a minute.';
  return `Not sent: HTTP ${status}${body ? `: ${String(body).slice(0, 300)}` : ''}`;
}

// `obj` as JSON, escaped, its keys, strings, numbers and literals marked for
// their colours.
function syntaxHighlight(obj) {
  const json = JSON.stringify(obj, null, 2).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return json.replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
    function(match) {
      let cls = 'json-number';
      if (/^"/.test(match)) {
        cls = /:$/.test(match) ? 'json-key' : 'json-string';
      } else if (/true|false/.test(match)) {
        cls = 'json-bool';
      } else if (/null/.test(match)) {
        cls = 'json-null';
      }
      return `<span class="${cls}">${match}</span>`;
    }
  );
}
</script>

<script>
// -- Map setup --
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.immich.cloud/v1/style/dark.json',
  center: [0, 40],
  zoom: 3,
  // MapLibre cancels the tiles still loading for the levels a zoom passes
  // through by default, so detail only appeared once the zoom settled.
  cancelPendingTileRequestsWhileZooming: false
});
const mapLoaded = new Promise((resolve) => map.on('load', resolve));

// Marker color map
const MARKER_COLORS = {
  gray: '#888888',
  green: '#4caf80',
  blue: '#4a90d9',
  red: '#d94a4a'
};

const markers = new Map(); // id -> {marker, color, label}
const results = [];        // {id, lat, lng, source, answers: {column key: answer}, nominatim}
