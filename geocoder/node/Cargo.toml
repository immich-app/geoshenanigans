[package]
name = "geocoder-node"
version = "0.1.0"
edition = "2021"
# File::lock (server/src/place_index.rs) is stable from 1.89.
rust-version = "1.89"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "3"
query-server = { path = "../server" }
place-search = { path = "../search" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
