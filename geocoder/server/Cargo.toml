[package]
name = "query-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

# Library: pure geocoding logic, used by both the HTTP binary and the
# napi binding (geocoder/node). Lives in src/lib.rs.
[lib]
name = "query_server"
path = "src/lib.rs"

# Binary: HTTP server with axum + auth.  Lives in src/main.rs and
# imports the library via `use query_server::*;`.
[[bin]]
name = "query-server"
path = "src/main.rs"

[features]
# The arc fixture writer (src/arc_fixture.rs), for the tests of crates that read the arc files.
fixtures = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
s2 = { version = "0.2.0", default-features = false }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
memmap2 = "0.9"
libc = "0.2"
# The --domain mode's certificates. Its acceptor for axum-server is src/acme.rs, as
# rustls-acme's own (its feature axum) is for axum-server 0.8.
rustls-acme = "0.15"
axum-server = "0.9"
tokio-util = { version = "0.7", features = ["compat"] }
bcrypt = "0.19"
getrandom = "0.4"
arc-swap = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
zstd = "0.14"
sha2 = "0.11"
futures-util = "0.3"
bytes = "1"
unicode-normalization = "0.1"
# The body of a lookup's answer, which holds its place until it is sent
# (portal.rs).
http-body = "1"

# The binary's tests (the download tests' bucket) build their datasets with the library's
# fixture encoders. The test portal's server (src/portal.rs) is a bin of place-search, for the
# place search it serves, and its tests run here, beside the routes it answers as: they take
# place-search too, which only they compile.
[dev-dependencies]
query-server = { path = ".", features = ["fixtures"] }
place-search = { path = "../search" }
# The self-signed certificate of the acceptor's tests (src/acme.rs).
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }

[profile.release]
opt-level = 3
lto = true
