    # The watchdog computes the live OSM data's age at each tick (state.json's
    # osmDate), every 2 hours; 6h holds the last reading through two missed
    # ticks, which geoshenanigans-tiles-watchdog-silent covers. Protomaps' OSM
    # data is a few hours old at publication, so a day's sync keeps it under
    # ~31h; 48h is a missed day.
    - uid: geoshenanigans-tiles-osm-old
      title: Live tiles built from OSM data over 48 hours old
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The live tiles were built from OSM data more than 48 hours old.
        description: >-
          The OSM replication time of the live build is more than 48h ago. Either the sync has not switched to
          a newer build (see geoshenanigans-tiles-sync-failed and -sync-stale, and the Tiles dashboard's sync
          panels) or Protomaps has not published one: check https://build-metadata.protomaps.dev/builds.json
          for the newest key. Nothing on our side fixes the second.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 21600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              last_over_time(tiles_sync_live_osm_age_hours{project="geoshenanigans", cluster="tiles", env="prod"}[6h]) > 48
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 21600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # The Bunny log reader runs in the tiles worker's cron and pushes
    # tiles_bunny_log_rows once per processed minute, 0 included. Only once it
    # has reported in the past week (the pull zone is live) and while the
    # worker's heartbeat arrives: without that, geoshenanigans-tiles-heartbeat
    # pages for the whole worker.
    - uid: geoshenanigans-tiles-bunny-logs-silent
      title: Bunny log reader stopped reporting
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The Bunny log reader has processed no minute of request logs for 15 minutes.
        description: >-
          No tiles_bunny_log_rows sample for 15 minutes, while the worker's heartbeat still arrives, so the
          Bunny request metrics (the Tiles dashboard's Bunny CDN panels) have stopped. The Logging API key
          (BUNNY_API_KEY) or pull zone id may be wrong or rotated, the Logging API may be failing (the
          reader's tiles_bunny_log_reader_runs{result="error"} and its error lines in the Logs panel say
          which), or the reader fell further behind than the Logging API's 3 days of retention. Serving is not
          affected.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 604800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (absent_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[15m])
                and on () (count(last_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[7d])) > 0))
              and on () (count(last_over_time(tiles_heartbeat_timestamp_seconds{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 604800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # Each probe run pushes tiles_bunny_probe_runs{result} once and
    # tiles_bunny_probe_errors per region and kind with failed requests. Fires
    # per region and kind when over half the runs in 15 minutes saw an error
    # there (at least 2), or when over half the runs failed as a whole, so the
    # probe's own cadence does not matter.
    - uid: geoshenanigans-tiles-bunny-probe-errors
      title: Bunny synthetic probe sees errors
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The synthetic probe gets errors from the Bunny pull zone.
        description: >-
          Over half of the synthetic probe's runs in the past 15 minutes got a failed or wrong response for a
          tile, TileJSON or style in a region (the alert's region and kind labels), or failed as a whole. Try
          the URLs from the probe's error lines (Logs panel), e.g. https://tiles.immich.cloud/v1.json and a
          tile, and check status.bunny.net. A 404 for a tile means a missing file in the storage zone (every
          position is uploaded, so none should be); corrupt or empty bodies in a few PoPs are the gzip edge
          rule bug the middleware script works around.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              ((sum_over_time(tiles_bunny_probe_errors{project="geoshenanigans", cluster="tiles", env="prod"}[15m]) >= 2)
                / on () group_left () sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) > 0.5)
              or
              ((sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result="error"}[15m])) >= 2)
                / sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) > 0.5)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # A miss is a never-requested tile read from the nearest storage replica:
    # 18-78 ms per continent when measured, 350-530 ms when the replica lacks
    # it and Frankfurt serves it. Averaged per region over 15 minutes, so one
    # slow request does not fire. A warning: slow misses degrade the map
    # without breaking it.
    - uid: geoshenanigans-tiles-bunny-probe-slow
      title: Bunny synthetic probe sees slow misses
      condition: B
      for: 15m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The synthetic probe's uncached tiles take over 1 second to first byte.
        description: >-
          The synthetic probe's average time to first byte for never-requested tiles has been above 1s for 15
          minutes in a region (the alert's region label). The Tiles dashboard's "Probe first byte, misses"
          shows whether it is one region (a storage replica that lags: see the sync's "Replication wait by
          region", or Bunny routing that region elsewhere) or all of them (the storage zone or the middleware
          script; check status.bunny.net).
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              avg_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[15m]) > 1000
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
