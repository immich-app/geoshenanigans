        summary: The Bunny pull zone serves requests but the synthetic probe is not configured.
        description: >-
          The Bunny log reader counts requests to the pull zone, yet every synthetic probe run in the past hour
          was skipped: the worker has no BUNNY_PUBLIC_URL or GLOBALPING_TOKEN binding. Set bunny_public_url in
          deployment/modules/cloudflare/tiles-worker/tiles.prod.tfvars.json to the hostname that serves the zone
          (the test hostname before the DNS cutover, https://tiles.immich.cloud after; the same as tiles-sync.yml's
          BUNNY_PUBLIC_URL) and check GLOBALPING_TOKEN in tf_prod, then run the Tiles Worker workflow on main.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result="skipped"}[1h])) > 0)
                unless on () (sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result!="skipped"}[1h])) > 0)
                and on () (sum(sum_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[1h])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
