    # pushes no rows at all, so -bunny-logs-silent, which wants a week of rows
    # and then none, sees neither. Fires on errors in most of the runs with a
    # result other than skipped in 15 minutes (15 runs), at least 5 of them:
    # the re-read a minute later makes up for a lone failed read, and the floor
    # keeps the first runs after the settings arrive from firing on a couple.
    # Gated on nothing else: a run result is itself proof the cron runs.
