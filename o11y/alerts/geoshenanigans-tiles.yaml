          status.bunny.net and the "Probe tests" panel. The probe's error lines in
          the Logs panel ("Globalping measurement not created" or "unfinished at the deadline") give the
          answer: a 429 is the hourly quota (500 tests plus credits, also spent by manual probe sets; it
          recovers within the hour), a 401 or 403 the GLOBALPING_TOKEN worker secret. Until it recovers,
