    # A miss is a tile the edge read from the nearest storage replica (a
    # CDN-Cache other than HIT or STALE; normally the random z15 position):
    # 18-78 ms per continent when measured, 350-530 ms when the replica lacks
    # it and Frankfurt serves it. This fires at 1 s, for outages of the storage
    # zone or the middleware script; a replica that lacks files (350-530 ms)
    # stays under it and is geoshenanigans-tiles-sample-unreplicated's to find.
    # Per continent over 30 minutes (three runs at the default 10-minute
    # interval), adding up over target (the tile tested): the misses' average,
    # only while at least two of them took over 1 s, so neither a lone result
    # (the only sample when the next run is skipped) nor one outlier among
    # fast ones starts the timer. A warning: slow misses degrade the map
    # without breaking it.
    - uid: geoshenanigans-tiles-bunny-probe-slow
      title: Bunny synthetic probe sees slow misses
      condition: B
      for: 15m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The synthetic probe's uncached tiles take over 1 second to first byte.
        description: >-
          The synthetic probe's average time to first byte for tiles the edge read from storage (cache misses)
          from the alert's continent has been above 1s for 15 minutes, over 30-minute windows in which at least
          two misses took over 1s. The Tiles dashboard's "Probe first byte, misses" shows whether
          it is one continent (Bunny routing that continent to far PoPs, or its storage region down) or all
          of them (the storage zone or the middleware script; check status.bunny.net). A region merely lacking
          files is slower (350-530 ms, from Frankfurt) but under this threshold:
          geoshenanigans-tiles-sample-unreplicated reports that.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (
                sum by (continent, kind) (sum_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m]))
                  / sum by (continent, kind) (count_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m]))
                > 1000
              )
              and on (continent, kind)
              (
                sum by (continent, kind) (count_gt_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m], 1000))
                >= 2
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
