      title: Bunny log reader runs are failing
      condition: B
      for: 10m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: Most Bunny log reader runs failed or were truncated, so the Bunny request metrics are missing or low.
        description: >-
          Over half of the Bunny log reader's runs in the past 15 minutes, and at least 5, ended with
          result="error": a read of the Logging API failed after its retries, or a minute held more rows than
          the reader's page limit (30 pages of 10,000) and its counts are low. The Tiles dashboard's Bunny CDN
          panels undercount or have gaps meanwhile; serving is not affected. Its error lines in the Logs panel
          (project:="geoshenanigans" cluster:="tiles" level:="error" job:="bunny_logs") say which: "Bunny log
