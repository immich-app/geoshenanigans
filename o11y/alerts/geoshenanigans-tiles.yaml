---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaalertrulegroup_v1beta1.json
#
# tiles.immich.cloud, shipped as-is in the signed o11y bundle (o11y/render-manifests.sh).
#
# The worker sends one sample per request to o11y's serverless ingest path,
# which writes each series' sum per minute (<name>:1m_sum_samples), durations'
# histogram buckets included (<name>_bucket:1m_sum_samples{vmrange=...});
# sum_over_time() adds up the minutes. Two aggregator replicas each sum part of
# the traffic, so every query also adds up over their `aggregator` label.
#
# The Bunny path's series are plain gauges on /insert/0/. tiles-sync.yml's
# report job pushes tiles_sync_* once per run (two scheduled runs a day), and
# tiles-sync-watchdog.yml the live build's ages with its heartbeat every 2
# hours, so those rules read the last sample in a window. The worker's cron
# pushes the Bunny log reader's counts once per processed minute and the
# synthetic probe's once per run (tiles_bunny_*); sum_over_time() adds them up.
#
# Every query uses VictoriaMetricsFleet: the default VictoriaMetrics datasource
# only sees the o11y cluster's own tenant. `project: geoshenanigans` routes to
# the rootly-geoshenanigans contact point; never add `heartbeat: rootly`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: geoshenanigans-tiles
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: geoshenanigans
  interval: 1m
  rules:
    # The worker's cron sends tiles_heartbeat_timestamp_seconds to /insert/0/
    # every minute. 10 empty minutes plus `for` means the cron trigger, the worker
    # or its push to vmauth is gone: o11y sees nothing from tiles, and its
    # fleet-wide stopped-reporting rule leaves the tiles tenant out (yucca-o11y
    # docs/05). Unguarded, as version's heartbeat is: the Fleet datasource only
    # finds tenants that ingested on the query's day, so a "seen recently" guard
    # would resolve a full outage at the next UTC midnight.
    - uid: geoshenanigans-tiles-heartbeat
      title: Tiles worker heartbeat stopped
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The tiles worker has sent o11y no heartbeat for over 10 minutes.
        description: >-
          No tiles_heartbeat_timestamp_seconds sample for 10 minutes on this o11y instance (production
          o11y receives env=prod, staging env=dev). The worker's every-minute cron trigger stopped firing,
          the worker isn't deployed, or its pushes no longer reach vmauth: O11Y_TOKEN no longer matches the
          vmauth token after a rotation (apply core-infra-tf, then rerun the Tiles Worker workflow on main), or
          the gateway rejects it (the worker logs "o11y: ... answered" to Workers Logs). Check tiles-prod's
          cron events in the Cloudflare dashboard. Until this resolves, the other tiles alerts are blind.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              absent_over_time(tiles_heartbeat_timestamp_seconds{project="geoshenanigans", cluster="tiles", env="prod"}[10m])
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # The worker answers several requests a second around the clock, so 15
    # minutes without one counted is an outage. Only while the heartbeat arrives:
    # without it the metrics path is down and geoshenanigans-tiles-heartbeat pages
    # instead. The serverless path writes zeros for 5 minutes after a series' last
    # event, then nothing, so `or vector(0)` turns both into 0, and `== bool 0`
    # turns that into the 1 the threshold fires on.
    - uid: geoshenanigans-tiles-silent
      title: Tiles worker counted no requests for 15 minutes
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: tiles.immich.cloud has counted no requests for 15 minutes while its heartbeat arrives.
        description: >-
          tiles_handle_request_invocation has counted no request for 15 minutes in o11y, though the
          worker's heartbeat still arrives, so its metrics reach o11y. Either tiles.immich.cloud gets no
          requests through the worker (curl https://tiles.immich.cloud/v1.json; DNS and the workers domain in
          the Cloudflare dashboard) or o11y's serverless ingest path (vmagent-serverless) drops them while
          /insert/0/ works.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              ((sum(sum_over_time(tiles_handle_request_invocation:1m_sum_samples{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) or vector(0))
              == bool 0)
              and on () (count(last_over_time(tiles_heartbeat_timestamp_seconds{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # Failed responses over 10 minutes against all of them, with a floor of 50
    # failures so a handful at night doesn't page. `for: 5m` rides out a single
    # bad deploy minute.
    - uid: geoshenanigans-tiles-5xx
      title: Tiles worker answering 5xx
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: More than 2% of tiles.immich.cloud responses are 5xx.
        description: >-
          Over 2% of the worker's responses in the past 10 minutes were 5xx (at least 50 of them).
          The Tiles dashboard splits them by request type, and its log panel has each failure's error,
          stack and Cf-Ray (project:="geoshenanigans" cluster:="tiles" level:="error" in VictoriaLogs).
          Tigris read errors and missing D1 directory tables after a deploy are the usual causes; a deploy
          can be rolled back with the Tiles Deploy workflow or by reverting the tfvars change.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (sum(sum_over_time(tiles_response_count:1m_sum_samples{project="geoshenanigans", cluster="tiles", env="prod", status=~"5.."}[10m])) > 50)
              / sum(sum_over_time(tiles_response_count:1m_sum_samples{project="geoshenanigans", cluster="tiles", env="prod"}[10m]))
              > 0.02
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # The worker's time per request, CDN hits included, which keep most requests
    # fast. A warning: slow tiles degrade Immich's map without breaking it.
    - uid: geoshenanigans-tiles-slow
      title: Tiles worker slow
      condition: B
      for: 15m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: tiles.immich.cloud p95 time per request is above 1.5 seconds.
        description: >-
          The 95th percentile of the worker's time per request has been above 1.5s for 15 minutes.
          The Tiles dashboard shows whether it is uncached tiles in one continent (Tigris or D1 from
          there), D1 queries landing on the primary instead of a replica, or one colo (Busiest colos).
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              histogram_quantile(0.95, sum by (vmrange) (sum_over_time(tiles_handle_request_duration_bucket:1m_sum_samples{project="geoshenanigans", cluster="tiles", env="prod"}[15m])))
              > 1500
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # tiles-sync.yml's report job pushes tiles_sync_runs{status} once per run,
    # at the time it reports, so the latest run is the status series with the
    # newest sample (tlast_over_time is MetricsQL: the sample's own timestamp).
    # 26h holds a day of runs (10:07 and 16:07 UTC) plus slack; the afternoon
    # run or a manual re-run resolves a failed morning one.
    - uid: geoshenanigans-tiles-sync-failed
      title: Tiles sync failed
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The latest Tiles Sync run failed.
        description: >-
          The latest tiles-sync.yml run in the past 26h ended with status failed. state.json still names the
          build that was live before it; the storage zone may already hold some of the new build's changed
          tiles, which only uncached requests see until a run completes its purge. The
          Tiles dashboard's "Sync and watchdog logs" panel has the run's line with its URL and its error; a
          failure before the sync CLI (reading the live state, the download or its MD5) says so there. Fix it and
          dispatch Tiles Sync again, or let the next scheduled run retry: a run diffs against whatever is
          live, so a missed day is caught up by the next. "Re-run failed jobs" on an old run syncs nothing once
          the live build has moved on.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              tlast_over_time(tiles_sync_runs{project="geoshenanigans", cluster="tiles", env="prod", status="failed"}[26h])
                >= on () group_left () max(tlast_over_time(tiles_sync_runs{project="geoshenanigans", cluster="tiles", env="prod"}[26h]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # A success or a skip (the newest build was live already, or the schedule
    # is held) pushes tiles_sync_last_success_timestamp_seconds. None for 30h
    # means two scheduled days without one: failed runs, runs that never
    # reached their report (a runner that died), or a schedule GitHub stopped.
    # Only once a build has been live in the past week (the watchdog reports
    # its age only while state.json exists), so a zone before its first load
    # stays quiet, and a state.json that disappears still pages.
    - uid: geoshenanigans-tiles-sync-stale
      title: No tiles sync succeeded for 30 hours
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: No Tiles Sync run has succeeded for over 30 hours.
        description: >-
          No tiles-sync.yml run reported success or skipped in the past 30h, so the live tiles are falling
          behind Protomaps' daily builds. Check the workflow's recent runs: failed ones (see
          geoshenanigans-tiles-sync-failed and the Tiles dashboard's sync logs), runs stuck waiting for a
          pokedex runner, a runner that died before the report job (the run shows the job as lost), or a
          schedule GitHub disabled after 60 days without repository activity. A guard_rail or schema_changed
          run blocks the sync until someone acts on it, and no_state runs mean state.json is gone from the
          immich-tiles-state zone.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 604800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              absent_over_time(tiles_sync_last_success_timestamp_seconds{project="geoshenanigans", cluster="tiles", env="prod"}[30h])
              and on () (count(last_over_time(tiles_sync_live_build_age_hours{project="geoshenanigans", cluster="tiles", env="prod"}[7d])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 604800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # tiles-sync-watchdog.yml pushes the heartbeat every 2 hours whenever it
    # read the state zone, before the first load too (no state.json yet), so
    # 5h empty means at least two missed or blind runs.
    # Unguarded, as geoshenanigans-watchdog-silent is: the bundle loads in
    # production only. `for` outlasts a dropped scheduled run followed by a
    # late one.
    - uid: geoshenanigans-tiles-watchdog-silent
      title: Tiles sync watchdog stopped reporting
      condition: B
      for: 1h
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The tiles sync watchdog has not reported for over 5 hours.
        description: >-
          No tiles_sync_watchdog_heartbeat sample for 5h, so at least two 2-hourly tiles-sync-watchdog.yml
          runs did not report or could not read the live state (npm run bunny:status, which reads state.json
          from the immich-tiles-state storage zone). Without it geoshenanigans-tiles-sync-stale and
          geoshenanigans-tiles-osm-old cannot fire. Check the workflow's recent runs (GitHub disables
          scheduled workflows after 60 days without repository activity), its "Read the live build" step for a
          storage or 1Password error, and the report step for a failed push to vmauth.futostatus.com.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 18000
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              absent_over_time(tiles_sync_watchdog_heartbeat{project="geoshenanigans", cluster="tiles", env="prod"}[5h])
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 18000
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # tiles_sync_replication_complete is pushed by every run that reached the
    # replication gate: 0 when a storage region still lacked a changed file (or
    # a changed TileJSON or style) at the gate's timeout, or DESCRIBE showed one
    # missing or with other bytes. The latest such run in 26h counts; a later
    # run that replicates resolves it.
    - uid: geoshenanigans-tiles-sync-replication
      title: Tiles sync replication gate failed
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The latest tiles sync's changed files did not all reach every storage region.
        description: >-
          The replication gate of the latest sync that reached it ended with changed files missing from some
          storage regions, or with a file DESCRIBE shows missing or with other bytes than the build. Nothing
          was purged and the build stays pending, so the next run checks those files again. The run's log line
          (the dashboard's "Sync and watchdog logs") names the regions that never caught up ("never in SYD")
          and the first files still not replicated ("still not replicated: v1/15/x/y.mvt (not in SYD)").
          Bunny's replication queue is shared across the account: after a seed or a large forced sync the slow
          regions (Sydney first) lag for days, and a region that lacks a file serves it from Frankfurt, slowly,
          not as an error. While that drains, let syncs through by dispatching Tiles Sync with the regions
          input, or setting the TILES_SYNC_REGIONS repository variable, to the regions that keep up (or none),
          and clear it once geoshenanigans-tiles-sample-unreplicated has resolved. If the same few files stay
          unreplicated run after run while everything else replicates, Bunny has dropped their ReplicatedZones
          (an identical re-upload does that for good): each blocks every later sync. Check one with a DESCRIBE
          of the named path, raise it with Bunny, and let syncs through with the regions input leaving out the
          regions it lacks (deployment/modules/bunny/tiles/README.md, "A file that never replicates").
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              last_over_time(tiles_sync_replication_complete{project="geoshenanigans", cluster="tiles", env="prod"}[26h]) == bool 0
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # tiles-sync-watchdog.yml's sample job checks 100 random positions of each
    # zoom of the live build once a day (bunny:replication --live) and pushes
    # tiles_sync_sample_missing and _mismatched: positions with no file, or one
    # whose Checksum is not the live manifest's hash. Under D1b every position is
    # a file, so either is a 404 or a stale tile for users, which the sync's gate
    # never sees (it checks only the files a sync changed). The latest check in
    # 26h counts.
    - uid: geoshenanigans-tiles-sample-wrong
      title: Tiles sample check found missing or wrong tiles
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The daily sample check found tile positions missing from the Bunny zone or holding other bytes than the live build.
        description: >-
          The latest daily sample check of the live build found positions with no file in the tiles storage zone,
          or with a file whose checksum is not the live manifest's. Its log line (app:="tiles-sample-check", in
          the dashboard's "Sync and watchdog logs") gives the counts and example paths. Missing files serve 404s;
          other bytes serve another build's tile (a seed run over the live prefix with an older archive, or a
          file written by hand). `npm run bunny:status` names the live build, its prefix and any pending builds:
          revert pending builds first (dispatch Tiles Sync with the live build as `build`). Check the whole zone
          with `npm run bunny:replication -- --listing` (the live prefix; presence and regions), then repair the
          affected zooms from the live build's archive, under the live prefix and with a new checkpoint
          directory: `npm run bunny:seed -- --archive <live build>.pmtiles --prefix <live prefix> --min-zoom Z
          --max-zoom Z --verify-existing --state-dir <new dir>`. It DESCRIBEs every file, writes only missing or
          wrong ones, and refuses any archive but the live build's. Without --prefix it writes under v1, which
          is no longer live after a full rewrite, and a reused state dir skips the chunks it completed before
          (deployment/modules/bunny/tiles/README.md, "Repairs").
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              sum(last_over_time(tiles_sync_sample_missing{project="geoshenanigans", cluster="tiles", env="prod"}[26h]))
                + sum(last_over_time(tiles_sync_sample_mismatched{project="geoshenanigans", cluster="tiles", env="prod"}[26h]))
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 93600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # tiles_sync_sample_lacking{storage_region} counts the sampled positions
    # stored with the right bytes that a region does not hold yet. Per region; a
    # warning, as such a tile comes from Frankfurt, slowly, not as an error. It is
    # how the replication backlog after a seed is seen to drain.
    - uid: geoshenanigans-tiles-sample-unreplicated
      title: Tiles sample check found tiles not yet in a storage region
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: Sampled positions of the live build are not in every storage region yet.
        description: >-
          The latest daily sample check found positions of the live build that the alert's storage region does
          not hold yet, so they are served from Frankfurt there (350-530 ms instead of tens). After a seed this is
          the replication backlog draining (Sydney takes longest; days for a planet), and it resolves by itself:
          keep scheduled syncs held (TILES_SYNC_HOLD) or their gate on fewer regions (TILES_SYNC_REGIONS) until
          it does. Later, it means the account's replication queue is backed up, or files lost their replica list
          (an identical re-upload does that for good): the check's log line (app:="tiles-sample-check") names
          examples only for missing files, so list the region's lag with `npm run bunny:replication -- --listing
          --min-zoom 15 --max-zoom 15` and raise lasting gaps with Bunny.
      execErrState: Error
      noDataState: OK
      data:
