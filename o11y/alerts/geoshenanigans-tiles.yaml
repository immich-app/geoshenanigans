                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # The worker binds the probe only when tiles-worker's bunny_public_url is
    # set (with GLOBALPING_TOKEN); until then each probe run pushes
    # result="skipped". Fires when the pull zone serves requests (the log reader
    # counts rows) while every probe run in the past hour was skipped: the probe
