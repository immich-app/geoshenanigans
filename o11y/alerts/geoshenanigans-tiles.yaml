    # Each probe run pushes tiles_bunny_probe_errors{continent,kind,target} for
    # every Globalping test with a verdict (1 for a failed or wrong response, 0
    # for a good one) and tiles_bunny_probe_runs{result} once, all stamped at
    # the run's minute. kind is the cache status the edge reported and target
    # the tile tested, so after a purge the popular tile's miss is a miss
    # beside the random tile's: the ratio adds up over target. Fires per
    # continent and kind when over half the verdicts in 30 minutes were errors;
    # tests without a verdict count in neither, so runs that saw nothing of a
    # continent and kind do not dilute it. The gate takes errors in two runs:
    # one probe per continent tests each target once a run, so a target's
    # series holds one sample per run, and the largest of its sums is at least
    # 2 only when two runs failed. Summed over target, one run after a purge
    # (both tiles a miss, both failing) would be 2 already. The window must
    # hold two runs at all times: 30m does at a BUNNY_PROBE_INTERVAL_MINUTES of
    # up to 14 (10 by default; 15m never fired at 10, as a window held two
    # runs only half the time and `for` restarted). `continent`, not `region`:
    # region is an o11y identity label (world). Runs that failed at Globalping
    # itself say nothing about Bunny: geoshenanigans-tiles-bunny-probe-failing.
    - uid: geoshenanigans-tiles-bunny-probe-errors
      title: Bunny synthetic probe sees errors
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: critical
      annotations:
        summary: The synthetic probe gets errors from the Bunny pull zone.
        description: >-
          Over half of the synthetic probe's tests with a verdict in the past 30 minutes got a failed or wrong
          response from its probe in the alert's continent, for tiles of the alert's kind, and one tile failed in
          at least two runs (one run after a purge, when both tiles miss, is not enough). The kind is the
          cache status the edge reported (hit: from the edge's cache, normally the popular tile; miss: from
          storage, normally the random z15 position, and the popular tile after a purge; a test without a
          CDN-Cache header counts as the tile it tested). Try the URLs from the probe's lines (the dashboard's
          "Probe tests" panel: project:="geoshenanigans" cluster:="tiles" kind:="probe", with the PoP that answered)
          and check status.bunny.net. A 404 for a tile means a missing file in the
          storage zone (every position is uploaded, so none should be); corrupt or empty bodies in a few PoPs
          are the gzip edge rule bug the middleware script works around. The Tiles dashboard's "Probe errors"
          shows whether it is one continent or all of them.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (
                sum by (continent, kind) (sum_over_time(tiles_bunny_probe_errors{project="geoshenanigans", cluster="tiles", env="prod"}[30m]))
                  / sum by (continent, kind) (count_over_time(tiles_bunny_probe_errors{project="geoshenanigans", cluster="tiles", env="prod"}[30m]))
                > 0.5
              )
              and on (continent, kind)
              (
                max by (continent, kind) (sum_over_time(tiles_bunny_probe_errors{project="geoshenanigans", cluster="tiles", env="prod"}[30m]))
                >= 2
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # A probe run is result="error" when Globalping refused a measurement (its
    # hourly quota, which manual probe sets spend too, a bad token, a 5xx), one
    # was unfinished at the run's deadline, or none of its tests got a verdict.
    # Tests still in progress at the deadline have no verdict and count in
    # neither tiles_bunny_probe_errors nor the TTFB, so a Bunny stall that
    # keeps every test unfinished shows here, not as tile errors. Same window
    # as geoshenanigans-tiles-bunny-probe-errors; a warning, as tiles may be
    # fine: the probe is blind.
    - uid: geoshenanigans-tiles-bunny-probe-failing
      title: Bunny synthetic probe runs are failing
      condition: B
      for: 5m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: Most synthetic probe runs had a Globalping measurement error, so the probe sees little or nothing of the Bunny pull zone.
        description: >-
          Over half of the synthetic probe's runs in the past 30 minutes, and at least two, had a measurement
          error (result="error"): Globalping refused to create a measurement, did not finish one in time, or
          gave none of a target's tests a verdict. Tests unfinished at the
          deadline are not counted as tile errors, so a stall at Bunny itself also shows here: check
          status.bunny.net and the "Probe tests" panel. The probe's error lines in
          the Logs panel ("Globalping measurement not created" or "unfinished at the deadline") give the
          answer: a 429 is the hourly quota (500 tests plus credits, also spent by manual probe sets; it
          recovers within the hour), a 401 or 403 the GLOBALPING_TOKEN worker secret. Until it recovers,
          geoshenanigans-tiles-bunny-probe-errors and -probe-slow are blind.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result="error"}[30m])) >= 2)
                / sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod"}[30m])) > 0.5
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # A miss is a tile the edge read from the nearest storage replica (a
    # CDN-Cache other than HIT or STALE; normally the random z15 position):
    # 18-78 ms per continent when measured, 350-530 ms when the replica lacks
    # it and Frankfurt serves it. This fires at 1 s, for outages of the storage
    # zone or the middleware script; a replica that lacks files (350-530 ms)
    # stays under it and is geoshenanigans-tiles-sample-unreplicated's to find.
    # Per continent over 30 minutes (three runs at the default 10-minute
    # interval), adding up over target (the tile tested): the misses' average,
    # only while one target took over 1 s in at least two runs (its series
    # holds one sample per run), so neither a lone run (the only one when the
    # next run is skipped, though both tiles miss in it after a purge) nor one
    # outlier among fast ones starts the timer. A warning: slow misses degrade
    # the map without breaking it.
    - uid: geoshenanigans-tiles-bunny-probe-slow
      title: Bunny synthetic probe sees slow misses
      condition: B
      for: 15m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The synthetic probe's uncached tiles take over 1 second to first byte.
        description: >-
          The synthetic probe's average time to first byte for tiles the edge read from storage (cache misses)
          from the alert's continent has been above 1s for 15 minutes, over 30-minute windows in which one tile
          took over 1s to miss in at least two runs. The Tiles dashboard's "Probe first byte, misses" shows
          whether it is one continent (Bunny routing that continent to far PoPs, or its storage region down) or all
          of them (the storage zone or the middleware script; check status.bunny.net). A region merely lacking
          files is slower (350-530 ms, from Frankfurt) but under this threshold:
          geoshenanigans-tiles-sample-unreplicated reports that.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (
                sum by (continent, kind) (sum_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m]))
                  / sum by (continent, kind) (count_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m]))
                > 1000
              )
              and on (continent, kind)
              (
                max by (continent, kind) (count_gt_over_time(tiles_bunny_probe_ttfb_ms{project="geoshenanigans", cluster="tiles", env="prod", kind="miss"}[30m], 1000))
                >= 2
              )
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 1800
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # The worker binds the probe only when tiles-worker's bunny_public_url is
    # set (with GLOBALPING_TOKEN); until then each probe run pushes
    # result="skipped". Fires when the pull zone serves requests (the log reader
    # counts rows) while every probe run in the past hour was skipped: the probe
    # was left off, so -probe-errors, -probe-slow and -probe-failing are blind.
    # No run result at all, skipped included, is -probe-silent's.
    - uid: geoshenanigans-tiles-bunny-probe-off
      title: Bunny synthetic probe is off while the pull zone serves requests
      condition: B
      for: 30m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The Bunny pull zone serves requests but the synthetic probe is not configured.
        description: >-
          The Bunny log reader counts requests to the pull zone, yet every synthetic probe run in the past hour
          was skipped: the worker has no BUNNY_PUBLIC_URL or GLOBALPING_TOKEN binding. Set bunny_public_url in
          deployment/modules/cloudflare/tiles-worker/tiles.prod.tfvars.json to the hostname that serves the zone
          (the test hostname before the DNS cutover, https://tiles.immich.cloud after; the same as tiles-sync.yml's
          BUNNY_PUBLIC_URL) and check GLOBALPING_TOKEN in tf_prod, then run the Tiles Worker workflow on main.
          Probe runs that report nothing at all are geoshenanigans-tiles-bunny-probe-silent's.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              (sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result="skipped"}[1h])) > 0)
                unless on () (sum(sum_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod", result!="skipped"}[1h])) > 0)
                and on () (sum(sum_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[1h])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
    # Every probe run pushes tiles_bunny_probe_runs{result} at its end, skipped
    # included. A run that ends before that push sends nothing: runProbe
    # rejecting (the cron's guard logs "Bunny cron job failed"), the scheduled
    # handler killed at a CPU, subrequest or wall time limit, the push refused,
    # or a BUNNY_PROBE_INTERVAL_MINUTES so long the hour holds no run. Then no
    # probe rule fires: -probe-off wants skipped runs, the others measurements
    # or errors. Fires on an hour without a run result of any kind, while the
    # pull zone serves requests (as -probe-off) and the log reader, in the
    # same cron, reported in the past 15 minutes: a cron that stops entirely is
    # -bunny-logs-silent's or -heartbeat's. The hour holds two runs plus the
    # 45s measurement deadline at an interval of up to 29 minutes (six at the
    # default 10).
    - uid: geoshenanigans-tiles-bunny-probe-silent
      title: Bunny synthetic probe stopped reporting
      condition: B
      for: 15m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The synthetic probe has reported no run for an hour while the Bunny pull zone serves requests.
        description: >-
          No tiles_bunny_probe_runs sample of any result (ok, error or skipped) for an hour, while the Bunny log
          reader, in the same cron, counts requests to the pull zone: probe runs end before they report, so
          geoshenanigans-tiles-bunny-probe-errors, -probe-slow, -probe-failing and -probe-off are all blind. Look
          for the worker's "Bunny cron job failed" line with job:="bunny_probe" in the Logs panel (runProbe
          threw), and for tiles-prod's cron events in the Cloudflare dashboard that ended exceeding CPU,
          subrequest or wall time limits. Check that BUNNY_PROBE_INTERVAL_MINUTES (tiles-worker's
          bunny_probe_interval_minutes) is 29 or less, so the hour holds two runs. Skipped runs mean the probe
          is not configured (geoshenanigans-tiles-bunny-probe-off), not this.
      execErrState: Error
      noDataState: OK
      data:
        - refId: A
          datasourceUid: VictoriaMetricsFleet
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: A
            datasource:
              type: prometheus
              uid: VictoriaMetricsFleet
            expr: >-
              absent_over_time(tiles_bunny_probe_runs{project="geoshenanigans", cluster="tiles", env="prod"}[1h])
                and on () (sum(sum_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[1h])) > 0)
                and on () (count(last_over_time(tiles_bunny_log_rows{project="geoshenanigans", cluster="tiles", env="prod"}[15m])) > 0)
            instant: true
            range: false
            intervalMs: 1000
            maxDataPoints: 43200
        - refId: B
          datasourceUid: __expr__
          queryType: ''
          relativeTimeRange:
            from: 3600
            to: 0
          model:
            refId: B
            type: threshold
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            intervalMs: 1000
            maxDataPoints: 43200
            conditions:
              - type: query
                evaluator:
                  type: gt
                  params:
                    - 0
                operator:
                  type: and
                query:
                  params:
                    - A
                reducer:
                  type: last
                  params: []
