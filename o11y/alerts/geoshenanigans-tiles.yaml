    # The workflow compares the newest build's tiles schema version
    # (major.minor, from builds.json) with the live build's and stops before
    # the download when they differ. force skips that check, so the annotation
    # keeps style compatibility (which force cannot see) apart from the diff's
    # size (which its guard rail does).
    - uid: geoshenanigans-tiles-sync-schema
      title: Tiles sync stopped at a schema version change
      condition: B
      for: 0m
      labels:
        project: geoshenanigans
        severity: warning
      annotations:
        summary: The newest Protomaps build has another tiles schema version than the live one.
        description: >-
          The latest tiles-sync.yml run found that the newest Protomaps build's schema version differs from
          the live build's in its major or minor part, and synced nothing. Two questions decide what next, and
          the diff's size answers only the second. First, whether the live styles can render the new tiles:
          they come from map-styles' pinned @protomaps/basemaps release, which targets one schema, and a small
          diff says nothing about that. Read the basemaps changelog for the new version and test the current
          styles on the new build. Only a change known to be compatible may go in with force, which syncs it in
          place, styles unchanged, when the diff is small (up to 2% of positions; a dry run first tells the
          diff's size; new tiles meet the old styles on uncached requests until the run finishes). A change the
          styles cannot render needs map-styles moved to a basemaps release for the new schema and tested
          against the new build before switching: never force it. That, or a compatible diff over 2%, is a full
          rewrite: seed the build under a new prefix, switch with bunny:sync --adopt --replace once it has
          replicated, with STYLES_DIR the updated map-styles build (the switch writes the styles with the
          TileJSON), and delete the old prefix a week later (deployment/modules/bunny/tiles/README.md, "Full
          rewrites"). Until then every run stops here.
